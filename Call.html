
<!DOCTYPE html>

<style>
* {

body {

   INCOMING CALL
========================= */

@keyframes callerPulse {

/* =========================

========================= */

    inset: 0;

        radial-gradient(circle at center, #172448, #080b14 70%);

.active-box {

.active-avatar {

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";
let targetUsername = "";

let callId = "";

let callChannel = null;
let callChannelReady = false;

let incomingCallData = null;

let peerConnection = null;

let localStream = null;
let remoteStream = null;
let remoteAudio = null;

let isMuted = false;
let isCaller = false;
let callActive = false;
let callEnding = false;

let pendingIceCandidates = [];
let remoteDescriptionSet = false;


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls: "stun:stun.l.google.com:19302"
        },

        {
            urls: "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    async function() {

        try {

            const savedUsername =
                localStorage.getItem(
                    "chatsapp_username"
                );

            if(savedUsername) {

                currentUsername =
                    savedUsername.trim();

            }


            const {
                data
            } =
                await supabaseClient
                .auth
                .getSession();


            if(
                data &&
                data.session &&
                data.session.user
            ) {

                currentUsername =
                    data.session.user
                    .user_metadata?.username ||
                    data.session.user.email
                    .split("@")[0];

            }


            if(!currentUsername) {

                setStatus(
                    "Please log in to ChatsApp first.",
                    "red"
                );

                return;

            }


            await setupCallInbox();

        }

        catch(error) {

            console.error(
                "Startup error:",
                error
            );

            setStatus(
                "Could not start calling.",
                "red"
            );

        }

    }
);


/* =========================================
   CALL INBOX
========================================= */

async function setupCallInbox() {

    if(callChannel) {

        try {
            await supabaseClient
                .removeChannel(callChannel);
        }

        catch(error) {
            console.warn(error);
        }

        callChannel = null;
    }


    const inboxName =
        "chatsapp-call-inbox-" +
        currentUsername
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, "_");


    callChannel =
        supabaseClient.channel(
            inboxName
        );


    callChannel.on(
        "broadcast",
        {
            event: "incoming-call"
        },
        payload => {

            console.log(
                "INCOMING CALL SIGNAL:",
                payload
            );

            handleIncomingCall(
                payload.payload
            );

        }
    );


    await new Promise(
        (resolve, reject) => {

            let finished = false;

            const timeout =
                setTimeout(
                    () => {

                        if(!finished) {

                            finished = true;

                            reject(
                                new Error(
                                    "Call inbox timeout."
                                )
                            );

                        }

                    },
                    10000
                );


            callChannel.subscribe(
                status => {

                    console.log(
                        "Call inbox status:",
                        status
                    );


                    if(
                        status === "SUBSCRIBED" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        callChannelReady = true;

                        resolve();

                    }

                }
            );

        }
    );

}


/* =========================================
   VALIDATE USERNAME
========================================= */

async function validateUsername(username) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("profiles")
            .select("username")
            .ilike(
                "username",
                username
            )
            .limit(1);


        if(error) {

            console.error(
                "Username validation error:",
                error
            );

            return null;

        }


        if(
            !data ||
            data.length === 0
        ) {

            return null;

        }


        return data[0].username;

    }

    catch(error) {

        console.error(error);

        return null;

    }

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    if(callActive) {

        setStatus(
            "You are already in a call.",
            "red"
        );

        return;

    }


    const input =
        document.getElementById(
            "targetUsername"
        );


    const typedUsername =
        input.value.trim();


    if(!typedUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(
        typedUsername.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    setStatus(
        "Checking username...",
        ""
    );


    const validUsername =
        await validateUsername(
            typedUsername
        );


    if(!validUsername) {

        setStatus(
            "Invalid username ❌",
            "red"
        );

        return;

    }


    targetUsername =
        validUsername;


    callId =
        crypto.randomUUID();


    isCaller = true;
    callActive = true;
    callEnding = false;

    pendingIceCandidates = [];
    remoteDescriptionSet = false;


    setCallButtonDisabled(true);

    showActiveCall(targetUsername);

    setCallState("Connecting...");


    try {

        /*
         * IMPORTANT:
         * Create the unique call channel BEFORE
         * sending the incoming-call signal.
         */

        await createCallChannel(callId);


        await createPeerConnection();


        localStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        /*
         * Send the call invitation through
         * the receiver's permanent inbox.
         */

        await waitForChannelReady(
            callChannel
        );


        const sent =
            await callChannel.send({

                type: "broadcast",

                event: "incoming-call",

                payload: {

                    callId: callId,

                    from: currentUsername,

                    to: targetUsername,

                    offer: offer

                }

            });


        console.log(
            "CALL INVITE SENT:",
            sent
        );


        setCallState("Ringing...");

        setStatus(
            "Calling " +
            targetUsername +
            "...",
            ""
        );

    }

    catch(error) {

        console.error(
            "START CALL ERROR:",
            error
        );

        setCallState(
            "Call failed."
        );

        await resetCallState(false);

        setStatus(
            "Could not start the call.",
            "red"
        );

    }

}


/* =========================================
   INCOMING CALL
========================================= */

function handleIncomingCall(data) {

    if(
        !data ||
        !data.from ||
        !data.offer ||
        !data.callId
    ) {

        console.warn(
            "Invalid incoming call data:",
            data
        );

        return;

    }


    if(
        data.from.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        return;

    }


    if(
        callActive ||
        incomingCallData
    ) {

        return;

    }


    console.log(
        "VALID INCOMING CALL:",
        data
    );


    incomingCallData =
        data;


    targetUsername =
        data.from;


    callId =
        data.callId;


    document.getElementById(
        "callerName"
    ).innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    ).innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    ).classList.add(
        "show"
    );


    playRingtone();

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData)
        return;


    const acceptedCall =
        incomingCallData;


    incomingCallData = null;


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    stopRingtone();


    isCaller = false;
    callActive = true;
    callEnding = false;

    targetUsername =
        acceptedCall.from;

    callId =
        acceptedCall.callId;

    pendingIceCandidates = [];
    remoteDescriptionSet = false;


    showActiveCall(targetUsername);

    setCallState("Connecting...");


    try {

        /*
         * JOIN THE EXACT SAME UNIQUE CALL CHANNEL
         * THAT THE CALLER IS LISTENING ON.
         */

        await createCallChannel(
            acceptedCall.callId
        );


        await createPeerConnection();


        localStream =
            await navigator.mediaDevices.getUserMedia({
                audio: true,
                video: false
            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        /*
         * Set the caller's offer as our
         * remote description.
         */

        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                acceptedCall.offer
            )
        );


        remoteDescriptionSet = true;


        await flushPendingIceCandidates();


        /*
         * Create our answer.
         */

        const answer =
            await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        await waitForChannelReady(
            callChannel
        );


        /*
         * Send answer directly through the
         * unique call channel.
         */

        const sent =
            await callChannel.send({

                type: "broadcast",

                event: "call-answer",

                payload: {

                    callId: callId,

                    from: currentUsername,

                    to: targetUsername,

                    answer: answer

                }

            });


        console.log(
            "ANSWER SENT:",
            sent
        );


        setCallState(
            "Connecting..."
        );

    }

    catch(error) {

        console.error(
            "ACCEPT CALL ERROR:",
            error
        );


        await resetCallState(true);


        setStatus(
            "Could not accept the call.",
            "red"
        );

    }

}


/* =========================================
   UNIQUE CALL CHANNEL
========================================= */

async function createCallChannel(
    id
) {

    if(callChannel) {

        try {

            await supabaseClient
                .removeChannel(
                    callChannel
                );

        }

        catch(error) {

            console.warn(error);

        }

        callChannel = null;

    }


    const safeId =
        String(id)
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    const channelName =
        "chatsapp-call-session-" +
        safeId;


    console.log(
        "JOINING CALL CHANNEL:",
        channelName
    );


    callChannel =
        supabaseClient.channel(
            channelName
        );


    /*
     * ANSWER
     */

    callChannel.on(
        "broadcast",
        {
            event: "call-answer"
        },
        async payload => {

            console.log(
                "CALL ANSWER RECEIVED:",
                payload
            );

            await handleCallAnswer(
                payload.payload
            );

        }
    );


    /*
     * ICE
     */

    callChannel.on(
        "broadcast",
        {
            event: "ice-candidate"
        },
        async payload => {

            console.log(
                "ICE RECEIVED:",
                payload
            );

            await handleIceCandidate(
                payload.payload
            );

        }
    );


    /*
     * END CALL
     */

    callChannel.on(
        "broadcast",
        {
            event: "call-ended"
        },
        payload => {

            const data =
                payload.payload || {};


            if(
                data.callId &&
                data.callId !== callId
            ) {

                return;

            }


            console.log(
                "REMOTE ENDED CALL"
            );


            endCall(
                false,
                true
            );

        }
    );


    await waitForChannelSubscription(
        callChannel
    );


    console.log(
        "CALL CHANNEL READY:",
        channelName
    );

}


/* =========================================
   WAIT FOR SUBSCRIPTION
========================================= */

function waitForChannelSubscription(
    channel
) {

    return new Promise(
        (resolve, reject) => {

            if(!channel) {

                reject(
                    new Error(
                        "No channel."
                    )
                );

                return;

            }


            if(
                channel.state === "joined"
            ) {

                resolve();

                return;

            }


            let finished = false;


            const timeout =
                setTimeout(
                    () => {

                        if(!finished) {

                            finished = true;

                            reject(
                                new Error(
                                    "Realtime channel timeout."
                                )
                            );

                        }

                    },
                    10000
                );


            channel.subscribe(
                status => {

                    console.log(
                        "CALL CHANNEL STATUS:",
                        status
                    );


                    if(
                        status === "SUBSCRIBED" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        resolve();

                    }


                    if(
                        status === "CHANNEL_ERROR" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Realtime channel error."
                            )
                        );

                    }


                    if(
                        status === "TIMED_OUT" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Realtime channel timed out."
                            )
                        );

                    }

                }
            );

        }
    );

}


/* =========================================
   WAIT FOR CHANNEL
========================================= */

function waitForChannelReady(
    channel
) {

    return new Promise(
        (resolve, reject) => {

            if(!channel) {

                reject(
                    new Error(
                        "No channel."
                    )
                );

                return;

            }


            if(
                channel.state === "joined"
            ) {

                resolve();

                return;

            }


            const timeout =
                setTimeout(
                    () => {

                        reject(
                            new Error(
                                "Channel was not ready."
                            )
                        );

                    },
                    10000
                );


            const interval =
                setInterval(
                    () => {

                        if(
                            channel.state ===
                            "joined"
                        ) {

                            clearInterval(
                                interval
                            );

                            clearTimeout(
                                timeout
                            );

                            resolve();

                        }

                    },
                    50
                );

        }
    );

}


/* =========================================
   CREATE PEER CONNECTION
========================================= */

async function createPeerConnection() {

    if(peerConnection) {

        try {
            peerConnection.close();
        }
        catch(error) {}

        peerConnection = null;

    }


    remoteStream =
        new MediaStream();


    remoteAudio =
        document.createElement(
            "audio"
        );


    remoteAudio.autoplay = true;
    remoteAudio.playsInline = true;
    remoteAudio.controls = false;

    remoteAudio.srcObject =
        remoteStream;


    document.getElementById(
        "audioContainer"
    ).appendChild(
        remoteAudio
    );


    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    /*
     * REMOTE AUDIO
     */

    peerConnection.ontrack =
        async function(event) {

            console.log(
                "REMOTE TRACK RECEIVED:",
                event
            );


            if(
                event.streams &&
                event.streams[0]
            ) {

                event.streams[0]
                    .getTracks()
                    .forEach(
                        track => {

                            if(
                                !remoteStream
                                .getTracks()
                                .some(
                                    existing =>
                                        existing.id ===
                                        track.id
                                )
                            ) {

                                remoteStream.addTrack(
                                    track
                                );

                            }

                        }
                    );

            }


            remoteAudio.srcObject =
                remoteStream;


            try {

                await remoteAudio.play();

            }

            catch(error) {

                console.warn(
                    "Remote audio play:",
                    error
                );

            }

        };


    /*
     * ICE CANDIDATES
     */

    peerConnection.onicecandidate =
        async function(event) {

            if(
                !event.candidate ||
                !callChannel ||
                !targetUsername ||
                !callId
            ) {

                return;

            }


            try {

                await waitForChannelReady(
                    callChannel
                );


                await callChannel.send({

                    type: "broadcast",

                    event: "ice-candidate",

                    payload: {

                        callId: callId,

                        from: currentUsername,

                        to: targetUsername,

                        candidate: event.candidate

                    }

                });

            }

            catch(error) {

                console.warn(
                    "ICE send error:",
                    error
                );

            }

        };


    /*
     * CONNECTION STATE
     */

    peerConnection.onconnectionstatechange =
        function() {

            if(!peerConnection)
                return;


            const state =
                peerConnection.connectionState;


            console.log(
                "WebRTC connection state:",
                state
            );


            if(state === "connected") {

                setCallState(
                    "Connected"
                );


                setStatus(
                    "Call connected 🔊",
                    "green"
                );

            }


            if(state === "connecting") {

                setCallState(
                    "Connecting..."
                );

            }


            if(state === "failed") {

                setCallState(
                    "Connection failed."
                );

                setStatus(
                    "WebRTC connection failed.",
                    "red"
                );

            }


            if(state === "disconnected") {

                setCallState(
                    "Connection interrupted..."
                );

            }

        };


    /*
     * ICE STATE
     */

    peerConnection.oniceconnectionstatechange =
        function() {

            if(!peerConnection)
                return;


            console.log(
                "ICE connection state:",
                peerConnection.iceConnectionState
            );

        };

}


/* =========================================
   HANDLE ANSWER
========================================= */

async function handleCallAnswer(data) {

    if(!data)
        return;


    if(!isCaller)
        return;


    if(!peerConnection)
        return;


    if(data.callId !== callId)
        return;


    if(
        !data.from ||
        data.from.toLowerCase() !==
        targetUsername.toLowerCase()
    ) {

        return;

    }


    if(!data.answer)
        return;


    try {

        console.log(
            "SETTING REMOTE ANSWER"
        );


        await peerConnection.setRemoteDescription(
            new RTCSessionDescription(
                data.answer
            )
        );


        remoteDescriptionSet = true;


        await flushPendingIceCandidates();


        /*
         * DO NOT say "Connected" here.
         * WebRTC itself decides when we're
         * actually connected.
         */

        setCallState(
            "Connecting..."
        );

    }

    catch(error) {

        console.error(
            "ANSWER ERROR:",
            error
        );


        setCallState(
            "Could not connect."
        );


        setStatus(
            "Could not process the answer.",
            "red"
        );

    }

}


/* =========================================
   HANDLE ICE
========================================= */

async function handleIceCandidate(data) {

    if(!data)
        return;


    if(data.callId !== callId)
        return;


    if(
        !data.from ||
        data.from.toLowerCase() !==
        targetUsername.toLowerCase()
    ) {

        return;

    }


    if(!data.candidate)
        return;


    const candidate =
        new RTCIceCandidate(
            data.candidate
        );


    if(
        peerConnection &&
        remoteDescriptionSet
    ) {

        try {

            await peerConnection.addIceCandidate(
                candidate
            );

        }

        catch(error) {

            console.warn(
                "ICE candidate error:",
                error
            );

        }

    }

    else {

        pendingIceCandidates.push(
            candidate
        );

    }

}


/* =========================================
   FLUSH ICE
========================================= */

async function flushPendingIceCandidates() {

    if(
        !peerConnection ||
        !remoteDescriptionSet
    ) {

        return;

    }


    const candidates =
        pendingIceCandidates;


    pendingIceCandidates = [];


    for(
        const candidate
        of candidates
    ) {

        try {

            await peerConnection.addIceCandidate(
                candidate
            );

        }

        catch(error) {

            console.warn(
                "Queued ICE error:",
                error
            );

        }

    }

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   DECLINE
========================================= */

async function declineCall() {

    if(!incomingCallData)
        return;


    const declined =
        incomingCallData;


    try {

        /*
         * Join the unique call channel
         * so the caller receives the decline.
         */

        const channel =
            supabaseClient.channel(
                "chatsapp-call-session-" +
                String(
                    declined.callId
                ).replace(
                    /[^a-zA-Z0-9_-]/g,
                    "_"
                )
            );


        await waitForChannelSubscription(
            channel
        );


        await channel.send({

            type: "broadcast",

            event: "call-ended",

            payload: {

                callId:
                    declined.callId,

                from:
                    currentUsername,

                to:
                    declined.from

            }

        });


        await supabaseClient
            .removeChannel(
                channel
            );

    }

    catch(error) {

        console.warn(
            "Decline signaling error:",
            error
        );

    }


    incomingCallData = null;

    stopRingtone();


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    targetUsername = "";
    callId = "";


    setStatus(
        "Call declined.",
        ""
    );

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true,
    remoteEnded = false
) {

    if(callEnding)
        return;


    callEnding = true;


    const oldTarget =
        targetUsername;


    const oldCallId =
        callId;


    if(
        notify &&
        oldTarget &&
        oldCallId &&
        callChannel
    ) {

        try {

            await waitForChannelReady(
                callChannel
            );


            await callChannel.send({

                type: "broadcast",

                event: "call-ended",

                payload: {

                    callId: oldCallId,

                    from: currentUsername,

                    to: oldTarget

                }

            });

        }

        catch(error) {

            console.warn(
                "End-call signaling:",
                error
            );

        }

    }


    await resetCallState(
        remoteEnded
    );

}


/* =========================================
   RESET EVERYTHING
========================================= */

async function resetCallState(
    remoteEnded = false
) {

    stopRingtone();


    if(localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    try {
                        track.stop();
                    }
                    catch(error) {}

                }
            );

        localStream = null;

    }


    if(peerConnection) {

        try {

            peerConnection.ontrack = null;
            peerConnection.onicecandidate = null;
            peerConnection.close();

        }

        catch(error) {}

        peerConnection = null;

    }


    if(remoteAudio) {

        try {

            remoteAudio.pause();

            remoteAudio.srcObject = null;

            remoteAudio.remove();

        }

        catch(error) {}

        remoteAudio = null;

    }


    remoteStream = null;


    pendingIceCandidates = [];
    remoteDescriptionSet = false;


    if(callChannel) {

        try {

            await supabaseClient
                .removeChannel(
                    callChannel
                );

        }

        catch(error) {

            console.warn(error);

        }

        callChannel = null;

    }


    document.getElementById(
        "activeCall"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    isMuted = false;


    document.getElementById(
        "muteButton"
    ).innerText = "🎤";


    document.getElementById(
        "muteButton"
    ).classList.remove(
        "muted"
    );


    incomingCallData = null;

    targetUsername = "";
    callId = "";

    isCaller = false;
    callActive = false;

    callChannelReady = false;

    setCallButtonDisabled(false);

    callEnding = false;


    if(remoteEnded) {

        setStatus(
            "Call ended.",
            ""
        );

    }

    else {

        setStatus(
            "Ready to call",
            ""
        );

    }

}


/* =========================================
   SHOW ACTIVE CALL
========================================= */

function showActiveCall(username) {

    document.getElementById(
        "activeName"
    ).innerText =
        username;


    document.getElementById(
        "activeAvatar"
    ).innerText =
        username
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "activeCall"
    ).classList.add(
        "show"
    );

}


/* =========================================
   CALL STATE
========================================= */

function setCallState(text) {

    document.getElementById(
        "callState"
    ).innerText =
        text;

}


/* =========================================
   STATUS
========================================= */

function setStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        text;


    status.className =
        "status " +
        (type || "");

}


/* =========================================
   BUTTON
========================================= */

function setCallButtonDisabled(
    disabled
) {

    document.getElementById(
        "callButton"
    ).disabled =
        disabled;

}


/* =========================================
   RINGTONE
========================================= */

let ringtoneContext = null;
let ringtoneTimer = null;


function playRingtone() {

    try {

        stopRingtone();


        ringtoneContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const playBeep =
            () => {

                if(!ringtoneContext)
                    return;


                const oscillator =
                    ringtoneContext
                    .createOscillator();


                const gain =
                    ringtoneContext
                    .createGain();


                oscillator.frequency.value =
                    650;


                gain.gain.value =
                    0.08;


                oscillator.connect(
                    gain
                );


                gain.connect(
                    ringtoneContext.destination
                );


                oscillator.start();


                oscillator.stop(
                    ringtoneContext.currentTime +
                    0.25
                );

            };


        playBeep();


        ringtoneTimer =
            setInterval(
                playBeep,
                1300
            );

    }

    catch(error) {

        console.warn(
            "Ringtone error:",
            error
        );

    }

}


function stopRingtone() {

    if(ringtoneTimer) {

        clearInterval(
            ringtoneTimer
        );

        ringtoneTimer = null;

    }


    if(ringtoneContext) {

        try {
            ringtoneContext.close();
        }
        catch(error) {}

        ringtoneContext = null;

    }

}


/* =========================================
   HOME
========================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================
   PAGE CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    function() {

        stopRingtone();


        if(localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => track.stop()
                );

        }


        if(peerConnection) {

            peerConnection.close();

        }

    }
);
