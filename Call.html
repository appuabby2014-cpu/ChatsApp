<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatsApp Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Inter, Arial, sans-serif;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 20% 20%, #253b6e 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #34205d 0%, transparent 35%),
        #080b14;
}

.call-app {
    width: 100%;
    max-width: 520px;
    padding: 30px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    background: linear-gradient(
        135deg,
        #5b8cff,
        #795cff
    );

    box-shadow:
        0 10px 35px rgba(91,140,255,.35);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #818ba3;
    margin: 10px 0 30px;
}

.card {
    padding: 25px;

    border-radius: 22px;

    background: rgba(18,23,38,.9);

    border: 1px solid #283149;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

label {
    display: block;

    color: #9ca5ba;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid #30384f;

    background: #0e1220;

    color: white;

    outline: none;

    font-size: 15px;
}

input:focus {
    border-color: #638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

button {
    border: 0;

    cursor: pointer;

    color: white;

    font-weight: 700;

    border-radius: 13px;

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.call-button {
    width: 100%;

    margin-top: 15px;

    padding: 15px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    font-size: 15px;
}

.home-button {
    width: 100%;

    margin-top: 12px;

    padding: 13px;

    background: #191f31;

    border: 1px solid #30384f;
}

.status {
    text-align: center;

    margin-top: 20px;

    min-height: 22px;

    color: #7f89a2;

    font-size: 14px;
}

.status.green {
    color: #55d88a;
}

.status.red {
    color: #ff8585;
}


/* =========================
   INCOMING CALL
========================= */

.incoming {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 65%
        );

    align-items: center;
    justify-content: center;

    padding: 25px;
}

.incoming.show {
    display: flex;
}

.incoming-box {
    text-align: center;

    width: 100%;
    max-width: 400px;

    padding: 40px 25px;

    border-radius: 28px;

    background: rgba(18,23,38,.95);

    border: 1px solid #30384f;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.caller-avatar {
    width: 100px;
    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        callerPulse 1.5s infinite;
}

@keyframes callerPulse {

    0%,100% {
        box-shadow:
            0 0 0 0 rgba(91,140,255,.35);
    }

    50% {
        box-shadow:
            0 0 0 18px rgba(91,140,255,0);
    }

}

.incoming-box h2 {
    margin: 0;
    font-size: 27px;
}

.incoming-box p {
    color: #818ba3;
    margin: 10px 0 30px;
}

.incoming-buttons {
    display: flex;
    gap: 12px;
}

.accept {
    flex: 1;
    padding: 15px;
    background: #39c878;
}

.decline {
    flex: 1;
    padding: 15px;
    background: #e34f5f;
}


/* =========================
   ACTIVE CALL
========================= */

.active-call {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 70%
        );

    align-items: center;
    justify-content: center;
}

.active-call.show {
    display: flex;
}

.active-box {
    text-align: center;
}

.active-avatar {
    width: 130px;
    height: 130px;

    margin: 0 auto 25px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        activePulse 2s infinite;
}

@keyframes activePulse {

    0%,100% {
        box-shadow:
            0 0 35px rgba(91,140,255,.25);
    }

    50% {
        box-shadow:
            0 0 70px rgba(91,140,255,.55);
    }

}

.active-name {
    font-size: 28px;
    font-weight: 800;
}

.call-state {
    margin-top: 8px;
    color: #55d88a;
}

.call-controls {
    margin-top: 35px;

    display: flex;

    justify-content: center;

    gap: 15px;
}

.control {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #20283d;

    border: 1px solid #35405c;

    font-size: 22px;
}

.control.muted {
    background: #5b6380;
}

.end-call {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #e34f5f;

    font-size: 24px;
}

#audioContainer {
    display: none;
}

</style>

</head>

<body>


<div class="call-app">

    <div class="logo">
        C
    </div>

    <h1>
        ChatsApp Call
    </h1>

    <p class="subtitle">
        Voice calls with your ChatsApp friends 📞
    </p>

    <div class="card">

        <label>
            Username to call
        </label>

        <input
            id="targetUsername"
            type="text"
            placeholder="Enter username..."
            maxlength="20"
            autocomplete="off"
        >

        <button
            class="call-button"
            onclick="startCall()"
        >
            📞 Call
        </button>

        <button
            class="home-button"
            onclick="goHome()"
        >
            ← Back to ChatsApp
        </button>

        <div
            id="status"
            class="status"
        >
            Ready to call
        </div>

    </div>

</div>


<!-- INCOMING CALL -->

<div
    id="incomingCall"
    class="incoming"
>

    <div class="incoming-box">

        <div
            id="callerAvatar"
            class="caller-avatar"
        >
            C
        </div>

        <h2 id="callerName">
            Someone
        </h2>

        <p>
            📞 Incoming voice call...
        </p>

        <div class="incoming-buttons">

            <button
                class="accept"
                onclick="acceptCall()"
            >
                ✓ Accept
            </button>

            <button
                class="decline"
                onclick="declineCall()"
            >
                ✕ Decline
            </button>

        </div>

    </div>

</div>


<!-- ACTIVE CALL -->

<div
    id="activeCall"
    class="active-call"
>

    <div class="active-box">

        <div
            id="activeAvatar"
            class="active-avatar"
        >
            C
        </div>

        <div
            id="activeName"
            class="active-name"
        >
            User
        </div>

        <div
            id="callState"
            class="call-state"
        >
            Connecting...
        </div>

        <div class="call-controls">

            <button
                id="muteButton"
                class="control"
                onclick="toggleMute()"
            >
                🎤
            </button>

            <button
                class="end-call"
                onclick="endCall()"
            >
                ☎
            </button>

        </div>

    </div>

</div>


<div id="audioContainer"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let inboxChannel = null;

let callChannel = null;

let incomingCallData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let remoteAudio = null;

let isMuted = false;

let isCaller = false;

let callBusy = false;


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    async function() {

        try {

            const savedUsername =
                localStorage.getItem(
                    "chatsapp_username"
                );

            if(savedUsername) {

                currentUsername =
                    savedUsername.trim();

            }


            const {
                data
            } =
                await supabaseClient
                .auth
                .getSession();


            if(
                data &&
                data.session &&
                data.session.user
            ) {

                currentUsername =
                    data.session.user
                    .user_metadata?.username ||
                    data.session.user.email
                    .split("@")[0];

            }


            if(!currentUsername) {

                setStatus(
                    "Please log in to ChatsApp first.",
                    "red"
                );

                return;

            }


            await setupCallInbox();

            setStatus(
                "Ready to call",
                "green"
            );

        }

        catch(error) {

            console.error(
                "CALL START ERROR:",
                error
            );

            setStatus(
                "Call system failed to start.",
                "red"
            );

        }

    }
);


/* =========================================
   PERSONAL INBOX
========================================= */

async function setupCallInbox() {

    const inboxName =
        "chatsapp-call-inbox-" +
        normalizeUsername(
            currentUsername
        );


    inboxChannel =
        supabaseClient.channel(
            inboxName,
            {
                config: {
                    broadcast: {
                        ack: true,
                        self: false
                    }
                }
            }
        );


    inboxChannel
        .on(
            "broadcast",
            {
                event:
                    "incoming-call"
            },
            function(payload) {

                console.log(
                    "INCOMING CALL RECEIVED:",
                    payload
                );

                handleIncomingCall(
                    payload.payload
                );

            }
        )
        .subscribe(
            function(status) {

                console.log(
                    "INBOX STATUS:",
                    status
                );

            }
        );

}


/* =========================================
   NORMALIZE USERNAME
========================================= */

function normalizeUsername(
    username
) {

    return String(username || "")
        .trim()
        .toLowerCase()
        .replace(
            /[^a-z0-9_-]/g,
            ""
        );

}


/* =========================================
   GET SHARED CALL CHANNEL
========================================= */

async function getCallChannel(
    username
) {

    const names = [

        normalizeUsername(
            currentUsername
        ),

        normalizeUsername(
            username
        )

    ].sort();


    const channelName =
        "chatsapp-call-" +
        names[0] +
        "-" +
        names[1];


    if(
        callChannel &&
        callChannel.topic ===
        "realtime:" + channelName
    ) {

        return callChannel;

    }


    if(callChannel) {

        try {

            await supabaseClient
                .removeChannel(
                    callChannel
                );

        }

        catch(error) {

            console.warn(error);

        }

        callChannel =
            null;

    }


    callChannel =
        supabaseClient.channel(
            channelName,
            {
                config: {

                    broadcast: {

                        ack: true,

                        self: false

                    }

                }
            }
        );


    setupCallChannelListeners(
        callChannel
    );


    await new Promise(
        function(resolve, reject) {

            let finished = false;

            const timeout =
                setTimeout(
                    function() {

                        if(finished)
                            return;

                        finished = true;

                        reject(
                            new Error(
                                "Call channel timed out."
                            )
                        );

                    },
                    10000
                );


            callChannel.subscribe(
                function(status) {

                    console.log(
                        "CALL CHANNEL:",
                        channelName,
                        status
                    );


                    if(
                        status ===
                        "SUBSCRIBED"
                    ) {

                        if(finished)
                            return;

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        resolve();

                    }


                    if(
                        status ===
                        "CHANNEL_ERROR" ||
                        status ===
                        "TIMED_OUT"
                    ) {

                        if(finished)
                            return;

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Could not connect to call channel."
                            )
                        );

                    }

                }
            );

        }
    );


    return callChannel;

}


/* =========================================
   CALL CHANNEL LISTENERS
========================================= */

function setupCallChannelListeners(
    channel
) {

    channel
        .on(
            "broadcast",
            {
                event:
                    "call-answer"
            },
            async function(payload) {

                if(!isCaller)
                    return;

                if(!payload.payload)
                    return;

                if(
                    normalizeUsername(
                        payload.payload.from
                    ) !==
                    normalizeUsername(
                        targetUsername
                    )
                )
                    return;


                try {

                    await peerConnection
                        .setRemoteDescription(
                            new RTCSessionDescription(
                                payload.payload.answer
                            )
                        );


                    setCallState(
                        "Connected"
                    );

                }

                catch(error) {

                    console.error(
                        "ANSWER ERROR:",
                        error
                    );

                    setCallState(
                        "Connection failed."
                    );

                }

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "call-declined"
            },
            function(payload) {

                if(!isCaller)
                    return;

                if(
                    !payload.payload
                )
                    return;

                if(
                    normalizeUsername(
                        payload.payload.from
                    ) !==
                    normalizeUsername(
                        targetUsername
                    )
                )
                    return;


                setCallState(
                    "Call declined."
                );


                setTimeout(
                    function() {

                        endCall(
                            false
                        );

                    },
                    800
                );

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "call-ended"
            },
            function(payload) {

                if(
                    !payload.payload
                )
                    return;

                if(
                    normalizeUsername(
                        payload.payload.from
                    ) !==
                    normalizeUsername(
                        targetUsername
                    )
                )
                    return;


                endCall(
                    false
                );

            }
        );

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    if(callBusy) {

        setStatus(
            "You are already in a call.",
            "red"
        );

        return;

    }


    targetUsername =
        document
        .getElementById(
            "targetUsername"
        )
        .value
        .trim();


    if(!targetUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(
        normalizeUsername(
            targetUsername
        ) ===
        normalizeUsername(
            currentUsername
        )
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    /*
       IMPORTANT:
       Keep your existing username-validation
       code/database check here if your current
       Call.html already has one.
    */


    callBusy =
        true;

    isCaller =
        true;


    try {

        setStatus(
            "Connecting to call system...",
            ""
        );


        const channel =
            await getCallChannel(
                targetUsername
            );


        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                function(track) {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        await waitForIceGathering();


        const finalOffer =
            peerConnection
            .localDescription;


        showActiveCall(
            targetUsername
        );


        setCallState(
            "Ringing..."
        );


        const response =
            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-offer-ready",

                payload: {

                    from:
                        currentUsername,

                    offer:
                        finalOffer

                }

            });


        console.log(
            "CALL SIGNAL RESPONSE:",
            response
        );


        if(response !== "ok") {

            console.warn(
                "Broadcast response:",
                response
            );

        }

    }

    catch(error) {

        console.error(
            "START CALL ERROR:",
            error
        );


        setStatus(
            "Could not start call.",
            "red"
        );


        await cleanupCall(
            false
        );

    }

}


/* =========================================
   INCOMING CALL
========================================= */

function handleIncomingCall(
    data
) {

    if(!data)
        return;

    if(!data.from)
        return;

    if(!data.offer)
        return;


    if(
        normalizeUsername(
            data.from
        ) ===
        normalizeUsername(
            currentUsername
        )
    )
        return;


    if(callBusy) {

        /*
           If already busy, immediately tell
           the caller this call cannot be accepted.
        */

        sendBusyResponse(
            data.from
        );

        return;

    }


    incomingCallData =
        data;


    targetUsername =
        data.from;


    document.getElementById(
        "callerName"
    ).innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    ).innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    ).classList.add(
        "show"
    );


    playIncomingSound();

}


/* =========================================
   BUSY RESPONSE
========================================= */

async function sendBusyResponse(
    username
) {

    try {

        const channel =
            await getCallChannel(
                username
            );


        await channel.send({

            type:
                "broadcast",

            event:
                "call-declined",

            payload: {

                from:
                    currentUsername

            }

        });

    }

    catch(error) {

        console.warn(
            error
        );

    }

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData)
        return;


    callBusy =
        true;


    stopIncomingSound();


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    isCaller =
        false;


    try {

        const caller =
            incomingCallData.from;


        targetUsername =
            caller;


        const offer =
            incomingCallData.offer;


        const channel =
            await getCallChannel(
                caller
            );


        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                function(track) {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    offer
                )
            );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await waitForIceGathering();


        const finalAnswer =
            peerConnection
            .localDescription;


        showActiveCall(
            targetUsername
        );


        setCallState(
            "Connecting..."
        );


        await channel.send({

            type:
                "broadcast",

            event:
                "call-answer",

            payload: {

                from:
                    currentUsername,

                answer:
                    finalAnswer

            }

        });


        setCallState(
            "Connected"
        );


        incomingCallData =
            null;

    }

    catch(error) {

        console.error(
            "ACCEPT CALL ERROR:",
            error
        );


        setCallState(
            "Connection failed."
        );


        await cleanupCall(
            false
        );

    }

}


/* =========================================
   DECLINE CALL
========================================= */

async function declineCall() {

    if(!incomingCallData)
        return;


    const caller =
        incomingCallData.from;


    stopIncomingSound();


    try {

        const channel =
            await getCallChannel(
                caller
            );


        await channel.send({

            type:
                "broadcast",

            event:
                "call-declined",

            payload: {

                from:
                    currentUsername

            }

        });

    }

    catch(error) {

        console.error(
            "DECLINE ERROR:",
            error
        );

    }


    incomingCallData =
        null;


    targetUsername =
        "";


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    setStatus(
        "Call declined.",
        ""
    );

}


/* =========================================
   CREATE PEER CONNECTION
========================================= */

async function createPeerConnection() {

    if(peerConnection) {

        peerConnection.close();

    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    remoteStream =
        new MediaStream();


    remoteAudio =
        document.createElement(
            "audio"
        );


    remoteAudio.autoplay =
        true;

    remoteAudio.playsInline =
        true;

    remoteAudio.controls =
        false;

    remoteAudio.srcObject =
        remoteStream;


    document
        .getElementById(
            "audioContainer"
        )
        .appendChild(
            remoteAudio
        );


    peerConnection.ontrack =
        function(event) {

            console.log(
                "REMOTE AUDIO TRACK RECEIVED"
            );


            event.streams[0]
                .getTracks()
                .forEach(
                    function(track) {

                        remoteStream
                            .addTrack(
                                track
                            );

                    }
                );


            remoteAudio
                .play()
                .catch(
                    function(error) {

                        console.warn(
                            "Audio play blocked:",
                            error
                        );

                    }
                );

        };


    peerConnection.onconnectionstatechange =
        function() {

            console.log(
                "WEBRTC STATE:",
                peerConnection
                .connectionState
            );


            if(
                peerConnection
                .connectionState ===
                "connected"
            ) {

                setCallState(
                    "Connected"
                );

            }


            if(
                peerConnection
                .connectionState ===
                "failed"
            ) {

                setCallState(
                    "Connection failed."
                );

            }


            if(
                peerConnection
                .connectionState ===
                "disconnected"
            ) {

                setCallState(
                    "Connection interrupted."
                );

            }

        };

}


/* =========================================
   WAIT FOR ICE
========================================= */

function waitForIceGathering() {

    return new Promise(
        function(resolve) {

            if(
                !peerConnection ||
                peerConnection
                .iceGatheringState ===
                "complete"
            ) {

                resolve();

                return;

            }


            function checkState() {

                if(
                    !peerConnection ||
                    peerConnection
                    .iceGatheringState ===
                    "complete"
                ) {

                    peerConnection
                        ?.removeEventListener(
                            "icegatheringstatechange",
                            checkState
                        );

                    resolve();

                }

            }


            peerConnection
                .addEventListener(
                    "icegatheringstatechange",
                    checkState
                );


            setTimeout(
                resolve,
                8000
            );

        }
    );

}


/* =========================================
   SHOW ACTIVE CALL
========================================= */

function showActiveCall(
    username
) {

    document.getElementById(
        "activeName"
    ).innerText =
        username;


    document.getElementById(
        "activeAvatar"
    ).innerText =
        username
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "activeCall"
    ).classList.add(
        "show"
    );

}


/* =========================================
   CALL STATE
========================================= */

function setCallState(
    text
) {

    document.getElementById(
        "callState"
    ).innerText =
        text;

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            function(track) {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true
) {

    stopIncomingSound();


    if(
        notify &&
        targetUsername
    ) {

        try {

            const channel =
                await getCallChannel(
                    targetUsername
                );


            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    from:
                        currentUsername

                }

            });

        }

        catch(error) {

            console.warn(
                "END CALL SIGNAL ERROR:",
                error
            );

        }

    }


    await cleanupCall(
        false
    );

}


/* =========================================
   CLEANUP
========================================= */

async function cleanupCall(
    removeChannel = false
) {

    stopIncomingSound();


    if(localStream) {

        localStream
            .getTracks()
            .forEach(
                function(track) {

                    track.stop();

                }
            );

        localStream =
            null;

    }


    if(peerConnection) {

        peerConnection.ontrack =
            null;

        peerConnection.close();

        peerConnection =
            null;

    }


    if(remoteAudio) {

        remoteAudio.srcObject =
            null;

        remoteAudio.remove();

        remoteAudio =
            null;

    }


    remoteStream =
        null;


    if(
        removeChannel &&
        callChannel
    ) {

        try {

            await supabaseClient
                .removeChannel(
                    callChannel
                );

        }

        catch(error) {

            console.warn(
                error
            );

        }

        callChannel =
            null;

    }


    document.getElementById(
        "activeCall"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    isMuted =
        false;


    document.getElementById(
        "muteButton"
    ).innerText =
        "🎤";


    document.getElementById(
        "muteButton"
    ).classList.remove(
        "muted"
    );


    incomingCallData =
        null;


    targetUsername =
        "";


    callBusy =
        false;


    isCaller =
        false;


    setStatus(
        "Ready to call",
        "green"
    );

}


/* =========================================
   INCOMING SOUND
========================================= */

let incomingAudioContext =
    null;

let incomingOscillator =
    null;

let incomingGain =
    null;

let incomingSoundTimer =
    null;


function playIncomingSound() {

    stopIncomingSound();


    try {

        incomingAudioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        incomingGain =
            incomingAudioContext
            .createGain();


        incomingGain.gain.value =
            0.08;


        incomingGain.connect(
            incomingAudioContext.destination
        );


        function beep() {

            if(
                !incomingAudioContext
            )
                return;


            incomingOscillator =
                incomingAudioContext
                .createOscillator();


            incomingOscillator.type =
                "sine";


            incomingOscillator.frequency
                .value =
                700;


            incomingOscillator.connect(
                incomingGain
            );


            incomingOscillator.start();


            incomingOscillator.stop(
                incomingAudioContext
                .currentTime +
                0.35
            );

        }


        beep();


        incomingSoundTimer =
            setInterval(
                beep,
                1200
            );

    }

    catch(error) {

        console.warn(
            "Incoming sound unavailable:",
            error
        );

    }

}


function stopIncomingSound() {

    if(incomingSoundTimer) {

        clearInterval(
            incomingSoundTimer
        );

        incomingSoundTimer =
            null;

    }


    if(incomingOscillator) {

        try {

            incomingOscillator.stop();

        }

        catch(error) {}

        incomingOscillator =
            null;

    }


    if(incomingGain) {

        try {

            incomingGain.disconnect();

        }

        catch(error) {}

        incomingGain =
            null;

    }


    if(incomingAudioContext) {

        try {

            incomingAudioContext.close();

        }

        catch(error) {}

        incomingAudioContext =
            null;

    }

}

   STATUS
========================================= */

function setStatus(

    type
) {

    const status =
        document.getElementById(

        );


    status.innerText =

}

                    function(track) {

                );

        }

    }
);
