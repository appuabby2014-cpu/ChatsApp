<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatsApp Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

/* =========================================
   GLOBAL
========================================= */

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Inter,
        Arial,
        sans-serif;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    background:
        radial-gradient(
            circle at 20% 20%,
            #253b6e 0%,
            transparent 35%
        ),

        radial-gradient(
            circle at 80% 80%,
            #34205d 0%,
            transparent 35%
        ),

        #080b14;

}


/* =========================================
   MAIN APP
========================================= */

.call-app {

    width: 100%;

    max-width: 520px;

    padding: 30px;

}


/* =========================================
   LOGO
========================================= */

.logo {

    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 22px;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 32px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    box-shadow:
        0 10px 35px
        rgba(91,140,255,.35);

}


/* =========================================
   TITLE
========================================= */

h1 {

    text-align: center;

    margin: 0;

    font-size: 32px;

}

.subtitle {

    text-align: center;

    color: #818ba3;

    margin:
        10px 0
        30px;

}


/* =========================================
   CARD
========================================= */

.card {

    padding: 25px;

    border-radius: 22px;

    background:
        rgba(18,23,38,.9);

    border:
        1px solid #283149;

    box-shadow:
        0 25px 70px
        rgba(0,0,0,.45);

}


/* =========================================
   INPUT
========================================= */

label {

    display: block;

    color: #9ca5ba;

    font-size: 13px;

    font-weight: 600;

    margin-bottom: 8px;

}

input {

    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border:
        1px solid #30384f;

    background: #0e1220;

    color: white;

    outline: none;

    font-size: 15px;

}

input:focus {

    border-color: #638cff;

    box-shadow:
        0 0 0 3px
        rgba(99,140,255,.1);

}


/* =========================================
   BUTTONS
========================================= */

button {

    border: 0;

    cursor: pointer;

    color: white;

    font-weight: 700;

    border-radius: 13px;

    transition: .2s;

}

button:hover {

    transform:
        translateY(-2px);

}

button:disabled {

    opacity: .5;

    cursor: not-allowed;

    transform: none;

}


/* =========================================
   CALL BUTTON
========================================= */

.call-button {

    width: 100%;

    margin-top: 15px;

    padding: 15px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    font-size: 15px;

}


/* =========================================
   HOME BUTTON
========================================= */

.home-button {

    width: 100%;

    margin-top: 12px;

    padding: 13px;

    background: #191f31;

    border:
        1px solid #30384f;

}


/* =========================================
   STATUS
========================================= */

.status {

    text-align: center;

    margin-top: 20px;

    min-height: 22px;

    color: #7f89a2;

    font-size: 14px;

}

.status.green {

    color: #55d88a;

}

.status.red {

    color: #ff8585;

}


/* =========================================
   INCOMING CALL
========================================= */

.incoming {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 65%
        );

    align-items: center;

    justify-content: center;

    padding: 25px;

}

.incoming.show {

    display: flex;

}

.incoming-box {

    text-align: center;

    width: 100%;

    max-width: 400px;

    padding:
        40px 25px;

    border-radius: 28px;

    background:
        rgba(18,23,38,.95);

    border:
        1px solid #30384f;

    box-shadow:
        0 30px 100px
        rgba(0,0,0,.65);

}


/* =========================================
   CALLER AVATAR
========================================= */

.caller-avatar {

    width: 100px;

    height: 100px;

    margin:
        0 auto 20px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 40px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        callerPulse 1.5s infinite;

}

@keyframes callerPulse {

    0%, 100% {

        box-shadow:
            0 0 0 0
            rgba(91,140,255,.35);

    }

    50% {

        box-shadow:
            0 0 0 18px
            rgba(91,140,255,0);

    }

}


/* =========================================
   INCOMING TEXT
========================================= */

.incoming-box h2 {

    margin: 0;

    font-size: 27px;

}

.incoming-box p {

    color: #818ba3;

    margin:
        10px 0
        30px;

}


/* =========================================
   INCOMING BUTTONS
========================================= */

.incoming-buttons {

    display: flex;

    gap: 12px;

}

.accept {

    flex: 1;

    padding: 15px;

    background: #39c878;

}

.decline {

    flex: 1;

    padding: 15px;

    background: #e34f5f;

}


/* =========================================
   ACTIVE CALL
========================================= */

.active-call {

    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 70%
        );

    align-items: center;

    justify-content: center;

}

.active-call.show {

    display: flex;

}

.active-box {

    text-align: center;

}


/* =========================================
   ACTIVE AVATAR
========================================= */

.active-avatar {

    width: 130px;

    height: 130px;

    margin:
        0 auto 25px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 50px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        activePulse 2s infinite;

}

@keyframes activePulse {

    0%, 100% {

        box-shadow:
            0 0 35px
            rgba(91,140,255,.25);

    }

    50% {

        box-shadow:
            0 0 70px
            rgba(91,140,255,.55);

    }

}


/* =========================================
   ACTIVE CALL TEXT
========================================= */

.active-name {

    font-size: 28px;

    font-weight: 800;

}

.call-state {

    margin-top: 8px;

    color: #55d88a;

}


/* =========================================
   CALL CONTROLS
========================================= */

.call-controls {

    margin-top: 35px;

    display: flex;

    justify-content: center;

    gap: 15px;

}

.control {

    width: 58px;

    height: 58px;

    border-radius: 50%;

    background: #20283d;

    border:
        1px solid #35405c;

    font-size: 22px;

}

.control.muted {

    background: #5b6380;

}

.end-call {

    width: 65px;

    height: 65px;

    border-radius: 50%;

    background: #e34f5f;

    font-size: 24px;

}


/* =========================================
   AUDIO
========================================= */

#audioContainer {

    position: fixed;

    width: 1px;

    height: 1px;

    opacity: 0;

    pointer-events: none;

}

</style>

</head>


<body>


<!-- =========================================
     MAIN CALL PAGE
========================================= -->

<div class="call-app">

    <div class="logo">
        C
    </div>

    <h1>
        ChatsApp Call
    </h1>

    <p class="subtitle">
        Voice calls with your ChatsApp friends 📞
    </p>


    <div class="card">

        <label>
            Username to call
        </label>


        <input
            id="targetUsername"
            type="text"
            placeholder="Enter username..."
            maxlength="20"
            autocomplete="off"
        >


        <button
            id="callButton"
            class="call-button"
            onclick="startCall()"
        >
            📞 Call
        </button>


        <button
            class="home-button"
            onclick="goHome()"
        >
            ← Back to ChatsApp
        </button>


        <div
            id="status"
            class="status"
        >
            Ready to call
        </div>

    </div>

</div>


<!-- =========================================
     INCOMING CALL
========================================= -->

<div
    id="incomingCall"
    class="incoming"
>

    <div class="incoming-box">


        <div
            id="callerAvatar"
            class="caller-avatar"
        >
            C
        </div>


        <h2 id="callerName">
            Someone
        </h2>


        <p>
            📞 Incoming voice call...
        </p>


        <div class="incoming-buttons">


            <button
                class="accept"
                onclick="acceptCall()"
            >
                ✓ Accept
            </button>


            <button
                class="decline"
                onclick="declineCall()"
            >
                ✕ Decline
            </button>


        </div>

    </div>

</div>


<!-- =========================================
     ACTIVE CALL
========================================= -->

<div
    id="activeCall"
    class="active-call"
>

    <div class="active-box">


        <div
            id="activeAvatar"
            class="active-avatar"
        >
            C
        </div>


        <div
            id="activeName"
            class="active-name"
        >
            User
        </div>


        <div
            id="callState"
            class="call-state"
        >
            Connecting...
        </div>


        <div class="call-controls">


            <button
                id="muteButton"
                class="control"
                onclick="toggleMute()"
            >
                🎤
            </button>


            <button
                class="end-call"
                onclick="endCall()"
            >
                ☎
            </button>


        </div>

    </div>

</div>


<div id="audioContainer"></div>


<script>


/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";


const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let callId = "";

let inboxChannel = null;

let callChannel = null;

let callChannelReady = false;

let incomingCallData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let remoteAudio = null;

let isMuted = false;

let isCaller = false;

let callActive = false;

let callEnding = false;

let remoteDescriptionSet = false;


/*
 * We deliberately use non-trickle ICE.
 *
 * That means we wait until ICE gathering
 * has finished before sending the SDP.
 *
 * This prevents candidates from being lost
 * while the other person is still joining
 * the call channel.
 */

let iceGatheringComplete = false;


/* =========================================
   RTC CONFIG
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   STARTUP
========================================= */

window.addEventListener(
    "load",
    async function() {

        try {

            const savedUsername =
                localStorage.getItem(
                    "chatsapp_username"
                );


            if(savedUsername) {

                currentUsername =
                    savedUsername.trim();

            }


            const {
                data
            } =
                await supabaseClient
                .auth
                .getSession();


            if(
                data &&
                data.session &&
                data.session.user
            ) {

                currentUsername =
                    data.session.user
                    .user_metadata?.username ||

                    data.session.user.email
                    .split("@")[0];

            }


            if(!currentUsername) {

                setStatus(
                    "Please log in to ChatsApp first.",
                    "red"
                );

                return;

            }


            console.log(
                "CALL PAGE USER:",
                currentUsername
            );


            await setupCallInbox();


            setStatus(
                "Ready to call",
                ""
            );

        }

        catch(error) {

            console.error(
                "STARTUP ERROR:",
                error
            );

            setStatus(
                "Could not start calling.",
                "red"
            );

        }

    }
);


/* =========================================
   PERMANENT CALL INBOX
========================================= */

async function setupCallInbox() {

    if(inboxChannel) {

        try {

            await supabaseClient
                .removeChannel(
                    inboxChannel
                );

        }

        catch(error) {}

        inboxChannel = null;

    }


    const safeUsername =
        currentUsername
        .toLowerCase()
        .replace(
            /[^a-z0-9_-]/g,
            "_"
        );


    const inboxName =
        "chatsapp-call-inbox-" +
        safeUsername;


    console.log(
        "JOINING INBOX:",
        inboxName
    );


    inboxChannel =
        supabaseClient.channel(
            inboxName,
            {
                config: {

                    broadcast: {

                        ack: true

                    }

                }

            }
        );


    inboxChannel.on(

        "broadcast",

        {
            event:
                "incoming-call"

        },

        payload => {

            console.log(
                "INCOMING CALL:",
                payload
            );


            handleIncomingCall(
                payload.payload
            );

        }

    );


    await waitForChannelSubscription(
        inboxChannel
    );


    console.log(
        "CALL INBOX READY"
    );

}


/* =========================================
   USERNAME VALIDATION
========================================= */

async function validateUsername(
    username
) {

    try {

        const {
            data,
            error
        } =
            await supabaseClient
            .from("profiles")
            .select("username")
            .ilike(
                "username",
                username
            )
            .limit(1);


        if(error) {

            console.error(
                "USERNAME ERROR:",
                error
            );

            return null;

        }


        if(
            !data ||
            data.length === 0
        ) {

            return null;

        }


        return data[0].username;

    }

    catch(error) {

        console.error(
            error
        );

        return null;

    }

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    if(callActive) {

        setStatus(
            "You are already in a call.",
            "red"
        );

        return;

    }


    if(!currentUsername) {

        setStatus(
            "You are not logged in.",
            "red"
        );

        return;

    }


    const input =
        document.getElementById(
            "targetUsername"
        );


    const typedUsername =
        input.value.trim();


    if(!typedUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(
        typedUsername.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    setCallButtonDisabled(true);


    setStatus(
        "Checking username...",
        ""
    );


    const validUsername =
        await validateUsername(
            typedUsername
        );


    if(!validUsername) {

        setCallButtonDisabled(false);

        setStatus(
            "Invalid username ❌",
            "red"
        );

        return;

    }


    targetUsername =
        validUsername;


    callId =
        crypto.randomUUID();


    isCaller = true;

    callActive = true;

    callEnding = false;

    remoteDescriptionSet = false;

    iceGatheringComplete = false;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Preparing call..."
    );


    try {

        /*
         * Create the unique signaling channel.
         */

        await createCallChannel(
            callId
        );


        /*
         * Create WebRTC.
         */

        await createPeerConnection();


        /*
         * Ask for microphone.
         */

        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        /*
         * Create offer.
         */

        const offer =
            await peerConnection.createOffer();


        await peerConnection.setLocalDescription(
            offer
        );


        /*
         * WAIT FOR ICE GATHERING.
         *
         * This is one of the biggest fixes.
         */

        setCallState(
            "Preparing connection..."
        );


        await waitForIceGatheringComplete();


        /*
         * Get the final local description.
         */

        const finalOffer =
            peerConnection.localDescription;


        if(!finalOffer) {

            throw new Error(
                "Local offer was not created."
            );

        }


        /*
         * Send invitation through
         * receiver's permanent inbox.
         */

        const invitePayload = {

            callId:

                callId,

            from:

                currentUsername,

            to:

                targetUsername,

            offer: {

                type:
                    finalOffer.type,

                sdp:
                    finalOffer.sdp

            }

        };


        const inviteChannel =
            supabaseClient.channel(

                "chatsapp-call-inbox-" +

                targetUsername
                .toLowerCase()
                .replace(
                    /[^a-z0-9_-]/g,
                    "_"
                ),

                {

                    config: {

                        broadcast: {

                            ack: true

                        }

                    }

                }

            );


        await waitForChannelSubscription(
            inviteChannel
        );


        const result =
            await inviteChannel.send({

                type:
                    "broadcast",

                event:
                    "incoming-call",

                payload:
                    invitePayload

            });


        console.log(
            "INVITE RESULT:",
            result
        );


        await supabaseClient
            .removeChannel(
                inviteChannel
            );


        if(result === "error") {

            throw new Error(
                "Supabase rejected the call invitation."
            );

        }


        setCallState(
            "Ringing..."
        );


        setStatus(
            "Calling " +
            targetUsername +
            "...",
            ""
        );

    }

    catch(error) {

        console.error(
            "START CALL ERROR:",
            error
        );


        await resetCallState(
            false
        );


        setStatus(
            getCallErrorMessage(
                error
            ),
            "red"
        );

    }

}


/* =========================================
   INCOMING CALL
========================================= */

function handleIncomingCall(
    data
) {

    if(
        !data ||
        !data.from ||
        !data.offer ||
        !data.callId
    ) {

        console.warn(
            "INVALID CALL:",
            data
        );

        return;

    }


    if(
        data.from.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        return;

    }


    if(
        callActive ||
        incomingCallData
    ) {

        return;

    }


    console.log(
        "VALID INCOMING CALL:",
        data
    );


    incomingCallData =
        data;


    targetUsername =
        data.from;


    callId =
        data.callId;


    document.getElementById(
        "callerName"
    ).innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    ).innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    ).classList.add(
        "show"
    );


    playRingtone();

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData) {

        return;

    }


    const acceptedCall =
        incomingCallData;


    /*
     * Clear the incoming state immediately.
     */

    incomingCallData = null;


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    stopRingtone();


    isCaller = false;

    callActive = true;

    callEnding = false;

    targetUsername =
        acceptedCall.from;

    callId =
        acceptedCall.callId;

    remoteDescriptionSet = false;

    iceGatheringComplete = false;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Connecting..."
    );


    setStatus(
        "Accepting call...",
        ""
    );


    try {

        /*
         * Join exact call session.
         */

        await createCallChannel(
            acceptedCall.callId
        );


        /*
         * Create peer connection.
         */

        await createPeerConnection();


        /*
         * Microphone permission.
         */

        localStream =
            await navigator.mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection.addTrack(
                        track,
                        localStream
                    );

                }
            );


        /*
         * Set caller offer.
         */

        await peerConnection.setRemoteDescription(

            new RTCSessionDescription({

                type:
                    acceptedCall.offer.type,

                sdp:
                    acceptedCall.offer.sdp

            })

        );


        remoteDescriptionSet = true;


        console.log(
            "REMOTE OFFER SET"
        );


        /*
         * Create answer.
         */

        const answer =
            await peerConnection.createAnswer();


        await peerConnection.setLocalDescription(
            answer
        );


        /*
         * Wait for ALL local ICE.
         */

        setCallState(
            "Preparing connection..."
        );


        await waitForIceGatheringComplete();


        const finalAnswer =
            peerConnection.localDescription;


        if(!finalAnswer) {

            throw new Error(
                "Local answer was not created."
            );

        }


        /*
         * Send answer.
         */

        await waitForChannelReady(
            callChannel
        );


        const result =
            await callChannel.send({

                type:
                    "broadcast",

                event:
                    "call-answer",

                payload: {

                    callId:
                        callId,

                    from:
                        currentUsername,

                    to:
                        targetUsername,

                    answer: {

                        type:
                            finalAnswer.type,

                        sdp:
                            finalAnswer.sdp

                    }

                }

            });


        console.log(
            "ANSWER RESULT:",
            result
        );


        if(result === "error") {

            throw new Error(
                "Supabase rejected the call answer."
            );

        }


        setCallState(
            "Connecting..."
        );


        setStatus(
            "Call accepted. Connecting...",
            ""
        );

    }

    catch(error) {

        console.error(
            "ACCEPT CALL ERROR:",
            error
        );


        await resetCallState(
            false
        );


        setStatus(
            getCallErrorMessage(
                error
            ),
            "red"
        );

    }

}


/* =========================================
   CREATE CALL CHANNEL
========================================= */

async function createCallChannel(
    id
) {

    /*
     * Remove previous call channel.
     */

    if(callChannel) {

        try {

            await supabaseClient
                .removeChannel(
                    callChannel
                );

        }

        catch(error) {}

        callChannel = null;

    }


    const safeId =
        String(id)
        .replace(
            /[^a-zA-Z0-9_-]/g,
            "_"
        );


    const channelName =
        "chatsapp-call-session-" +
        safeId;


    console.log(
        "JOINING CALL CHANNEL:",
        channelName
    );


    callChannel =
        supabaseClient.channel(

            channelName,

            {

                config: {

                    broadcast: {

                        ack: true

                    }

                }

            }

        );


    /*
     * CALL ANSWER
     */

    callChannel.on(

        "broadcast",

        {
            event:
                "call-answer"
        },

        async payload => {

            console.log(
                "ANSWER RECEIVED:",
                payload
            );


            await handleCallAnswer(
                payload.payload
            );

        }

    );


    /*
     * CALL END
     */

    callChannel.on(

        "broadcast",

        {
            event:
                "call-ended"
        },

        payload => {

            const data =
                payload.payload || {};


            if(
                data.callId &&
                data.callId !== callId
            ) {

                return;

            }


            console.log(
                "REMOTE ENDED CALL"
            );


            endCall(
                false,
                true
            );

        }

    );


    await waitForChannelSubscription(
        callChannel
    );


    callChannelReady = true;


    console.log(
        "CALL CHANNEL READY:",
        channelName
    );

}


/* =========================================
   CHANNEL SUBSCRIPTION
========================================= */

function waitForChannelSubscription(
    channel
) {

    return new Promise(
        (resolve, reject) => {

            if(!channel) {

                reject(
                    new Error(
                        "No channel."
                    )
                );

                return;

            }


            if(
                channel.state === "joined"
            ) {

                resolve();

                return;

            }


            let finished = false;


            const timeout =
                setTimeout(
                    () => {

                        if(finished)
                            return;


                        finished = true;


                        reject(
                            new Error(
                                "Realtime channel timed out."
                            )
                        );

                    },

                    12000

                );


            channel.subscribe(
                status => {

                    console.log(
                        "CHANNEL STATUS:",
                        status
                    );


                    if(
                        status === "SUBSCRIBED" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        resolve();

                    }


                    if(
                        status === "CHANNEL_ERROR" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Realtime channel error."
                            )
                        );

                    }


                    if(
                        status === "TIMED_OUT" &&
                        !finished
                    ) {

                        finished = true;

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Realtime channel timed out."
                            )
                        );

                    }

                }
            );

        }
    );

}


/* =========================================
   CHANNEL READY
========================================= */

function waitForChannelReady(
    channel
) {

    return new Promise(
        (resolve, reject) => {

            if(!channel) {

                reject(
                    new Error(
                        "No call channel."
                    )
                );

                return;

            }


            if(
                channel.state === "joined"
            ) {

                resolve();

                return;

            }


            const timeout =
                setTimeout(
                    () => {

                        clearInterval(
                            interval
                        );

                        reject(
                            new Error(
                                "Call channel was not ready."
                            )
                        );

                    },

                    12000
                );


            const interval =
                setInterval(
                    () => {

                        if(
                            channel.state ===
                            "joined"
                        ) {

                            clearInterval(
                                interval
                            );

                            clearTimeout(
                                timeout
                            );

                            resolve();

                        }

                    },

                    50

                );

        }
    );

}


/* =========================================
   PEER CONNECTION
========================================= */

async function createPeerConnection() {

    if(peerConnection) {

        try {

            peerConnection.close();

        }

        catch(error) {}

        peerConnection = null;

    }


    remoteStream =
        new MediaStream();


    remoteAudio =
        document.createElement(
            "audio"
        );


    remoteAudio.autoplay = true;

    remoteAudio.playsInline = true;

    remoteAudio.controls = false;

    remoteAudio.muted = false;


    remoteAudio.srcObject =
        remoteStream;


    document.getElementById(
        "audioContainer"
    ).appendChild(
        remoteAudio
    );


    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    /*
     * REMOTE TRACK
     */

    peerConnection.ontrack =
        async function(event) {

            console.log(
                "REMOTE AUDIO TRACK:",
                event
            );


            if(
                event.streams &&
                event.streams[0]
            ) {

                remoteAudio.srcObject =
                    event.streams[0];

            }

            else {

                if(event.track) {

                    remoteStream.addTrack(
                        event.track
                    );

                }

                remoteAudio.srcObject =
                    remoteStream;

            }


            try {

                await remoteAudio.play();

            }

            catch(error) {

                console.warn(
                    "AUTOPLAY WARNING:",
                    error
                );

            }

        };


    /*
     * IMPORTANT:
     *
     * We DO NOT immediately send ICE
     * candidates here.
     *
     * We wait for ICE gathering to complete.
     */

    peerConnection.onicecandidate =
        function(event) {

            if(event.candidate) {

                console.log(
                    "ICE CANDIDATE GATHERED"
                );

            }

            else {

                console.log(
                    "ICE GATHERING COMPLETE"
                );

                iceGatheringComplete =
                    true;

            }

        };


    /*
     * CONNECTION STATE
     */

    peerConnection.onconnectionstatechange =
        function() {

            if(!peerConnection)
                return;


            const state =
                peerConnection.connectionState;


            console.log(
                "WEBRTC CONNECTION:",
                state
            );


            if(state === "connected") {

                setCallState(
                    "Connected"
                );


                setStatus(
                    "Call connected 🔊",
                    "green"
                );

            }


            if(state === "connecting") {

                setCallState(
                    "Connecting..."
                );

            }


            if(state === "disconnected") {

                setCallState(
                    "Connection interrupted..."
                );

            }


            if(state === "failed") {

                setCallState(
                    "Connection failed."
                );


                setStatus(
                    "WebRTC connection failed.",
                    "red"
                );

            }


            if(state === "closed") {

                console.log(
                    "Peer connection closed."
                );

            }

        };


    /*
     * ICE CONNECTION STATE
     */

    peerConnection.oniceconnectionstatechange =
        function() {

            if(!peerConnection)
                return;


            console.log(
                "ICE STATE:",
                peerConnection.iceConnectionState
            );

        };

}


/* =========================================
   WAIT FOR ICE GATHERING
========================================= */

function waitForIceGatheringComplete() {

    return new Promise(
        (resolve, reject) => {

            if(!peerConnection) {

                reject(
                    new Error(
                        "No peer connection."
                    )
                );

                return;

            }


            if(
                peerConnection.iceGatheringState ===
                "complete"
            ) {

                iceGatheringComplete = true;

                resolve();

                return;

            }


            let finished = false;


            const timeout =
                setTimeout(
                    () => {

                        if(finished)
                            return;


                        finished = true;


                        peerConnection.removeEventListener(
                            "icegatheringstatechange",
                            checkState
                        );


                        /*
                         * Do NOT fail immediately.
                         *
                         * Some networks can take longer.
                         * If the state has not completed,
                         * continue with the current SDP.
                         */

                        console.warn(
                            "ICE gathering timeout; continuing."
                        );


                        resolve();

                    },

                    15000

                );


            function checkState() {

                if(!peerConnection)
                    return;


                if(
                    peerConnection.iceGatheringState ===
                    "complete"
                ) {

                    if(finished)
                        return;


                    finished = true;


                    clearTimeout(
                        timeout
                    );


                    iceGatheringComplete =
                        true;


                    peerConnection.removeEventListener(
                        "icegatheringstatechange",
                        checkState
                    );


                    resolve();

                }

            }


            peerConnection.addEventListener(
                "icegatheringstatechange",
                checkState
            );

        }
    );

}


/* =========================================
   HANDLE ANSWER
========================================= */

async function handleCallAnswer(
    data
) {

    if(!data)
        return;


    if(!isCaller)
        return;


    if(!peerConnection)
        return;


    if(data.callId !== callId)
        return;


    if(
        !data.from ||
        data.from.toLowerCase() !==
        targetUsername.toLowerCase()
    ) {

        return;

    }


    if(!data.answer)
        return;


    try {

        console.log(
            "SETTING REMOTE ANSWER..."
        );


        await peerConnection.setRemoteDescription(

            new RTCSessionDescription({

                type:
                    data.answer.type,

                sdp:
                    data.answer.sdp

            })

        );


        remoteDescriptionSet = true;


        console.log(
            "REMOTE ANSWER SET"
        );


        setCallState(
            "Connecting..."
        );

    }

    catch(error) {

        console.error(
            "ANSWER ERROR:",
            error
        );


        setCallState(
            "Could not connect."
        );


        setStatus(
            "Could not process the answer.",
            "red"
        );

    }

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   DECLINE CALL
========================================= */

async function declineCall() {

    if(!incomingCallData)
        return;


    const declined =
        incomingCallData;


    incomingCallData = null;


    stopRingtone();


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    try {

        const safeId =
            String(
                declined.callId
            ).replace(
                /[^a-zA-Z0-9_-]/g,
                "_"
            );


        const channel =
            supabaseClient.channel(

                "chatsapp-call-session-" +
                safeId,

                {

                    config: {

                        broadcast: {

                            ack: true

                        }

                    }

                }

            );


        channel.on(

            "broadcast",

            {
                event:
                    "call-ended"
            },

            () => {}

        );


        await waitForChannelSubscription(
            channel
        );


        const result =
            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    callId:
                        declined.callId,

                    from:
                        currentUsername,

                    to:
                        declined.from

                }

            });


        console.log(
            "DECLINE RESULT:",
            result
        );


        await supabaseClient
            .removeChannel(
                channel
            );

    }

    catch(error) {

        console.warn(
            "DECLINE ERROR:",
            error
        );

    }


    targetUsername = "";

    callId = "";


    setStatus(
        "Call declined.",
        ""
    );

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true,
    remoteEnded = false
) {

    if(callEnding)
        return;


    callEnding = true;


    const oldTarget =
        targetUsername;


    const oldCallId =
        callId;


    const oldChannel =
        callChannel;


    if(
        notify &&
        oldTarget &&
        oldCallId &&
        oldChannel
    ) {

        try {

            await waitForChannelReady(
                oldChannel
            );


            const result =
                await oldChannel.send({

                    type:
                        "broadcast",

                    event:
                        "call-ended",

                    payload: {

                        callId:
                            oldCallId,

                        from:
                            currentUsername,

                        to:
                            oldTarget

                    }

                });


            console.log(
                "END CALL RESULT:",
                result
            );

        }

        catch(error) {

            console.warn(
                "END CALL SIGNALING:",
                error
            );

        }

    }


    await resetCallState(
        remoteEnded
    );

}


/* =========================================
   RESET CALL
========================================= */

async function resetCallState(
    remoteEnded = false
) {

    stopRingtone();


    /*
     * Stop microphone.
     */

    if(localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    try {

                        track.stop();

                    }

                    catch(error) {}

                }
            );

        localStream = null;

    }


    /*
     * Close WebRTC.
     */

    if(peerConnection) {

        try {

            peerConnection.ontrack = null;

            peerConnection.onicecandidate = null;

            peerConnection.close();

        }

        catch(error) {}

        peerConnection = null;

    }


    /*
     * Remove remote audio.
     */

    if(remoteAudio) {

        try {

            remoteAudio.pause();

            remoteAudio.srcObject = null;

            remoteAudio.remove();

        }

        catch(error) {}

        remoteAudio = null;

    }


    remoteStream = null;


    /*
     * Remove call channel.
     */

    if(callChannel) {

        try {

            await supabaseClient
                .removeChannel(
                    callChannel
                );

        }

        catch(error) {

            console.warn(
                error
            );

        }

        callChannel = null;

    }


    callChannelReady = false;

    remoteDescriptionSet = false;

    iceGatheringComplete = false;


    /*
     * Hide screens.
     */

    document.getElementById(
        "activeCall"
    ).classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    ).classList.remove(
        "show"
    );


    /*
     * Reset mute.
     */

    isMuted = false;


    const muteButton =
        document.getElementById(
            "muteButton"
        );


    muteButton.innerText =
        "🎤";


    muteButton.classList.remove(
        "muted"
    );


    /*
     * Reset variables.
     */

    incomingCallData = null;

    targetUsername = "";

    callId = "";

    isCaller = false;

    callActive = false;

    callEnding = false;


    setCallButtonDisabled(
        false
    );


    if(remoteEnded) {

        setStatus(
            "Call ended.",
            ""
        );

    }

    else {

        setStatus(
            "Ready to call",
            ""
        );

    }

}


/* =========================================

/* =========================================
   CALL STATE
========================================= */

function setCallState(
    text
) {

/* =========================================
   STATUS
========================================= */

function setStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        text;


    status.className =
        "status " +

   CALL BUTTON
========================================= */

function setCallButtonDisabled(
    disabled
) {

    document.getElementById(
        "callButton"
    ).disabled =
        disabled;

}


/* =========================================
   CALL ERROR MESSAGE
========================================= */

function getCallErrorMessage(
    error
) {

    console.error(
        "CALL FAILURE:",
        error
    );


    if(
        error &&
        error.name ===
        "NotAllowedError"
    ) {

        return (
            "Microphone permission was denied."
        );

    }


    if(
        error &&
        error.name ===
        "NotFoundError"
    ) {

        return (
            "No microphone was found."
        );

    }


    if(
        error &&
        error.message
    ) {

        return (
            "Call failed: " +
            error.message
        );

    }


    return (
        "Could not start the call."
    );

}


/* =========================================
   RINGTONE
========================================= */

let ringtoneContext = null;

let ringtoneTimer = null;


function playRingtone() {

    try {

        stopRingtone();


        ringtoneContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const playBeep =
            () => {

                if(!ringtoneContext)
                    return;


                const oscillator =
                    ringtoneContext
                    .createOscillator();


                const gain =
                    ringtoneContext
                    .createGain();


                oscillator.frequency.value =
                    650;


                gain.gain.value =
                    0.08;


                oscillator.connect(
                    gain
                );


                gain.connect(
                    ringtoneContext.destination
                );


                oscillator.start();


                oscillator.stop(

                    ringtoneContext
                    .currentTime +
                    0.25

                );

            };


        playBeep();


        ringtoneTimer =
            setInterval(
                playBeep,
                1300
            );

    }

    catch(error) {

        console.warn(
            "RINGTONE ERROR:",
            error
        );

    }

}


function stopRingtone() {

    if(ringtoneTimer) {

        clearInterval(
            ringtoneTimer
        );

        ringtoneTimer = null;

    }


    if(ringtoneContext) {

        try {

            ringtoneContext.close();

        }

        catch(error) {}

        ringtoneContext = null;

    }

}

                        catch(error) {}

                    }
                );

        }


        if(peerConnection) {

            try {

                peerConnection.close();

            }

            catch(error) {}

        }

    }
);
