<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatsApp Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Inter, Arial, sans-serif;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 20% 20%, #253b6e 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #34205d 0%, transparent 35%),
        #080b14;
}

.call-app {
    width: 100%;
    max-width: 520px;
    padding: 30px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    background: linear-gradient(
        135deg,
        #5b8cff,
        #795cff
    );

    box-shadow:
        0 10px 35px rgba(91,140,255,.35);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #818ba3;
    margin: 10px 0 30px;
}

.card {
    padding: 25px;

    border-radius: 22px;

    background: rgba(18,23,38,.9);

    border: 1px solid #283149;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

label {
    display: block;

    color: #9ca5ba;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid #30384f;

    background: #0e1220;

    color: white;

    outline: none;

    font-size: 15px;
}

input:focus {
    border-color: #638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

button {
    border: 0;

    cursor: pointer;

    color: white;

    font-weight: 700;

    border-radius: 13px;

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

.call-button {
    width: 100%;

    margin-top: 15px;

    padding: 15px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    font-size: 15px;
}

.home-button {
    width: 100%;

    margin-top: 12px;

    padding: 13px;

    background: #191f31;

    border: 1px solid #30384f;
}

.status {
    text-align: center;

    margin-top: 20px;

    min-height: 22px;

    color: #7f89a2;

    font-size: 14px;
}

.status.green {
    color: #55d88a;
}

.status.red {
    color: #ff8585;
}


/* =========================
   INCOMING CALL
========================= */

.incoming {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 65%
        );

    align-items: center;

    justify-content: center;

    padding: 25px;
}

.incoming.show {
    display: flex;
}

.incoming-box {
    text-align: center;

    width: 100%;
    max-width: 400px;

    padding: 40px 25px;

    border-radius: 28px;

    background: rgba(18,23,38,.95);

    border: 1px solid #30384f;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.caller-avatar {
    width: 100px;
    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        callerPulse 1.5s infinite;
}

@keyframes callerPulse {

    0%,100% {
        box-shadow:
            0 0 0 0 rgba(91,140,255,.35);
    }

    50% {
        box-shadow:
            0 0 0 18px rgba(91,140,255,0);
    }

}

.incoming-box h2 {
    margin: 0;
    font-size: 27px;
}

.incoming-box p {
    color: #818ba3;
    margin: 10px 0 30px;
}

.incoming-buttons {
    display: flex;
    gap: 12px;
}

.accept {
    flex: 1;
    padding: 15px;
    background: #39c878;
}

.decline {
    flex: 1;
    padding: 15px;
    background: #e34f5f;
}


/* =========================
   ACTIVE CALL
========================= */

.active-call {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 70%
        );

    align-items: center;
    justify-content: center;
}

.active-call.show {
    display: flex;
}

.active-box {
    text-align: center;
}

.active-avatar {
    width: 130px;
    height: 130px;

    margin: 0 auto 25px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        activePulse 2s infinite;
}

@keyframes activePulse {

    0%,100% {
        box-shadow:
            0 0 35px rgba(91,140,255,.25);
    }

    50% {
        box-shadow:
            0 0 70px rgba(91,140,255,.55);
    }

}

.active-name {
    font-size: 28px;
    font-weight: 800;
}

.call-state {
    margin-top: 8px;
    color: #55d88a;
}

.call-controls {
    margin-top: 35px;

    display: flex;

    justify-content: center;

    gap: 15px;
}

.control {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #20283d;

    border: 1px solid #35405c;

    font-size: 22px;
}

.control.muted {
    background: #5b6380;
}

.end-call {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #e34f5f;

    font-size: 24px;
}


/* =========================
   HIDDEN AUDIO
========================= */

#audioContainer {
    display: none;
}

</style>

</head>

<body>


<div class="call-app">

    <div class="logo">
        C
    </div>

    <h1>
        ChatsApp Call
    </h1>

    <p class="subtitle">
        Voice calls with your ChatsApp friends 📞
    </p>

    <div class="card">

        <label>
            Username to call
        </label>

        <input
            id="targetUsername"
            type="text"
            placeholder="Enter username..."
            maxlength="20"
            autocomplete="off"
        >

        <button
            class="call-button"
            onclick="startCall()"
        >
            📞 Call
        </button>

        <button
            class="home-button"
            onclick="goHome()"
        >
            ← Back to ChatsApp
        </button>

        <div
            id="status"
            class="status"
        >
            Ready to call
        </div>

    </div>

</div>


<!-- =========================
     INCOMING CALL
========================= -->

<div
    id="incomingCall"
    class="incoming"
>

    <div class="incoming-box">

        <div
            id="callerAvatar"
            class="caller-avatar"
        >
            C
        </div>

        <h2 id="callerName">
            Someone
        </h2>

        <p>
            📞 Incoming voice call...
        </p>

        <div class="incoming-buttons">

            <button
                class="accept"
                onclick="acceptCall()"
            >
                ✓ Accept
            </button>

            <button
                class="decline"
                onclick="declineCall()"
            >
                ✕ Decline
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ACTIVE CALL
========================= -->

<div
    id="activeCall"
    class="active-call"
>

    <div class="active-box">

        <div
            id="activeAvatar"
            class="active-avatar"
        >
            C
        </div>

        <div
            id="activeName"
            class="active-name"
        >
            User
        </div>

        <div
            id="callState"
            class="call-state"
        >
            Connecting...
        </div>

        <div class="call-controls">

            <button
                id="muteButton"
                class="control"
                onclick="toggleMute()"
            >
                🎤
            </button>

            <button
                class="end-call"
                onclick="endCall()"
            >
                ☎
            </button>

        </div>

    </div>

</div>


<div id="audioContainer"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let callChannel = null;

let pairChannel = null;

let incomingCallData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let remoteAudio = null;

let ringtoneAudio = null;

let isMuted = false;

let isCaller = false;

let currentCallId = null;

let callFinished = false;


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    async function() {

        const savedUsername =
            localStorage.getItem(
                "chatsapp_username"
            );

        if(savedUsername) {

            currentUsername =
                savedUsername;

        }


        const {
            data
        } =
            await supabaseClient
            .auth
            .getSession();


        if(
            data &&
            data.session &&
            data.session.user
        ) {

            currentUsername =
                data.session.user
                .user_metadata?.username ||
                data.session.user.email
                    .split("@")[0];

        }


        if(!currentUsername) {

            setStatus(
                "Please log in to ChatsApp first.",
                "red"
            );

            return;

        }


        setupCallInbox();

        requestNotificationPermission();

    }
);


/* =========================================
   NOTIFICATIONS
========================================= */

async function requestNotificationPermission() {

    if(
        "Notification" in window &&
        Notification.permission === "default"
    ) {

        try {

            await Notification.requestPermission();

        }

        catch(error) {

            console.warn(
                "Notification permission:",
                error
            );

        }

    }

}


function showCallNotification(
    caller
) {

    if(
        !("Notification" in window)
    )
        return;


    if(
        Notification.permission !==
        "granted"
    )
        return;


    try {

        new Notification(
            caller +
            " is calling you!",
            {
                body:
                    "Incoming ChatsApp voice call 📞",
                icon:
                    "https://cdn.jsdelivr.net/gh/twitter/twemoji@latest/assets/svg/1f4de.svg",
                tag:
                    "chatsapp-call"
            }
        );

    }

    catch(error) {

        console.warn(
            "Notification failed:",
            error
        );

    }

}


/* =========================================
   RINGTONE
========================================= */

function startRingtone() {

    stopRingtone();


    /*
       We generate a simple ringtone using
       Web Audio instead of needing an audio file.
    */

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if(!AudioContext)
            return;


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.type =
            "sine";


        oscillator.frequency.value =
            700;


        gain.gain.value =
            0.04;


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        ringtoneAudio = {

            context:
                context,

            oscillator:
                oscillator,

            gain:
                gain

        };


        ringtoneAudio.timer =
            setInterval(
                function() {

                    if(
                        !ringtoneAudio
                    )
                        return;


                    try {

                        const now =
                            context.currentTime;


                        gain.gain.setValueAtTime(
                            0.04,
                            now
                        );


                        gain.gain.setValueAtTime(
                            0,
                            now + 0.35
                        );

                    }

                    catch(error) {

                        console.warn(
                            error
                        );

                    }

                },
                1200
            );

    }

    catch(error) {

        console.warn(
            "Ringtone unavailable:",
            error
        );

    }

}


function stopRingtone() {

    if(!ringtoneAudio)
        return;


    try {

        clearInterval(
            ringtoneAudio.timer
        );


        ringtoneAudio.oscillator.stop();

        ringtoneAudio.context.close();

    }

    catch(error) {

        console.warn(error);

    }


    ringtoneAudio =
        null;

}


/* =========================================
   CALL INBOX
========================================= */

function setupCallInbox() {

    const inboxName =
        "chatsapp-call-inbox-" +
        currentUsername
        .toLowerCase();


    callChannel =
        supabaseClient
        .channel(
            inboxName
        );


    callChannel
        .on(
            "broadcast",
            {
                event:
                    "incoming-call"
            },
            payload => {

                handleIncomingCall(
                    payload.payload
                );

            }
        )
        .subscribe(
            status => {

                console.log(
                    "Call inbox:",
                    status
                );

            }
        );

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    const input =
        document.getElementById(
            "targetUsername"
        );


    targetUsername =
        input.value.trim();


    if(!targetUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(
        targetUsername.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    if(peerConnection) {

        setStatus(
            "You are already in a call.",
            "red"
        );

        return;

    }


    currentCallId =
        crypto.randomUUID
        ? crypto.randomUUID()
        : Date.now().toString();


    callFinished =
        false;


    isCaller =
        true;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Calling..."
    );


    try {

        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        const channel =
            await getUserChannel(
                targetUsername
            );


        await channel.send({

            type:
                "broadcast",

            event:
                "incoming-call",

            payload: {

                from:
                    currentUsername,

                callId:
                    currentCallId,

                offer:
                    offer

            }

        });


        setCallState(
            "Ringing..."
        );

    }

    catch(error) {

        console.error(
            "Start call error:",
            error
        );


        setCallState(
            "Could not start call."
        );


        await endCall(
            false
        );

    }

}


/* =========================================
   INCOMING CALL
========================================= */

function handleIncomingCall(
    data
) {

    if(
        !data ||
        !data.from ||
        !data.offer ||
        !data.callId
    )
        return;


    if(
        data.from.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        return;

    }


    if(peerConnection) {

        return;

    }


    if(incomingCallData) {

        return;

    }


    incomingCallData =
        data;


    targetUsername =
        data.from;


    currentCallId =
        data.callId;


    document.getElementById(
        "callerName"
    )
    .innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    )
    .innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    )
    .classList.add(
        "show"
    );


    showCallNotification(
        data.from
    );


    /*
       Browsers may block audio until the
       user interacts with the page.
       We still attempt the ringtone.
    */

    startRingtone();

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData)
        return;


    stopRingtone();


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isCaller =
        false;


    callFinished =
        false;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Connecting..."
    );


    try {

        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    incomingCallData.offer
                )
            );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        const channel =
            await getUserChannel(
                targetUsername
            );


        await channel.send({

            type:
                "broadcast",

            event:
                "call-answer",

            payload: {

                from:
                    currentUsername,

                callId:
                    currentCallId,

                answer:
                    answer

            }

        });


        setCallState(
            "Connected"
        );


        incomingCallData =
            null;

    }

    catch(error) {

        console.error(
            "Accept call error:",
            error
        );


        setCallState(
            "Could not connect."
        );


        await endCall(
            true
        );

    }

}


/* =========================================
   CREATE PEER CONNECTION
========================================= */

async function createPeerConnection() {

    if(peerConnection) {

        try {

            peerConnection.close();

        }

        catch(error) {}

    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    remoteStream =
        new MediaStream();


    remoteAudio =
        document.createElement(
            "audio"
        );


    remoteAudio.autoplay =
        true;


    remoteAudio.playsInline =
        true;


    remoteAudio.srcObject =
        remoteStream;


    document.getElementById(
        "audioContainer"
    )
    .appendChild(
        remoteAudio
    );


    peerConnection
        .ontrack =
        function(event) {

            if(
                event.streams &&
                event.streams[0]
            ) {

                event.streams[0]
                    .getTracks()
                    .forEach(
                        track => {

                            remoteStream
                                .addTrack(
                                    track
                                );

                        }
                    );

            }


            if(remoteAudio) {

                remoteAudio
                    .play()
                    .catch(
                        error => {

                            console.warn(
                                "Audio autoplay blocked:",
                                error
                            );

                        }
                    );

            }

        };


    peerConnection
        .onicecandidate =
        async function(event) {

            if(
                !event.candidate ||
                !targetUsername ||
                !currentCallId
            )
                return;


            try {

                const channel =
                    await getUserChannel(
                        targetUsername
                    );


                await channel.send({

                    type:
                        "broadcast",

                    event:
                        "ice-candidate",

                    payload: {

                        from:
                            currentUsername,

                        callId:
                            currentCallId,

                        candidate:
                            event.candidate

                    }

                });

            }

            catch(error) {

                console.warn(
                    "ICE send error:",
                    error
                );

            }

        };


    peerConnection
        .onconnectionstatechange =
        function() {

            if(!peerConnection)
                return;


            const state =
                peerConnection
                .connectionState;


            console.log(
                "WebRTC connection:",
                state
            );


            if(
                state ===
                "connected"
            ) {

                setCallState(
                    "Connected"
                );

            }


            if(
                state ===
                "disconnected"
            ) {

                setCallState(
                    "Connection interrupted..."
                );

            }


            if(
                state ===
                "failed"
            ) {

                setCallState(
                    "Connection failed."
                );

            }

        };


    const channel =
        await getUserChannel(
            targetUsername
        );


    channel
        .on(
            "broadcast",
            {
                event:
                    "call-answer"
            },
            async payload => {

                if(
                    !isCaller ||
                    !peerConnection
                )
                    return;


                const data =
                    payload.payload;


                if(
                    !data ||
                    !data.answer ||
                    !data.from ||
                    !data.callId
                )
                    return;


                if(
                    data.callId !==
                    currentCallId
                )
                    return;


                if(
                    data.from.toLowerCase() !==
                    targetUsername.toLowerCase()
                )
                    return;


                try {

                    await peerConnection
                        .setRemoteDescription(
                            new RTCSessionDescription(
                                data.answer
                            )
                        );


                    setCallState(
                        "Connected"
                    );

                }

                catch(error) {

                    console.error(
                        "Answer error:",
                        error
                    );

                }

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "ice-candidate"
            },
            async payload => {

                if(
                    !peerConnection
                )
                    return;


                const data =
                    payload.payload;


                if(
                    !data ||
                    !data.candidate ||
                    !data.from ||
                    !data.callId
                )
                    return;


                if(
                    data.callId !==
                    currentCallId
                )
                    return;


                if(
                    data.from.toLowerCase() !==
                    targetUsername.toLowerCase()
                )
                    return;


                try {

                    await peerConnection
                        .addIceCandidate(
                            new RTCIceCandidate(
                                data.candidate
                            )
                        );

                }

                catch(error) {

                    console.warn(
                        "ICE candidate error:",
                        error
                    );

                }

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "call-ended"
            },
            payload => {

                const data =
                    payload.payload;


                if(
                    !data
                )
                    return;


                if(
                    data.callId !==
                    currentCallId
                )
                    return;


                if(
                    !data.from
                )
                    return;


                if(
                    targetUsername &&
                    data.from.toLowerCase() !==
                    targetUsername.toLowerCase()
                )
                    return;


                endCall(
                    false
                );

            }
        );

}


/* =========================================
   CHANNEL
========================================= */

async function getUserChannel(
    username
) {

    const channelName =
        "chatsapp-call-" +
        [
            currentUsername.toLowerCase(),
            username.toLowerCase()
        ]
        .sort()
        .join("-");


    if(
        pairChannel &&
        pairChannel.topic ===
        "realtime:" +
        channelName
    ) {

        return pairChannel;

    }


    const existing =
        supabaseClient
        .getChannels()
        .find(
            channel => {

                return (
                    channel.topic ===
                    "realtime:" +
                    channelName
                );

            }
        );


    if(existing) {

        pairChannel =
            existing;

        return existing;

    }


    const channel =
        supabaseClient
        .channel(
            channelName
        );


    await new Promise(
        (resolve, reject) => {

            let finished =
                false;


            const timeout =
                setTimeout(
                    function() {

                        if(!finished) {

                            finished =
                                true;

                            reject(
                                new Error(
                                    "Realtime channel timeout."
                                )
                            );

                        }

                    },
                    10000
                );


            channel
                .subscribe(
                    status => {

                        console.log(
                            "Call channel:",
                            status
                        );


                        if(
                            status ===
                            "SUBSCRIBED"
                        ) {

                            if(
                                finished
                            )
                                return;


                            finished =
                                true;


                            clearTimeout(
                                timeout
                            );


                            resolve();

                        }


                        if(
                            status ===
                            "CHANNEL_ERROR" ||
                            status ===
                            "TIMED_OUT"
                        ) {

                            if(
                                finished
                            )
                                return;


                            finished =
                                true;


                            clearTimeout(
                                timeout
                            );


                            reject(
                                new Error(
                                    "Could not connect to call channel."
                                )
                            );

                        }

                    }
                );

        }
    );


    pairChannel =
        channel;


    return channel;

}


/* =========================================
   SHOW ACTIVE CALL
========================================= */

function showActiveCall(
    username
) {

    document.getElementById(
        "activeName"
    )
    .innerText =
        username;


    document.getElementById(
        "activeAvatar"
    )
    .innerText =
        username
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "activeCall"
    )
    .classList.add(
        "show"
    );

}


/* =========================================
   CALL STATE
========================================= */

function setCallState(
    text
) {

    document.getElementById(
        "callState"
    )
    .innerText =
        text;

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   DECLINE
========================================= */

async function declineCall() {

    stopRingtone();


    if(
        incomingCallData &&
        incomingCallData.from
    ) {

        try {

            const caller =
                incomingCallData.from;


            const channel =
                await getUserChannel(
                    caller
                );


            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    from:
                        currentUsername,

                    callId:
                        incomingCallData.callId

                }

            });

        }

        catch(error) {

            console.warn(
                "Decline error:",
                error
            );

        }

    }


    incomingCallData =
        null;


    currentCallId =
        null;


    targetUsername =
        "";


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    setStatus(
        "Call declined.",
        ""
    );

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true
) {

    if(callFinished)
        return;


    callFinished =
        true;


    stopRingtone();


    if(
        notify &&
        targetUsername &&
        currentCallId
    ) {

        try {

            const channel =
                await getUserChannel(
                    targetUsername
                );


            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    from:
                        currentUsername,

                    callId:
                        currentCallId

                }

            });

        }

        catch(error) {

            console.warn(
                "End call notification error:",
                error
            );

        }

    }


    if(localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );


        localStream =
            null;

    }


    if(peerConnection) {

        try {

            peerConnection.close();

        }

        catch(error) {}

        peerConnection =
            null;

    }


    if(remoteAudio) {

        try {

            remoteAudio.pause();

            remoteAudio.srcObject =
                null;

            remoteAudio.remove();

        }

        catch(error) {}

        remoteAudio =
            null;

    }


    remoteStream =
        null;


    document.getElementById(
        "activeCall"
    )
    .classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isMuted =
        false;


    document.getElementById(
        "muteButton"
    )
    .innerText =
        "🎤";


    document.getElementById(
        "muteButton"
    )
    .classList.remove(
        "muted"
    );


    incomingCallData =
        null;


    targetUsername =
        "";


    currentCallId =
        null;


    setStatus(
        "Call ended.",
        ""
    );


    /*
       Allow a new call after cleanup.
    */

    setTimeout(
        function() {

            callFinished =
                false;

        },
        500
    );

}


/* =========================================
   STATUS
========================================= */

function setStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        text;


    status.className =
        "status " +
        (type || "");

}


/* =========================================
   HOME
========================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    function() {

        stopRingtone();


        if(localStream) {

            localStream
                .getTracks()
                .forEach(
                    track => {

                        track.stop();

                    }
                );

        }


        if(peerConnection) {

            peerConnection.close();

        }

    }
);
