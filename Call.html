<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>ChatsApp Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Inter, Arial, sans-serif;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(
            circle at 20% 20%,
            #253b6e 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 80% 80%,
            #34205d 0%,
            transparent 35%
        ),
        #080b14;
}

.call-app {
    width: 100%;
    max-width: 520px;

    padding: 30px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    box-shadow:
        0 10px 35px rgba(91,140,255,.35);
}

h1 {
    text-align: center;

    margin: 0;

    font-size: 32px;
}

.subtitle {
    text-align: center;

    color: #818ba3;

    margin: 10px 0 30px;
}

.card {
    padding: 25px;

    border-radius: 22px;

    background: rgba(18,23,38,.9);

    border: 1px solid #283149;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

label {
    display: block;

    color: #9ca5ba;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid #30384f;

    background: #0e1220;

    color: white;

    outline: none;

    font-size: 15px;
}

input:focus {
    border-color: #638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

button {
    border: 0;

    cursor: pointer;

    color: white;

    font-weight: 700;

    border-radius: 13px;

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

.call-button {
    width: 100%;

    margin-top: 15px;

    padding: 15px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    font-size: 15px;
}

.home-button {
    width: 100%;

    margin-top: 12px;

    padding: 13px;

    background: #191f31;

    border: 1px solid #30384f;
}

.status {
    text-align: center;

    margin-top: 20px;

    min-height: 22px;

    color: #7f89a2;

    font-size: 14px;
}

.status.green {
    color: #55d88a;
}

.status.red {
    color: #ff8585;
}


/* =========================
   INCOMING CALL
========================= */

.incoming {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 65%
        );

    align-items: center;

    justify-content: center;

    padding: 25px;
}

.incoming.show {
    display: flex;
}

.incoming-box {
    text-align: center;

    width: 100%;
    max-width: 400px;

    padding: 40px 25px;

    border-radius: 28px;

    background: rgba(18,23,38,.95);

    border: 1px solid #30384f;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.caller-avatar {
    width: 100px;
    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        callerPulse 1.5s infinite;
}

@keyframes callerPulse {

    0%,100% {
        box-shadow:
            0 0 0 0 rgba(91,140,255,.35);
    }

    50% {
        box-shadow:
            0 0 0 18px rgba(91,140,255,0);
    }

}

.incoming-box h2 {
    margin: 0;

    font-size: 27px;
}

.incoming-box p {
    color: #818ba3;

    margin: 10px 0 30px;
}

.incoming-buttons {
    display: flex;

    gap: 12px;
}

.accept {
    flex: 1;

    padding: 15px;

    background: #39c878;
}

.decline {
    flex: 1;

    padding: 15px;

    background: #e34f5f;
}


/* =========================
   ACTIVE CALL
========================= */

.active-call {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 70%
        );

    align-items: center;

    justify-content: center;
}

.active-call.show {
    display: flex;
}

.active-box {
    text-align: center;
}

.active-avatar {
    width: 130px;
    height: 130px;

    margin: 0 auto 25px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        activePulse 2s infinite;
}

@keyframes activePulse {

    0%,100% {
        box-shadow:
            0 0 35px rgba(91,140,255,.25);
    }

    50% {
        box-shadow:
            0 0 70px rgba(91,140,255,.55);
    }

}

.active-name {
    font-size: 28px;

    font-weight: 800;
}

.call-state {
    margin-top: 8px;

    color: #55d88a;
}

.call-controls {
    margin-top: 35px;

    display: flex;

    justify-content: center;

    gap: 15px;
}

.control {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #20283d;

    border: 1px solid #35405c;

    font-size: 22px;
}

.control.muted {
    background: #5b6380;
}

.end-call {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #e34f5f;

    font-size: 24px;
}


/* =========================
   HIDDEN AUDIO
========================= */

#audioContainer {
    display: none;
}

</style>

</head>

<body>


<div class="call-app">

    <div class="logo">
        C
    </div>

    <h1>
        ChatsApp Call
    </h1>

    <p class="subtitle">
        Call somebody in realtime 📞
    </p>


    <div class="card">

        <label>
            Username to call
        </label>

        <input
            id="targetUsername"
            type="text"
            placeholder="Enter username..."
            maxlength="50"
            autocomplete="off"
        >

        <button
            id="callButton"
            class="call-button"
            onclick="startCall()"
        >
            📞 Call
        </button>

        <button
            class="home-button"
            onclick="goHome()"
        >
            ← Back to ChatsApp
        </button>

        <div
            id="status"
            class="status"
        >
            Ready to call
        </div>

    </div>

</div>


<!-- =========================
     INCOMING CALL
========================= -->

<div
    id="incomingCall"
    class="incoming"
>

    <div class="incoming-box">

        <div
            id="callerAvatar"
            class="caller-avatar"
        >
            C
        </div>

        <h2 id="callerName">
            Someone
        </h2>

        <p>
            📞 Incoming voice call...
        </p>

        <div class="incoming-buttons">

            <button
                class="accept"
                onclick="acceptCall()"
            >
                ✓ Accept
            </button>

            <button
                class="decline"
                onclick="declineCall()"
            >
                ✕ Decline
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ACTIVE CALL
========================= -->

<div
    id="activeCall"
    class="active-call"
>

    <div class="active-box">

        <div
            id="activeAvatar"
            class="active-avatar"
        >
            C
        </div>

        <div
            id="activeName"
            class="active-name"
        >
            User
        </div>

        <div
            id="callState"
            class="call-state"
        >
            Connecting...
        </div>

        <div class="call-controls">

            <button
                id="muteButton"
                class="control"
                onclick="toggleMute()"
            >
                🎤
            </button>

            <button
                class="end-call"
                onclick="endCall()"
            >
                ☎
            </button>

        </div>

    </div>

</div>


<div id="audioContainer"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let targetProfile = null;

let callInbox = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let remoteAudio = null;

let incomingCallData = null;

let isMuted = false;

let isCaller = false;

let callActive = false;

let callId = null;


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    async function() {

        try {

            const savedUsername =
                localStorage.getItem(
                    "chatsapp_username"
                );

            if(savedUsername) {

                currentUsername =
                    savedUsername.trim();

            }


            const {
                data
            } =
                await supabaseClient
                .auth
                .getSession();


            if(
                data &&
                data.session &&
                data.session.user
            ) {

                currentUsername =
                    data.session.user
                    .user_metadata?.username ||
                    data.session.user.email
                        .split("@")[0];

            }


            if(!currentUsername) {

                setStatus(
                    "Please log in to ChatsApp first.",
                    "red"
                );

                return;

            }


            await setupCallInbox();


            setStatus(
                "Ready to call",
                "green"
            );

        }

        catch(error) {

            console.error(
                "Call startup error:",
                error
            );

            setStatus(
                "Could not start calling.",
                "red"
            );

        }

    }
);


/* =========================================
   CALL INBOX
========================================= */

async function setupCallInbox() {

    const inboxName =
        "chatsapp-call-inbox-" +
        currentUsername
        .toLowerCase()
        .replace(
            /[^a-z0-9_-]/g,
            "-"
        );


    callInbox =
        supabaseClient
        .channel(
            inboxName
        );


    callInbox
        .on(
            "broadcast",
            {
                event:
                    "incoming-call"
            },
            async payload => {

                await handleIncomingCall(
                    payload.payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "call-answer"
            },
            async payload => {

                await handleCallAnswer(
                    payload.payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "ice-candidate"
            },
            async payload => {

                await handleIceCandidate(
                    payload.payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "call-ended"
            },
            async payload => {

                await handleRemoteCallEnded(
                    payload.payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event:
                    "call-declined"
            },
            async payload => {

                await handleRemoteCallDeclined(
                    payload.payload
                );

            }
        );


    await callInbox.subscribe();

}


/* =========================================
   VALIDATE USERNAME
========================================= */

async function findUserByUsername(
    username
) {

    const cleanUsername =
        username.trim();


    if(!cleanUsername)
        return null;


    const {
        data,
        error
    } =
        await supabaseClient
        .from("profiles")
        .select(
            "id, username"
        )
        .ilike(
            "username",
            cleanUsername
        )
        .limit(1);


    if(error) {

        console.error(
            "Username lookup error:",
            error
        );

        throw error;

    }


    if(!data || data.length === 0) {

        return null;

    }


    return data[0];

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    if(
        !currentUsername
    ) {

        setStatus(
            "Please log in first.",
            "red"
        );

        return;

    }


    const input =
        document.getElementById(
            "targetUsername"
        );


    const enteredUsername =
        input.value.trim();


    if(!enteredUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(
        enteredUsername.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    disableCallButton(true);


    setStatus(
        "Checking username...",
        ""
    );


    try {

        /*
         * IMPORTANT:
         *
         * We check the actual profiles table
         * BEFORE sending ANY call signal.
         */

        const profile =
            await findUserByUsername(
                enteredUsername
            );


        if(!profile) {

            setStatus(
                "❌ Invalid username. That user does not exist.",
                "red"
            );

            disableCallButton(false);

            return;

        }


        targetProfile =
            profile;


        targetUsername =
            profile.username;


        /*
         * Every call gets its own ID.
         */

        callId =
            crypto.randomUUID();


        isCaller =
            true;


        callActive =
            true;


        showActiveCall(
            targetUsername
        );


        setCallState(
            "Calling..."
        );


        await createPeerConnection();


        try {

            localStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    audio: true,

                    video: false

                });

        }

        catch(error) {

            console.error(
                "Microphone error:",
                error
            );

            setCallState(
                "Microphone permission denied."
            );

            cleanupCall();

            return;

        }


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
        .setLocalDescription(
            offer
        );


        /*
         * SEND ONLY TO THE TARGET USER'S
         * PERSONAL CALL INBOX.
         */

        await sendToUser(
            targetUsername,
            "incoming-call",
            {

                from:
                    currentUsername,

                to:
                    targetUsername,

                callId:
                    callId,

                offer:
                    offer

            }
        );


        setCallState(
            "Ringing..."
        );


        disableCallButton(false);

    }

    catch(error) {

        console.error(
            "Start call error:",
            error
        );

        cleanupCall();

        setStatus(
            "Could not start the call.",
            "red"
        );

        disableCallButton(false);

    }

}


/* =========================================
   SEND TO SPECIFIC USER
========================================= */

async function sendToUser(
    username,
    event,
    payload
) {

    const channelName =
        "chatsapp-call-inbox-" +
        username
        .toLowerCase()
        .replace(
            /[^a-z0-9_-]/g,
            "-"
        );


    const channel =
        supabaseClient
        .channel(
            channelName
        );


    /*
     * Subscribe first so the message
     * definitely has an active channel.
     */

    await new Promise(
        (resolve, reject) => {

            let finished =
                false;


            const timeout =
                setTimeout(
                    () => {

                        if(!finished) {

                            finished = true;

                            reject(
                                new Error(
                                    "Call channel timed out."
                                )
                            );

                        }

                    },
                    10000
                );


            channel.subscribe(
                status => {

                    if(
                        status ===
                        "SUBSCRIBED"
                    ) {

                        if(!finished) {

                            finished = true;

                            clearTimeout(
                                timeout
                            );

                            resolve();

                        }

                    }

                }
            );

        }
    );


    await channel.send({

        type:
            "broadcast",

        event:
            event,

        payload:
            payload

    });


    /*
     * Keep the caller's own inbox alive.
     * Supabase handles the channel connection.
     */

}


/* =========================================
   INCOMING CALL
========================================= */

async function handleIncomingCall(
    data
) {

    if(!data)
        return;


    if(!data.from)
        return;


    if(!data.to)
        return;


    /*
     * SECURITY CHECK:
     *
     * This call must actually be addressed
     * to THIS username.
     */

    if(
        data.to.toLowerCase() !==
        currentUsername.toLowerCase()
    ) {

        return;

    }


    if(
        data.from.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        return;

    }


    /*
     * Don't allow another incoming call
     * to overwrite an existing call.
     */

    if(
        incomingCallData ||
        callActive
    ) {

        /*
         * Tell caller we are unavailable.
         */

        try {

            await sendToUser(
                data.from,
                "call-ended",
                {

                    from:
                        currentUsername,

                    to:
                        data.from,

                    callId:
                        data.callId

                }
            );

        }

        catch(error) {

            console.warn(error);

        }

        return;

    }


    incomingCallData =
        data;


    targetUsername =
        data.from;


    callId =
        data.callId;


    document.getElementById(
        "callerName"
    )
    .innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    )
    .innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    )
    .classList.add(
        "show"
    );


    /*
     * Play a notification sound while
     * the page is open.
     */

    playIncomingSound();

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData)
        return;


    const data =
        incomingCallData;


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isCaller =
        false;


    callActive =
        true;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Connecting..."
    );


    try {

        await createPeerConnection();


        try {

            localStream =
                await navigator
                .mediaDevices
                .getUserMedia({

                    audio: true,

                    video: false

                });

        }

        catch(error) {

            console.error(
                "Microphone error:",
                error
            );

            setCallState(
                "Microphone permission denied."
            );

            await sendToUser(
                targetUsername,
                "call-ended",
                {

                    from:
                        currentUsername,

                    to:
                        targetUsername,

                    callId:
                        callId

                }
            );

            cleanupCall();

            return;

        }


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.offer
                )
            );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await sendToUser(
            targetUsername,
            "call-answer",
            {

                from:
                    currentUsername,

                to:
                    targetUsername,

                callId:
                    callId,

                answer:
                    answer

            }
        );


        setCallState(
            "Connected"
        );


        incomingCallData =
            null;

    }

    catch(error) {

        console.error(
            "Accept call error:",
            error
        );

        cleanupCall();

        setStatus(
            "Could not accept the call.",
            "red"
        );

    }

}


/* =========================================
   CREATE PEER CONNECTION
========================================= */

async function createPeerConnection() {

    if(peerConnection) {

        peerConnection.close();

        peerConnection =
            null;

    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    remoteStream =
        new MediaStream();


    remoteAudio =
        document.createElement(
            "audio"
        );


    remoteAudio.autoplay =
        true;


    remoteAudio.playsInline =
        true;


    remoteAudio.controls =
        false;


    remoteAudio.srcObject =
        remoteStream;


    document.getElementById(
        "audioContainer"
    )
    .appendChild(
        remoteAudio
    );


    peerConnection
        .ontrack =
        function(event) {

            if(
                event.streams &&
                event.streams[0]
            ) {

                event.streams[0]
                    .getTracks()
                    .forEach(
                        track => {

                            remoteStream
                                .addTrack(
                                    track
                                );

                        }
                    );

            }

            else {

                event.track
                    .addEventListener(
                        "ended",
                        () => {}
                    );

                remoteStream
                    .addTrack(
                        event.track
                    );

            }


            /*
             * Make sure browser starts
             * playing the remote audio.
             */

            if(remoteAudio) {

                remoteAudio
                    .play()
                    .catch(
                        error => {

                            console.warn(
                                "Audio autoplay waiting:",
                                error
                            );

                        }
                    );

            }

        };


    peerConnection
        .onicecandidate =
        async function(event) {

            if(
                !event.candidate
            )
                return;


            if(
                !targetUsername ||
                !callId
            )
                return;


            try {

                await sendToUser(
                    targetUsername,
                    "ice-candidate",
                    {

                        from:
                            currentUsername,

                        to:
                            targetUsername,

                        callId:
                            callId,

                        candidate:
                            event.candidate

                    }
                );

            }

            catch(error) {

                console.warn(
                    "ICE send error:",
                    error
                );

            }

        };


    peerConnection
        .onconnectionstatechange =
        function() {

            if(!peerConnection)
                return;


            const state =
                peerConnection
                .connectionState;


            console.log(
                "WebRTC connection:",
                state
            );


            if(
                state ===
                "connected"
            ) {

                setCallState(
                    "Connected"
                );

            }


            if(
                state ===
                "disconnected"
            ) {

                setCallState(
                    "Connection interrupted..."
                );

            }


            if(
                state ===
                "failed"
            ) {

                setCallState(
                    "Connection failed"
                );

            }


            if(
                state ===
                "closed"
            ) {

                cleanupCall();

            }

        };

}


/* =========================================
   CALL ANSWER
========================================= */

async function handleCallAnswer(
    data
) {

    if(!data)
        return;


    if(!isCaller)
        return;


    if(!peerConnection)
        return;


    if(
        data.to.toLowerCase() !==
        currentUsername.toLowerCase()
    )
        return;


    if(
        data.from.toLowerCase() !==
        targetUsername.toLowerCase()
    )
        return;


    if(
        data.callId !==
        callId
    )
        return;


    try {

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );


        setCallState(
            "Connected"
        );

    }

    catch(error) {

        console.error(
            "Answer error:",
            error
        );

    }

}


/* =========================================
   ICE CANDIDATE
========================================= */

async function handleIceCandidate(
    data
) {

    if(!data)
        return;


    if(!peerConnection)
        return;


    if(
        data.to.toLowerCase() !==
        currentUsername.toLowerCase()
    )
        return;


    if(
        !data.from
    )
        return;


    if(
        !targetUsername
    )
        return;


    if(
        data.from.toLowerCase() !==
        targetUsername.toLowerCase()
    )
        return;


    if(
        data.callId !==
        callId
    )
        return;


    if(
        !data.candidate
    )
        return;


    try {

        await peerConnection
            .addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );

    }

    catch(error) {

        console.warn(
            "ICE candidate error:",
            error
        );

    }

}


/* =========================================
   REMOTE CALL ENDED
========================================= */

async function handleRemoteCallEnded(
    data
) {

    if(!data)
        return;


    if(
        data.to &&
        data.to.toLowerCase() !==
        currentUsername.toLowerCase()
    ) {

        return;

    }


    if(
        data.callId &&
        callId &&
        data.callId !== callId
    ) {

        return;

    }


    cleanupCall();


    setStatus(
        "Call ended.",
        ""
    );

}


/* =========================================
   REMOTE CALL DECLINED
========================================= */

async function handleRemoteCallDeclined(
    data
) {

    if(!data)
        return;


    if(
        data.to &&
        data.to.toLowerCase() !==
        currentUsername.toLowerCase()
    ) {

        return;

    }


    if(
        data.callId &&
        callId &&
        data.callId !== callId
    ) {

        return;

    }


    cleanupCall();


    setStatus(
        "Call declined.",
        "red"
    );

}


/* =========================================
   DECLINE
========================================= */

async function declineCall() {

    if(!incomingCallData)
        return;


    const caller =
        incomingCallData.from;


    const incomingId =
        incomingCallData.callId;


    try {

        await sendToUser(
            caller,
            "call-declined",
            {

                from:
                    currentUsername,

                to:
                    caller,

                callId:
                    incomingId

            }
        );

    }

    catch(error) {

        console.warn(
            "Decline send error:",
            error
        );

    }


    incomingCallData =
        null;


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    targetUsername =
        "";


    callId =
        null;


    setStatus(
        "Call declined.",
        ""
    );

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true
) {

    const otherUser =
        targetUsername;


    const endingCallId =
        callId;


    if(
        notify &&
        otherUser
    ) {

        try {

            await sendToUser(
                otherUser,
                "call-ended",
                {

                    from:
                        currentUsername,

                    to:
                        otherUser,

                    callId:
                        endingCallId

                }
            );

        }

        catch(error) {

            console.warn(
                "End call signal error:",
                error
            );

        }

    }


    cleanupCall();


    setStatus(
        "Call ended.",
        ""
    );

}


/* =========================================
   CLEANUP
========================================= */

function cleanupCall() {

    if(localStream) {

        localStream
            .getTracks()
            .forEach(
                track => {

                    track.stop();

                }
            );


        localStream =
            null;

    }


    if(peerConnection) {

        peerConnection
            .ontrack =
            null;

        peerConnection
            .onicecandidate =
            null;

        peerConnection
            .onconnectionstatechange =
            null;


        peerConnection.close();


        peerConnection =
            null;

    }


    if(remoteAudio) {

        remoteAudio.pause();

        remoteAudio.srcObject =
            null;

        remoteAudio.remove();

        remoteAudio =
            null;

    }


    remoteStream =
        null;


    document.getElementById(
        "activeCall"
    )
    .classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isMuted =
        false;


    document.getElementById(
        "muteButton"
    )
    .innerText =
        "🎤";


    document.getElementById(
        "muteButton"
    )
    .classList.remove(
        "muted"
    );


    incomingCallData =
        null;


    targetUsername =
        "";


    targetProfile =
        null;


    callId =
        null;


    isCaller =
        false;


    callActive =
        false;

}

   SHOW ACTIVE CALL
========================================= */

function showActiveCall(

    )

/* =========================================
   CALL STATE
========================================= */

function setCallState(
    text
) {

        "callState"
    )
    .innerText =

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   INCOMING SOUND
========================================= */

let ringtoneContext = null;

let ringtoneTimer = null;


function playIncomingSound() {

    stopIncomingSound();


    try {

        ringtoneContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const playTone =
            function() {

                if(
                    !ringtoneContext
                )
                    return;


                const oscillator =
                    ringtoneContext
                    .createOscillator();


                const gain =
                    ringtoneContext
                    .createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency
                    .setValueAtTime(
                        700,
                        ringtoneContext
                            .currentTime
                    );


                oscillator.frequency
                    .setValueAtTime(
                        900,
                        ringtoneContext
                            .currentTime +
                            .18
                    );


                gain.gain.setValueAtTime(
                    0.0001,
                    ringtoneContext
                        .currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.18,
                    ringtoneContext
                        .currentTime +
                        .03
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    ringtoneContext
                        .currentTime +
                        .35
                );


                oscillator
                    .connect(gain);


                gain.connect(
                    ringtoneContext.destination
                );


                oscillator.start();


                oscillator.stop(
                    ringtoneContext
                        .currentTime +
                        .4
                );

            };


        playTone();


        ringtoneTimer =
            setInterval(
                playTone,
                1300
            );

    }

    catch(error) {

        console.warn(
            "Could not play ringtone:",
            error
        );

    }

}


/* =========================================
   STOP INCOMING SOUND
========================================= */

function stopIncomingSound() {

    if(ringtoneTimer) {

        clearInterval(
            ringtoneTimer
        );

        ringtoneTimer =
            null;

    }


    if(ringtoneContext) {

        try {

            ringtoneContext.close();

        }

        catch(error) {}

        ringtoneContext =
            null;

    }

}


/* =========================================
   DISABLE CALL BUTTON
========================================= */

function disableCallButton(
    disabled
) {

    const button =
        document.getElementById(
            "callButton"
        );


    button.disabled =
        disabled;


    button.innerText =

/* =========================================
   STATUS
========================================= */

function setStatus(

    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        text;


    status.className =
        "status " +
        (type || "");

}

);
