<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<title>ChatsApp Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Inter, Arial, sans-serif;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 20% 20%, #253b6e 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #34205d 0%, transparent 35%),
        #080b14;
}

.call-app {
    width: 100%;
    max-width: 520px;
    padding: 30px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    background: linear-gradient(
        135deg,
        #5b8cff,

    );

    box-shadow:

}

h1 {
    text-align: center;

}

.subtitle {
    text-align: center;

}

.card {
    padding: 25px;

    border-radius: 22px;

}

label {
    display: block;

    color: #9ca5ba;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 15px;

    background: #0e1220;

    font-size: 15px;
}

input:focus {
    border-color: #638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

button {
    border: 0;

    cursor: pointer;

    color: white;

    font-weight: 700;

    border-radius: 13px;

}

button:hover {
    transform: translateY(-2px);
}

.call-button {
    width: 100%;

    padding: 15px;

}

.status.green {
    color: #55d88a;
}

.status.red {
    color: #ff8585;
}


/* =========================
   INCOMING CALL
========================= */

.incoming {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 65%
        );

    align-items: center;

    justify-content: center;

    padding: 25px;
}

.incoming.show {
    display: flex;
}

.incoming-box {
    text-align: center;

    width: 100%;
    max-width: 400px;

    padding: 40px 25px;

    border-radius: 28px;

    background: rgba(18,23,38,.95);

    border: 1px solid #30384f;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.caller-avatar {
    width: 100px;
    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        callerPulse 1.5s infinite;
}

@keyframes callerPulse {

    0%,100% {
        box-shadow:
            0 0 0 0 rgba(91,140,255,.35);
    }

    50% {
        box-shadow:
            0 0 0 18px rgba(91,140,255,0);
    }

}

.incoming-box h2 {
    margin: 0;
    font-size: 27px;
}

.incoming-box p {
    color: #818ba3;
    margin: 10px 0 30px;
}

.incoming-buttons {
    display: flex;
    gap: 12px;
}

.accept {
    flex: 1;
    padding: 15px;
    background: #39c878;
}

.decline {
    flex: 1;
    padding: 15px;

}


/* =========================
   ACTIVE CALL
========================= */

.active-call {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 70%
        );

    align-items: center;

    justify-content: center;
}

.active-call.show {
    display: flex;
}

.active-box {
    text-align: center;
}

.active-avatar {
    width: 130px;
    height: 130px;

    margin: 0 auto 25px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        activePulse 2s infinite;
}

@keyframes activePulse {

    0%,100% {
        box-shadow:
            0 0 35px rgba(91,140,255,.25);
    }

    50% {
        box-shadow:
            0 0 70px rgba(91,140,255,.55);
    }

}

.active-name {
    font-size: 28px;
    font-weight: 800;
}

.call-state {
    margin-top: 8px;
    color: #55d88a;
}

.call-controls {
    margin-top: 35px;

    display: flex;

    justify-content: center;

}

.control {

}

.end-call {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #e34f5f;

    font-size: 24px;
}


/* =========================
   HIDDEN AUDIO
========================= */

#audioContainer {
    display: none;
}

</style>

<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let incomingCallData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let remoteAudio = null;

let isMuted = false;

let isCaller = false;

let callId = null;

let myInboxChannel = null;

let activeSignalChannel = null;


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    async function() {

        await initializeCallSystem();

    }
);


/* =========================================
   INITIALIZE
========================================= */

async function initializeCallSystem() {

    try {

        const savedUsername =
            localStorage.getItem(
                "chatsapp_username"
            );


        if(savedUsername) {

            currentUsername =
                savedUsername.trim();

        }


        const sessionResult =
            await supabaseClient
            .auth
            .getSession();


        const session =
            sessionResult?.data?.session;


        if(
            session &&
            session.user
        ) {

            currentUsername =
                (
                    session.user.user_metadata?.username ||
                    session.user.email?.split("@")[0] ||
                    ""
                ).trim();

        }


        if(!currentUsername) {

            setStatus(
                "Please log in to ChatsApp first.",
                "red"
            );

            return;

        }


        setStatus(
            "Connecting to Calls...",
            ""
        );


        await setupCallInbox();


        setStatus(
            "Ready to call",
            "green"
        );

    }

    catch(error) {

        console.error(
            "CALL SYSTEM START ERROR:",
            error
        );

        setStatus(
            "Call system could not connect.",
            "red"
        );

    }

}


/* =========================================
   PERSONAL CALL INBOX
========================================= */

async function setupCallInbox() {

    const inboxName =
        getInboxName(
            currentUsername
        );


    console.log(
        "CALL INBOX:",
        inboxName
    );


    myInboxChannel =
        supabaseClient.channel(
            inboxName,
            {
                config: {

                    broadcast: {

                        ack: true,

                        self: false

                    }

                }

            }
        );


    /*
       IMPORTANT:

       ALL incoming call signals for this user
       arrive on THIS channel.

       We register every event BEFORE subscribe().
    */

    myInboxChannel

        .on(
            "broadcast",
            {
                event: "incoming-call"
            },
            async ({ payload }) => {

                console.log(
                    "INCOMING CALL RECEIVED:",
                    payload
                );

                await handleIncomingCall(
                    payload
                );

            }
        )

        .on(
            "broadcast",
            {
                event: "call-answer"
            },
            async ({ payload }) => {

                console.log(
                    "CALL ANSWER RECEIVED:",
                    payload
                );

                await handleCallAnswer(
                    payload
                );

            }
        )

        .on(
            "broadcast",
            {
                event: "ice-candidate"
            },
            async ({ payload }) => {

                console.log(
                    "ICE CANDIDATE RECEIVED:",
                    payload
                );

                await handleIceCandidate(
                    payload
                );

            }
        )

        .on(
            "broadcast",
            {
                event: "call-ended"
            },
            async ({ payload }) => {

                console.log(
                    "CALL ENDED RECEIVED:",
                    payload
                );

                if(
                    payload &&
                    payload.callId &&
                    payload.callId === callId
                ) {

                    await endCall(
                        false
                    );

                }

            }
        )

        .on(
            "broadcast",
            {
                event: "call-declined"
            },
            async ({ payload }) => {

                console.log(
                    "CALL DECLINED RECEIVED:",
                    payload
                );

                if(
                    payload &&
                    payload.callId &&
                    payload.callId === callId
                ) {

                    setCallState(
                        "Declined"
                    );

                    setTimeout(
                        () => endCall(false),
                        1200
                    );

                }

            }
        );


    /*
       DO NOT send until SUBSCRIBED.
    */

    await new Promise(
        (resolve, reject) => {

            let finished = false;


            myInboxChannel.subscribe(
                status => {

                    console.log(
                        "CALL INBOX STATUS:",
                        status
                    );


                    if(
                        status ===
                        "SUBSCRIBED"
                    ) {

                        if(!finished) {

                            finished = true;

                            resolve();

                        }

                    }


                    if(
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        if(!finished) {

                            finished = true;

                            reject(
                                new Error(
                                    "Call inbox channel error."
                                )
                            );

                        }

                    }


                    if(
                        status ===
                        "TIMED_OUT"
                    ) {

                        if(!finished) {

                            finished = true;

                            reject(
                                new Error(
                                    "Call inbox subscription timed out."
                                )
                            );

                        }

                    }

                }
            );

        }
    );

}


/* =========================================
   INBOX NAME
========================================= */

function getInboxName(
    username
) {

    return (
        "chatsapp-call-inbox-" +
        normalizeUsername(username)
    );

}


/* =========================================
   NORMALIZE USERNAME
========================================= */

function normalizeUsername(
    username
) {

    return String(
        username || ""
    )
    .trim()
    .toLowerCase()
    .replace(
        /[^a-z0-9_-]/g,
        ""
    );

}


/* =========================================
   SEND TO USER'S INBOX
========================================= */

async function sendToUser(
    username,
    event,
    payload
) {

    const normalized =
        normalizeUsername(
            username
        );


    if(!normalized) {

        throw new Error(
            "Invalid recipient."
        );

    }


    const channelName =
        getInboxName(
            normalized
        );


    console.log(
        "SENDING:",
        event,
        "TO:",
        channelName
    );


    const channel =
        supabaseClient.channel(
            channelName,
            {
                config: {

                    broadcast: {

                        ack: true,

                        self: false

                    }

                }

            }
        );


    /*
       Register nothing here because this is
       only the sender's temporary channel.

       Subscribe first, THEN send.
    */

    await new Promise(
        (resolve, reject) => {

            let finished = false;


            channel.subscribe(
                status => {

                    console.log(
                        "SEND CHANNEL STATUS:",
                        status,
                        channelName
                    );


                    if(
                        status ===
                        "SUBSCRIBED"
                    ) {

                        if(!finished) {

                            finished = true;

                            resolve();

                        }

                    }


                    if(
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        if(!finished) {

                            finished = true;

                            reject(
                                new Error(
                                    "Could not connect to recipient inbox."
                                )
                            );

                        }

                    }


                    if(
                        status ===
                        "TIMED_OUT"
                    ) {

                        if(!finished) {

                            finished = true;

                            reject(
                                new Error(
                                    "Recipient inbox timed out."
                                )
                            );

                        }

                    }

                }
            );

        }
    );


    const response =
        await channel.send({

            type:
                "broadcast",

            event:
                event,

            payload:
                payload

        });


    console.log(
        "SEND RESULT:",
        response
    );


    /*
       Remove our temporary sender channel.
    */

    await supabaseClient.removeChannel(
        channel
    );


    return response;

}


/* =========================================
   FIND USER
========================================= */

async function usernameExists(
    username
) {

    /*
       This matches the existing player database
       setup used by the website.

       IMPORTANT:
       This does NOT allow random usernames.
    */

    const cleanUsername =
        String(username || "")
        .trim();


    if(!cleanUsername)
        return false;


    try {

        const result =
            await supabaseClient
            .from("players")
            .select("username")
            .ilike(
                "username",
                cleanUsername
            )
            .limit(1);


        if(result.error) {

            console.error(
                "USERNAME CHECK ERROR:",
                result.error
            );

            return false;

        }


        return Boolean(
            result.data &&
            result.data.length > 0
        );

    }

    catch(error) {

        console.error(
            "USERNAME CHECK FAILED:",
            error
        );

        return false;

    }

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    const input =
        document.getElementById(
            "targetUsername"
        );


    targetUsername =
        input.value.trim();


    if(!targetUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(
        normalizeUsername(
            targetUsername
        ) ===
        normalizeUsername(
            currentUsername
        )
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    /*
       REAL USER CHECK
    */

    setStatus(
        "Checking username...",
        ""
    );


    const exists =
        await usernameExists(
            targetUsername
        );


    if(!exists) {

        setStatus(
            "Invalid username ❌",
            "red"
        );

        return;

    }


    /*
       Use the exact username stored in the database.
       This keeps the displayed caller name correct.
    */

    try {

        const result =
            await supabaseClient
            .from("players")
            .select("username")
            .ilike(
                "username",
                targetUsername
            )
            .limit(1);


        if(
            result.data &&
            result.data[0] &&
            result.data[0].username
        ) {

            targetUsername =
                result.data[0].username;

        }

    }

    catch(error) {

        console.warn(
            "Could not retrieve exact username:",
            error
        );

    }


    callId =
        createCallId();


    isCaller =
        true;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Calling..."
    );


    try {

        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            }
        );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
            .setLocalDescription(
                offer
            );


        /*
           SEND OFFER TO THE ACTUAL USER'S
           PERSONAL INBOX.
        */

        await sendToUser(

            targetUsername,

            "incoming-call",

            {

                from:
                    currentUsername,

                callId:
                    callId,

                offer:
                    peerConnection
                    .localDescription

            }

        );


        setCallState(
            "Ringing..."
        );


        console.log(
            "CALL SENT SUCCESSFULLY TO:",
            targetUsername
        );

    }

    catch(error) {

        console.error(
            "START CALL ERROR:",
            error
        );


        setCallState(
            "Call failed"
        );


        setStatus(
            "Could not start the call.",
            "red"
        );


        await endCall(
            false
        );

    }

}


/* =========================================
   INCOMING CALL
========================================= */

async function handleIncomingCall(
    data
) {

    if(!data)
        return;


    if(!data.from)
        return;


    if(
        normalizeUsername(
            data.from
        ) ===
        normalizeUsername(
            currentUsername
        )
    ) {

        return;

    }


    /*
       If already inside another call,
       automatically reject the new one.
    */

    if(
        peerConnection ||
        incomingCallData
    ) {

        try {

            await sendToUser(

                data.from,

                "call-declined",

                {

                    from:
                        currentUsername,

                    callId:
                        data.callId

                }

            );

        }

        catch(error) {

            console.warn(
                error
            );

        }

        return;

    }


    incomingCallData =
        data;


    targetUsername =
        data.from;


    callId =
        data.callId;


    isCaller =
        false;


    document.getElementById(
        "callerName"
    )
    .innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    )
    .innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    )
    .classList.add(
        "show"
    );


    playRingtone();


    console.log(
        "SHOWING INCOMING CALL FROM:",
        data.from
    );

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData)
        return;


    stopRingtone();


    const callData =
        incomingCallData;


    incomingCallData =
        null;


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isCaller =
        false;


    targetUsername =
        callData.from;


    callId =
        callData.callId;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Connecting..."
    );


    try {

        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection.addTrack(
                    track,
                    localStream
                );

            }
        );


        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    callData.offer
                )
            );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
            .setLocalDescription(
                answer
            );


        await sendToUser(

            targetUsername,

            "call-answer",

            {

                from:
                    currentUsername,

                callId:
                    callId,

                answer:
                    peerConnection
                    .localDescription

            }

        );


        setCallState(
            "Connected"
        );


        console.log(
            "ANSWER SENT TO:",
            targetUsername
        );

    }

    catch(error) {

        console.error(
            "ACCEPT CALL ERROR:",
            error
        );


        setCallState(
            "Could not connect"
        );


        try {

            await sendToUser(

                targetUsername,

                "call-ended",

                {

                    from:
                        currentUsername,

                    callId:
                        callId

                }

            );

        }

        catch(sendError) {

            console.warn(
                sendError
            );

        }


        await endCall(
            false
        );

    }

}


/* =========================================
   CREATE PEER CONNECTION
========================================= */

async function createPeerConnection() {

    if(peerConnection) {

        try {

            peerConnection.close();

        }

        catch(error) {}

    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    remoteStream =
        new MediaStream();


    remoteAudio =
        document.createElement(
            "audio"
        );


    remoteAudio.autoplay =
        true;


    remoteAudio.playsInline =
        true;


    remoteAudio.controls =
        false;


    remoteAudio.srcObject =
        remoteStream;


    document
    .getElementById(
        "audioContainer"
    )
    .appendChild(
        remoteAudio
    );


    /*
       Incoming remote audio.
    */

    peerConnection.ontrack =
        function(event) {

            console.log(
                "REMOTE AUDIO TRACK RECEIVED"
            );


            if(
                event.streams &&
                event.streams[0]
            ) {

                event.streams[0]
                .getTracks()
                .forEach(
                    track => {

                        remoteStream.addTrack(
                            track
                        );

                    }
                );

            }


            if(remoteAudio) {

                remoteAudio.srcObject =
                    remoteStream;


                remoteAudio
                    .play()
                    .catch(
                        error => {

                            console.warn(
                                "Audio autoplay waiting for user interaction:",
                                error
                            );

                        }
                    );

            }


            setCallState(
                "Connected"
            );

        };


    /*
       Send ICE candidates directly to the
       OTHER USER'S personal inbox.
    */

    peerConnection.onicecandidate =
        async function(event) {

            if(!event.candidate)
                return;


            if(!targetUsername)
                return;


            try {

                await sendToUser(

                    targetUsername,

                    "ice-candidate",

                    {

                        from:
                            currentUsername,

                        callId:
                            callId,

                        candidate:
                            event.candidate

                    }

                );

            }

            catch(error) {

                console.warn(
                    "ICE SEND ERROR:",
                    error
                );

            }

        };


    peerConnection.onconnectionstatechange =
        function() {

            if(!peerConnection)
                return;


            console.log(
                "PEER CONNECTION STATE:",
                peerConnection
                .connectionState
            );


            switch(
                peerConnection.connectionState
            ) {

                case "connected":

                    setCallState(
                        "Connected"
                    );

                    break;


                case "connecting":

                    setCallState(
                        "Connecting..."
                    );

                    break;


                case "disconnected":

                    setCallState(
                        "Connection interrupted"
                    );

                    break;


                case "failed":

                    setCallState(
                        "Connection failed"
                    );

                    break;


                case "closed":

                    setCallState(
                        "Call ended"
                    );

                    break;

            }

        };

}


/* =========================================
   CALL ANSWER
========================================= */

async function handleCallAnswer(
    data
) {

    if(!data)
        return;


    if(!peerConnection)
        return;


    if(!isCaller)
        return;


    if(
        data.from &&
        normalizeUsername(
            data.from
        ) !==
        normalizeUsername(
            targetUsername
        )
    ) {

        return;

    }


    if(
        data.callId &&
        data.callId !== callId
    ) {

        return;

    }


    try {

        await peerConnection
            .setRemoteDescription(
                new RTCSessionDescription(
                    data.answer
                )
            );


        setCallState(
            "Connected"
        );


        console.log(
            "REMOTE ANSWER SET"
        );

    }

    catch(error) {

        console.error(
            "ANSWER ERROR:",
            error
        );

    }

}


/* =========================================
   ICE CANDIDATE
========================================= */

async function handleIceCandidate(
    data
) {

    if(!data)
        return;


    if(!data.candidate)
        return;


    if(!peerConnection)
        return;


    if(
        data.from &&
        normalizeUsername(
            data.from
        ) !==
        normalizeUsername(
            targetUsername
        )
    ) {

        return;

    }


    if(
        data.callId &&
        data.callId !== callId
    ) {

        return;

    }


    try {

        await peerConnection
            .addIceCandidate(
                new RTCIceCandidate(
                    data.candidate
                )
            );


        console.log(
            "ICE CANDIDATE ADDED"
        );

    }

    catch(error) {

        /*
           Sometimes ICE arrives before the remote
           description is completely ready.

           We don't crash the call if that happens.
        */

        console.warn(
            "ICE CANDIDATE WAIT/ERROR:",
            error
        );

    }

}


/* =========================================
   DECLINE
========================================= */

async function declineCall() {

    stopRingtone();


    const caller =
        incomingCallData?.from ||
        targetUsername;


    const declinedCallId =
        incomingCallData?.callId ||
        callId;


    try {

        if(caller) {

            await sendToUser(

                caller,

                "call-declined",

                {

                    from:
                        currentUsername,

                    callId:
                        declinedCallId

                }

            );

        }

    }

    catch(error) {

        console.warn(
            "DECLINE SEND ERROR:",
            error
        );

    }


    incomingCallData =
        null;


    callId =
        null;


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    setStatus(
        "Call declined.",
        ""
    );

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true
) {

    stopRingtone();


    const otherUser =
        targetUsername;


    const oldCallId =
        callId;


    if(
        notify &&
        otherUser
    ) {

        try {

            await sendToUser(

                otherUser,

                "call-ended",

                {

                    from:
                        currentUsername,

                    callId:
                        oldCallId

                }

            );

        }

        catch(error) {

            console.warn(
                "END CALL SIGNAL ERROR:",
                error
            );

        }

    }


    if(localStream) {

        localStream
        .getTracks()
        .forEach(
            track => {

                try {

                    track.stop();

                }

                catch(error) {}

            }
        );


        localStream =
            null;

    }


    if(peerConnection) {

        try {

            peerConnection.close();

        }

        catch(error) {}

        peerConnection =
            null;

    }


    if(remoteAudio) {

        try {

            remoteAudio.pause();

            remoteAudio.srcObject =
                null;

            remoteAudio.remove();

        }

        catch(error) {}

        remoteAudio =
            null;

    }


    remoteStream =
        null;


    document.getElementById(
        "activeCall"
    )
    .classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    incomingCallData =
        null;


    targetUsername =
        "";


    callId =
        null;


    isCaller =
        false;


    isMuted =
        false;


    const muteButton =
        document.getElementById(
            "muteButton"
        );


    muteButton.innerText =
        "🎤";


    muteButton.classList.remove(
        "muted"
    );


    setStatus(
        "Ready to call",
        "green"
    );

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
    .getAudioTracks()
    .forEach(
        track => {

            track.enabled =
                !isMuted;

        }
    );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   ACTIVE CALL UI
========================================= */

function showActiveCall(
    username
) {

    document.getElementById(
        "activeName"
    )
    .innerText =
        username;


    document.getElementById(
        "activeAvatar"
    )
    .innerText =
        username

        .toUpperCase();


    document.getElementById(

    )

    );

}


/* =========================================
   CALL STATE
========================================= */

function setCallState(
    text
) {

    document.getElementById(
        "callState"
    )
    .innerText =
        text;

}


/* =========================================
   STATUS
========================================= */

function setStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        text;


    status.className =
        "status " +
        (type || "");

}


/* =========================================
   CALL ID
========================================= */

function createCallId() {

    if(
        window.crypto &&
        crypto.randomUUID
    ) {

        return crypto.randomUUID();

    }


    return (
        Date.now().toString(36) +
        "-" +
        Math.random()
        .toString(36)
        .substring(2)
    );

}


/* =========================================
   RINGTONE
========================================= */

let ringtoneContext = null;

let ringtoneTimer = null;


function playRingtone() {

    stopRingtone();


    try {

        ringtoneContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        const playTone =
            () => {

                if(!ringtoneContext)
                    return;


                const oscillator =
                    ringtoneContext
                    .createOscillator();


                const gain =
                    ringtoneContext
                    .createGain();


                oscillator.type =
                    "sine";


                oscillator.frequency.value =
                    700;


                gain.gain.setValueAtTime(
                    0.0001,
                    ringtoneContext.currentTime
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.18,
                    ringtoneContext.currentTime + 0.03
                );


                gain.gain.exponentialRampToValueAtTime(
                    0.0001,
                    ringtoneContext.currentTime + 0.45
                );


                oscillator.connect(
                    gain
                );


                gain.connect(
                    ringtoneContext.destination
                );


                oscillator.start();


                oscillator.stop(
                    ringtoneContext.currentTime +
                    0.5
                );

            };


        playTone();


        ringtoneTimer =
            setInterval(
                playTone,
                1000
            );

    }

    catch(error) {

        console.warn(
            "Ringtone unavailable:",
            error
        );

    }

}


function stopRingtone() {

    if(ringtoneTimer) {

        clearInterval(
            ringtoneTimer
        );

        ringtoneTimer =
            null;

    }


    if(ringtoneContext) {

        try {

            ringtoneContext.close();

        }

        catch(error) {}

        ringtoneContext =
            null;

    }

}

                    catch(error) {}

                }
            );

        }


        if(peerConnection) {

            try {

            }

            catch(error) {}

        }

    }
);
