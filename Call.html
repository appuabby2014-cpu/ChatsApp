<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatsApp Calls</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Inter, Arial, sans-serif;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 20% 20%, #253b6e 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #34205d 0%, transparent 35%),
        #080b14;
}

.call-app {
    width: 100%;
    max-width: 520px;
    padding: 30px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    background: linear-gradient(
        135deg,
        #5b8cff,
        #795cff
    );

    box-shadow:
        0 10px 35px rgba(91,140,255,.35);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #818ba3;
    margin: 10px 0 30px;
}

.card {
    padding: 25px;

    border-radius: 22px;

    background: rgba(18,23,38,.9);

    border: 1px solid #283149;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

label {
    display: block;

    color: #9ca5ba;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid #30384f;

    background: #0e1220;

    color: white;

    outline: none;

    font-size: 15px;
}

input:focus {
    border-color: #638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

button {
    border: 0;

    cursor: pointer;

    color: white;

    font-weight: 700;

    border-radius: 13px;

    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
    transform: none;
}

.call-button {
    width: 100%;

    margin-top: 15px;

    padding: 15px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    font-size: 15px;
}

.home-button {
    width: 100%;

    margin-top: 12px;

    padding: 13px;

    background: #191f31;

    border: 1px solid #30384f;
}

.status {
    text-align: center;

    margin-top: 20px;

    min-height: 22px;

    color: #7f89a2;

    font-size: 14px;
}

.status.green {
    color: #55d88a;
}

.status.red {
    color: #ff8585;
}


/* =========================================
   INCOMING CALL
========================================= */

.incoming {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 65%
        );

    align-items: center;

    justify-content: center;

    padding: 25px;
}

.incoming.show {
    display: flex;
}

.incoming-box {
    text-align: center;

    width: 100%;
    max-width: 400px;

    padding: 40px 25px;

    border-radius: 28px;

    background: rgba(18,23,38,.97);

    border: 1px solid #30384f;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.caller-avatar {
    width: 100px;
    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation: callerPulse 1.5s infinite;
}

@keyframes callerPulse {

    0%,100% {
        box-shadow:
            0 0 0 0 rgba(91,140,255,.35);
    }

    50% {
        box-shadow:
            0 0 0 18px rgba(91,140,255,0);
    }

}

.incoming-box h2 {
    margin: 0;
    font-size: 27px;
}

.incoming-box p {
    color: #818ba3;
    margin: 10px 0 30px;
}

.incoming-buttons {
    display: flex;
    gap: 12px;
}

.accept {
    flex: 1;
    padding: 15px;
    background: #39c878;
}

.decline {
    flex: 1;
    padding: 15px;
    background: #e34f5f;
}


/* =========================================
   ACTIVE CALL
========================================= */

.active-call {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 70%
        );

    align-items: center;

    justify-content: center;
}

.active-call.show {
    display: flex;
}

.active-box {
    text-align: center;
}

.active-avatar {
    width: 130px;
    height: 130px;

    margin: 0 auto 25px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation: activePulse 2s infinite;
}

@keyframes activePulse {

    0%,100% {
        box-shadow:
            0 0 35px rgba(91,140,255,.25);
    }

    50% {
        box-shadow:
            0 0 70px rgba(91,140,255,.55);
    }

}

.active-name {
    font-size: 28px;
    font-weight: 800;
}

.call-state {
    margin-top: 8px;
    color: #55d88a;
}

.call-controls {
    margin-top: 35px;

    display: flex;

    justify-content: center;

    gap: 15px;
}

.control {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #20283d;

    border: 1px solid #35405c;

    font-size: 22px;
}

.control.muted {
    background: #5b6380;
}

.end-call {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #e34f5f;

    font-size: 24px;
}


/* =========================================
   AUDIO
========================================= */

#audioContainer {
    position: fixed;
    width: 1px;
    height: 1px;
    overflow: hidden;
    opacity: 0;
    pointer-events: none;
}

</style>

</head>


<body>


<div class="call-app">

<div

>

</div>


<!-- =========================================
     ACTIVE CALL
========================================= -->

<div
    id="activeCall"

>

    <div class="active-box">

        <div
            id="activeAvatar"
            class="active-avatar"
        >
            C
        </div>

        <div
            id="activeName"

        >
            User
        </div>

        <div
            id="callState"

        </div>

        <div class="call-controls">

            <button
                id="muteButton"

            >
                🎤

            <button

                onclick="endCall()"

                ☎
            </button>

        </div>

    </div>

</div>


<div id="audioContainer"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let incomingCallData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let remoteAudio = null;

let isMuted = false;

let isCaller = false;

let inboxChannel = null;

let pairChannel = null;

let callId = null;

let callFinished = false;


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   PAGE START
========================================= */

window.addEventListener(
    "load",
    initializeCallSystem
);


async function initializeCallSystem() {

    try {

        setStatus(
            "Connecting to ChatsApp...",
            ""
        );


        const savedUsername =
            localStorage.getItem(
                "chatsapp_username"
            );


        if(savedUsername) {

            currentUsername =
                savedUsername.trim();

        }


        const sessionResult =
            await supabaseClient
            .auth
            .getSession();


        const session =
            sessionResult?.data?.session;


        if(
            session &&
            session.user
        ) {

            const metadataUsername =
                session.user
                .user_metadata
                ?.username;


            if(metadataUsername) {

                currentUsername =
                    metadataUsername.trim();

            }

            else if(session.user.email) {

                currentUsername =
                    session.user.email
                    .split("@")[0]
                    .trim();

            }

        }


        if(!currentUsername) {

            setStatus(
                "Please log in to ChatsApp first.",
                "red"
            );

            return;

        }


        /*
         * Make sure the username actually exists
         * in the real profiles table.
         */

        const validUser =
            await usernameExists(
                currentUsername
            );


        if(!validUser) {

            setStatus(
                "Your ChatsApp username was not found.",
                "red"
            );

            return;

        }


        await setupPersonalInbox();


        setStatus(
            "Ready to call 📞",
            "green"
        );

        console.log(
            "Call system ready for:",
            currentUsername
        );

    }

    catch(error) {

        console.error(
            "CALL SYSTEM START ERROR:",
            error
        );

        setStatus(
            "Could not start calling system.",
            "red"
        );

    }

}


/* =========================================
   USERNAME LOOKUP
========================================= */

async function usernameExists(
    username
) {

    if(!username)
        return false;


    try {

        const result =
            await supabaseClient
            .from("profiles")
            .select("username")
            .ilike(
                "username",
                username
            )
            .limit(1);


        if(result.error) {

            console.error(
                "USERNAME LOOKUP ERROR:",
                result.error
            );

            return false;

        }


        return (
            Array.isArray(result.data) &&
            result.data.length > 0
        );

    }

    catch(error) {

        console.error(
            "USERNAME LOOKUP EXCEPTION:",
            error
        );

        return false;

    }

}


/* =========================================
   FIND REAL USERNAME
========================================= */

async function getRealUsername(
    username
) {

    try {

        const result =
            await supabaseClient
            .from("profiles")
            .select("username")
            .ilike(
                "username",
                username
            )
            .limit(1);


        if(
            result.error ||
            !result.data ||
            result.data.length === 0
        ) {

            return null;

        }


        return result.data[0].username;

    }

    catch(error) {

        console.error(error);

        return null;

    }

}


/* =========================================
   SAFE CHANNEL NAME
========================================= */

function makeInboxChannelName(
    username
) {

    /*
     * Base64-style encoding is avoided because
     * Realtime topic names should remain simple.
     *
     * We normalize the username so both sides
     * calculate the exact same channel.
     */

    return (
        "chatsapp-call-inbox-" +
        username
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, "-")
    );

}


/* =========================================
   PERSONAL INBOX
========================================= */

async function setupPersonalInbox() {

    if(inboxChannel) {

        try {

            await supabaseClient
            .removeChannel(
                inboxChannel
            );

        }

        catch(error) {

            console.warn(error);

        }

    }


    const channelName =
        makeInboxChannelName(
            currentUsername
        );


    console.log(
        "Subscribing to personal call inbox:",
        channelName
    );


    inboxChannel =
        supabaseClient
        .channel(
            channelName,
            {
                config: {
                    broadcast: {
                        self: false
                    }
                }
            }
        );


    inboxChannel
        .on(
            "broadcast",
            {
                event: "incoming-call"
            },
            payload => {

                console.log(
                    "INCOMING CALL EVENT:",
                    payload
                );


                handleIncomingCall(
                    payload.payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event: "call-answer"
            },
            async payload => {

                console.log(
                    "CALL ANSWER EVENT:",
                    payload
                );


                await handleCallAnswer(
                    payload.payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event: "ice-candidate"
            },
            async payload => {

                console.log(
                    "ICE EVENT:",
                    payload
                );


                await handleIceCandidate(
                    payload.payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event: "call-accepted"
            },
            payload => {

                console.log(
                    "CALL ACCEPTED:",
                    payload
                );

            }
        )
        .on(
            "broadcast",
            {
                event: "call-declined"
            },
            payload => {

                console.log(
                    "CALL DECLINED:",
                    payload
                );


                if(
                    payload.payload &&
                    payload.payload.callId === callId
                ) {

                    setCallState(
                        "Call declined."
                    );

                    setTimeout(
                        () => endCall(false),
                        1000
                    );

                }

            }
        )
        .on(
            "broadcast",
            {
                event: "call-ended"
            },
            payload => {

                console.log(
                    "CALL ENDED:",
                    payload
                );


                if(
                    payload.payload &&
                    payload.payload.callId === callId
                ) {

                    endCall(false);

                }

            }
        );


    /*
     * CRITICAL:
     * Wait until Supabase confirms subscription.
     */

    await new Promise(
        (resolve, reject) => {

            const timeout =
                setTimeout(
                    () => {

                        reject(
                            new Error(
                                "Call inbox subscription timed out."
                            )
                        );

                    },
                    10000
                );


            inboxChannel.subscribe(
                status => {

                    console.log(
                        "CALL INBOX STATUS:",
                        status
                    );


                    if(status === "SUBSCRIBED") {

                        clearTimeout(
                            timeout
                        );

                        resolve();

                    }


                    if(status === "CHANNEL_ERROR") {

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Realtime channel error."
                            )
                        );

                    }


                    if(status === "TIMED_OUT") {

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Realtime channel timed out."
                            )
                        );

                    }

                }
            );

        }
    );

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    if(!currentUsername) {

        setStatus(
            "You are not logged in.",
            "red"
        );

        return;

    }


    if(callId) {

        setStatus(
            "You are already in a call.",
            "red"
        );

        return;

    }


    const input =
        document.getElementById(
            "targetUsername"
        );


    const enteredUsername =
        input.value.trim();


    if(!enteredUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(
        enteredUsername.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    setStatus(
        "Checking username...",
        ""
    );


    /*
     * IMPORTANT:
     * Check the REAL profiles table.
     */

    const realUsername =
        await getRealUsername(
            enteredUsername
        );


    if(!realUsername) {

        setStatus(
            "Invalid username ❌",
            "red"
        );

        return;

    }


    targetUsername =
        realUsername;


    callId =
        crypto.randomUUID();


    isCaller = true;

    callFinished = false;


    disableCallButton(
        true
    );


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Calling..."
    );


    try {

        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection
                    .addTrack(
                        track,
                        localStream
                    );

            }
        );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
        .setLocalDescription(
            offer
        );


        /*
         * Send directly to the exact user's inbox.
         */

        const recipientChannel =
            await createTemporaryChannel(
                makeInboxChannelName(
                    targetUsername
                )
            );


        await recipientChannel.send({

            type:
                "broadcast",

            event:
                "incoming-call",

            payload: {

                callId:
                    callId,

                from:
                    currentUsername,

                to:
                    targetUsername,

                offer:
                    offer

            }

        });


        setCallState(
            "Ringing..."
        );


        console.log(
            "CALL SENT TO:",
            targetUsername
        );


    }

    catch(error) {

        console.error(
            "START CALL ERROR:",
            error
        );


        setCallState(
            "Could not start call."
        );


        setStatus(
            "Microphone or calling error.",
            "red"
        );


        await endCall(
            false
        );

    }

}


/* =========================================
   TEMPORARY SENDER CHANNEL
========================================= */

async function createTemporaryChannel(
    channelName
) {

    const channel =
        supabaseClient
        .channel(
            channelName,
            {
                config: {
                    broadcast: {
                        self: false
                    }
                }
            }
        );


    await new Promise(
        (resolve, reject) => {

            const timeout =
                setTimeout(
                    () => {

                        reject(
                            new Error(
                                "Recipient channel timeout."
                            )
                        );

                    },
                    10000
                );


            channel.subscribe(
                status => {

                    console.log(
                        "SENDER CHANNEL:",
                        channelName,
                        status
                    );


                    if(status === "SUBSCRIBED") {

                        clearTimeout(
                            timeout
                        );

                        resolve();

                    }


                    if(
                        status === "CHANNEL_ERROR" ||
                        status === "TIMED_OUT"
                    ) {

                        clearTimeout(
                            timeout
                        );

                        reject(
                            new Error(
                                "Could not connect to recipient channel."
                            )
                        );

                    }

                }
            );

        }
    );


    return channel;

}


/* =========================================
   INCOMING CALL
========================================= */

function handleIncomingCall(
    data
) {

    console.log(
        "HANDLING INCOMING CALL:",
        data
    );


    if(!data)
        return;


    if(!data.from)
        return;


    if(!data.offer)
        return;


    if(!data.callId)
        return;


    /*
     * Make absolutely sure this call is for us.
     */

    if(
        !data.to ||
        data.to.toLowerCase() !==
        currentUsername.toLowerCase()
    ) {

        console.warn(
            "Ignoring call not addressed to this user."
        );

        return;

    }


    if(
        data.from.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        return;

    }


    /*
     * Don't replace an existing call.
     */

    if(callId) {

        console.warn(
            "Already handling another call."
        );

        return;

    }


    callId =
        data.callId;


    targetUsername =
        data.from;


    isCaller =
        false;


    incomingCallData =
        data;


    document.getElementById(
        "callerName"
    )
    .innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    )
    .innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    )
    .classList.add(
        "show"
    );


    playIncomingSound();


    console.log(
        "INCOMING CALL FROM:",
        data.from
    );

}


/* =========================================
   INCOMING CALL SOUND
========================================= */

let ringtoneContext = null;

let ringtoneOscillator = null;

let ringtoneGain = null;

let ringtoneTimer = null;


function playIncomingSound() {

    stopIncomingSound();


    try {

        ringtoneContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();


        ringtoneGain =
            ringtoneContext
            .createGain();


        ringtoneGain.gain.value =
            0.08;


        ringtoneGain.connect(
            ringtoneContext.destination
        );


        function beep() {

            if(!ringtoneContext)
                return;


            ringtoneOscillator =
                ringtoneContext
                .createOscillator();


            ringtoneOscillator.type =
                "sine";


            ringtoneOscillator.frequency.value =
                700;


            ringtoneOscillator.connect(
                ringtoneGain
            );


            ringtoneOscillator.start();


            ringtoneOscillator.stop(
                ringtoneContext.currentTime + 0.25
            );

        }


        beep();


        ringtoneTimer =
            setInterval(
                beep,
                1200
            );

    }

    catch(error) {

        console.warn(
            "Could not play ringtone:",
            error
        );

    }

}


function stopIncomingSound() {

    if(ringtoneTimer) {

        clearInterval(
            ringtoneTimer
        );

        ringtoneTimer =
            null;

    }


    if(ringtoneOscillator) {

        try {

            ringtoneOscillator.stop();

        }

        catch(error) {}

        ringtoneOscillator =
            null;

    }


    if(ringtoneContext) {

        try {

            ringtoneContext.close();

        }

        catch(error) {}

        ringtoneContext =
            null;

    }

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData)
        return;


    stopIncomingSound();


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isCaller =
        false;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Connecting..."
    );


    try {

        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
        .getTracks()
        .forEach(
            track => {

                peerConnection
                    .addTrack(
                        track,
                        localStream
                    );

            }
        );


        await peerConnection
        .setRemoteDescription(
            new RTCSessionDescription(
                incomingCallData.offer
            )
        );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
        .setLocalDescription(
            answer
        );


        /*
         * Send answer directly to caller's inbox.
         */

        const callerChannel =
            await createTemporaryChannel(
                makeInboxChannelName(
                    targetUsername
                )
            );


        await callerChannel.send({

            type:
                "broadcast",

            event:
                "call-answer",

            payload: {

                callId:
                    callId,

                from:
                    currentUsername,

                to:
                    targetUsername,

                answer:
                    answer

            }

        });


        /*
         * Tell caller we accepted.
         */

        await callerChannel.send({

            type:
                "broadcast",

            event:
                "call-accepted",

            payload: {

                callId:
                    callId,

                from:
                    currentUsername

            }

        });


        setCallState(
            "Connected"
        );


        incomingCallData =
            null;


        console.log(
            "CALL ACCEPTED:",
            targetUsername
        );

    }

    catch(error) {

        console.error(
            "ACCEPT CALL ERROR:",
            error
        );


        setCallState(
            "Could not accept call."
        );


        await endCall(
            true
        );

    }

}


/* =========================================
   PEER CONNECTION
========================================= */

async function createPeerConnection() {

    if(peerConnection) {

        try {

            peerConnection.close();

        }

        catch(error) {}

    }


    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    remoteStream =
        new MediaStream();


    remoteAudio =
        document.createElement(
            "audio"
        );


    remoteAudio.autoplay =
        true;


    remoteAudio.playsInline =
        true;


    remoteAudio.controls =
        false;


    remoteAudio.srcObject =
        remoteStream;


    document.getElementById(
        "audioContainer"
    )
    .appendChild(
        remoteAudio
    );


    peerConnection.ontrack =
        function(event) {

            console.log(
                "REMOTE AUDIO RECEIVED"
            );


            event.streams[0]
            .getTracks()
            .forEach(
                track => {

                    remoteStream.addTrack(
                        track
                    );

                }
            );


            remoteAudio.srcObject =
                remoteStream;


            remoteAudio
            .play()
            .catch(
                error => {

                    console.warn(
                        "Audio autoplay blocked:",
                        error
                    );

                }
            );

        };


    peerConnection.onconnectionstatechange =
        function() {

            console.log(
                "WEBRTC STATE:",
                peerConnection
                .connectionState
            );


            if(
                peerConnection
                .connectionState ===
                "connected"
            ) {

                setCallState(
                    "Connected"
                );

            }


            if(
                peerConnection
                .connectionState ===
                "failed"
            ) {

                setCallState(
                    "Connection failed."
                );

            }


            if(
                peerConnection
                .connectionState ===
                "disconnected"
            ) {

                setCallState(
                    "Disconnected"
                );

            }

        };


    /*
     * Send ICE candidates through the
     * recipient's personal inbox.
     */

    peerConnection.onicecandidate =
        async function(event) {

            if(!event.candidate)
                return;


            if(!targetUsername)
                return;


            try {

                const recipientChannel =
                    await createTemporaryChannel(
                        makeInboxChannelName(
                            targetUsername
                        )
                    );


                await recipientChannel.send({

                    type:
                        "broadcast",

                    event:
                        "ice-candidate",

                    payload: {

                        callId:
                            callId,

                        from:
                            currentUsername,

                        to:
                            targetUsername,

                        candidate:
                            event.candidate

                    }

                });

            }

            catch(error) {

                console.error(
                    "ICE SEND ERROR:",
                    error
                );

            }

        };

}


/* =========================================
   HANDLE ANSWER
========================================= */

async function handleCallAnswer(
    data
) {

    if(!data)
        return;


    if(!isCaller)
        return;


    if(!peerConnection)
        return;


    if(
        data.callId !== callId
    )
        return;


    if(
        !data.from ||
        data.from.toLowerCase() !==
        targetUsername.toLowerCase()
    )
        return;


    if(!data.answer)
        return;


    try {

        await peerConnection
        .setRemoteDescription(
            new RTCSessionDescription(
                data.answer
            )
        );


        setCallState(
            "Connected"
        );


        console.log(
            "ANSWER APPLIED"
        );

    }

    catch(error) {

        console.error(
            "ANSWER ERROR:",
            error
        );

    }

}


/* =========================================
   HANDLE ICE
========================================= */

async function handleIceCandidate(
    data
) {

    if(!data)
        return;


    if(!peerConnection)
        return;


    if(
        data.callId !== callId
    )
        return;


    if(
        !data.candidate
    )
        return;


    if(
        !data.from ||
        data.from.toLowerCase() !==
        targetUsername.toLowerCase()
    )
        return;


    try {

        await peerConnection
        .addIceCandidate(
            new RTCIceCandidate(
                data.candidate
            )
        );


        console.log(
            "ICE CANDIDATE ADDED"
        );

    }

    catch(error) {

        console.warn(
            "ICE ADD ERROR:",
            error
        );

    }

}


/* =========================================
   DECLINE
========================================= */

async function declineCall() {

    stopIncomingSound();


    if(
        incomingCallData &&
        incomingCallData.from &&
        callId
    ) {

        try {

            const callerChannel =
                await createTemporaryChannel(
                    makeInboxChannelName(
                        incomingCallData.from
                    )
                );


            await callerChannel.send({

                type:
                    "broadcast",

                event:
                    "call-declined",

                payload: {

                    callId:
                        callId,

                    from:
                        currentUsername

                }

            });

        }

        catch(error) {

            console.error(
                "DECLINE SIGNAL ERROR:",
                error
            );

        }

    }


    incomingCallData =
        null;


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    callId =
        null;


    targetUsername =
        "";


    isCaller =
        false;


    setStatus(
        "Call declined.",
        ""
    );


    disableCallButton(
        false
    );

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true
) {

    if(callFinished)
        return;


    callFinished =
        true;


    stopIncomingSound();


    const oldCallId =
        callId;


    const oldTarget =
        targetUsername;


    if(
        notify &&
        oldTarget &&
        oldCallId
    ) {

        try {

            const targetChannel =
                await createTemporaryChannel(
                    makeInboxChannelName(
                        oldTarget
                    )
                );


            await targetChannel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    callId:
                        oldCallId,

                    from:
                        currentUsername

                }

            });

        }

        catch(error) {

            console.warn(
                "END CALL SIGNAL ERROR:",
                error
            );

        }

    }


    if(localStream) {

        localStream
        .getTracks()
        .forEach(
            track => {

                track.stop();

            }
        );


        localStream =
            null;

    }


    if(remoteStream) {

        remoteStream
        .getTracks()
        .forEach(
            track => {

                track.stop();

            }
        );


        remoteStream =
            null;

    }


    if(remoteAudio) {

        remoteAudio.srcObject =
            null;


        try {

            remoteAudio.remove();

        }

        catch(error) {}

        remoteAudio =
            null;

    }


    if(peerConnection) {

        try {

            peerConnection.close();

        }

        catch(error) {}

        peerConnection =
            null;

    }


    document.getElementById(
        "activeCall"
    )
    .classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isMuted =
        false;


    const muteButton =
        document.getElementById(
            "muteButton"
        );


    muteButton.innerText =
        "🎤";


    muteButton.classList.remove(
        "muted"
    );


    incomingCallData =
        null;


    targetUsername =
        "";


    callId =
        null;


    isCaller =
        false;


    disableCallButton(
        false
    );


    setStatus(
        "Ready to call 📞",
        "green"
    );


    /*
     * Allow another call after cleanup.
     */

    setTimeout(
        () => {

            callFinished =
                false;

        },
        500
    );

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
    .getAudioTracks()
    .forEach(
        track => {

            track.enabled =
                !isMuted;

        }
    );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   ACTIVE CALL UI
========================================= */

function showActiveCall(
    username
) {

    document.getElementById(
        "activeName"
    )
    .innerText =
        username;


    document.getElementById(
        "activeAvatar"
    )
    .innerText =
        username
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "activeCall"
    )
    .classList.add(
        "show"
    );

}


/* =========================================
   CALL STATE
========================================= */

function setCallState(
    text
) {

    document.getElementById(
        "callState"
    )
    .innerText =
        text;

}


/* =========================================
   STATUS
========================================= */

function setStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        text;


    status.className =
        "status " +
        (type || "");

}


/* =========================================
   BUTTON
========================================= */

function disableCallButton(
    disabled
) {

    const button =
        document.getElementById(
            "callButton"
        );


    button.disabled =
        disabled;

}


/* =========================================
   HOME
========================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================
   CLEANUP
========================================= */

window.addEventListener(
    "beforeunload",
    function() {

        stopIncomingSound();


        if(localStream) {

            localStream
            .getTracks()
            .forEach(
                track => track.stop()
            );

        }


        if(peerConnection) {

            try {

                peerConnection.close();

            }

            catch(error) {}

        }

    }
);

</script>
