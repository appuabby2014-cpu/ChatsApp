<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ChatsApp Call</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;

    font-family: Inter, Arial, sans-serif;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    background:
        radial-gradient(circle at 20% 20%, #253b6e 0%, transparent 35%),
        radial-gradient(circle at 80% 80%, #34205d 0%, transparent 35%),
        #080b14;
}

.call-app {
    width: 100%;
    max-width: 520px;
    padding: 30px;
}

.logo {
    width: 70px;
    height: 70px;

    margin: 0 auto 20px;

    border-radius: 22px;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 32px;
    font-weight: 800;

    background: linear-gradient(
        135deg,
        #5b8cff,
        #795cff
    );

    box-shadow:
        0 10px 35px rgba(91,140,255,.35);
}

h1 {
    text-align: center;
    margin: 0;
    font-size: 32px;
}

.subtitle {
    text-align: center;
    color: #818ba3;
    margin: 10px 0 30px;
}

.card {
    padding: 25px;

    border-radius: 22px;

    background: rgba(18,23,38,.9);

    border: 1px solid #283149;

    box-shadow:
        0 25px 70px rgba(0,0,0,.45);
}

label {
    display: block;

    color: #9ca5ba;

    font-size: 13px;
    font-weight: 600;

    margin-bottom: 8px;
}

input {
    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border: 1px solid #30384f;

    background: #0e1220;

    color: white;

    outline: none;

    font-size: 15px;
}

input:focus {
    border-color: #638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

button {
    border: 0;
    cursor: pointer;
    color: white;
    font-weight: 700;
    border-radius: 13px;
    transition: .2s;
}

button:hover {
    transform: translateY(-2px);
}

button:disabled {
    opacity: .55;
    cursor: not-allowed;
    transform: none;
}

.call-button {
    width: 100%;

    margin-top: 15px;

    padding: 15px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    font-size: 15px;
}

.home-button {
    width: 100%;

    margin-top: 12px;

    padding: 13px;

    background: #191f31;

    border: 1px solid #30384f;
}

.status {
    text-align: center;

    margin-top: 20px;

    min-height: 22px;

    color: #7f89a2;

    font-size: 14px;
}

.status.green {
    color: #55d88a;
}

.status.red {
    color: #ff8585;
}


/* =========================
   INCOMING CALL
========================= */

.incoming {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 100;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 65%
        );

    align-items: center;

    justify-content: center;

    padding: 25px;
}

.incoming.show {
    display: flex;
}

.incoming-box {
    text-align: center;

    width: 100%;
    max-width: 400px;

    padding: 40px 25px;

    border-radius: 28px;

    background: rgba(18,23,38,.95);

    border: 1px solid #30384f;

    box-shadow:
        0 30px 100px rgba(0,0,0,.65);
}

.caller-avatar {
    width: 100px;
    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 40px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        callerPulse 1.5s infinite;
}

@keyframes callerPulse {

    0%,100% {
        box-shadow:
            0 0 0 0 rgba(91,140,255,.35);
    }

    50% {
        box-shadow:
            0 0 0 18px rgba(91,140,255,0);
    }

}

.incoming-box h2 {
    margin: 0;
    font-size: 27px;
}

.incoming-box p {
    color: #818ba3;
    margin: 10px 0 30px;
}

.incoming-buttons {
    display: flex;
    gap: 12px;
}

.accept {
    flex: 1;
    padding: 15px;
    background: #39c878;
}

.decline {
    flex: 1;
    padding: 15px;
    background: #e34f5f;
}


/* =========================
   ACTIVE CALL
========================= */

.active-call {
    display: none;

    position: fixed;

    inset: 0;

    z-index: 90;

    background:
        radial-gradient(
            circle at center,
            #172448,
            #080b14 70%
        );

    align-items: center;

    justify-content: center;
}

.active-call.show {
    display: flex;
}

.active-box {
    text-align: center;
}

.active-avatar {
    width: 130px;
    height: 130px;

    margin: 0 auto 25px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 50px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    animation:
        activePulse 2s infinite;
}

@keyframes activePulse {

    0%,100% {
        box-shadow:
            0 0 35px rgba(91,140,255,.25);
    }

    50% {
        box-shadow:
            0 0 70px rgba(91,140,255,.55);
    }

}

.active-name {
    font-size: 28px;
    font-weight: 800;
}

.call-state {
    margin-top: 8px;
    color: #55d88a;
}

.call-controls {
    margin-top: 35px;

    display: flex;

    justify-content: center;

    gap: 15px;
}

.control {
    width: 58px;
    height: 58px;

    border-radius: 50%;

    background: #20283d;

    border: 1px solid #35405c;

    font-size: 22px;
}

.control.muted {
    background: #5b6380;
}

.end-call {
    width: 65px;
    height: 65px;

    border-radius: 50%;

    background: #e34f5f;

    font-size: 24px;
}


/* =========================
   AUDIO
========================= */

#audioContainer {
    display: none;
}

</style>

</head>

<body>


<div class="call-app">

    <div class="logo">
        C
    </div>

    <h1>
        ChatsApp Call
    </h1>

    <p class="subtitle">
        Call somebody in realtime 📞
    </p>


    <div class="card">

        <label>
            Username to call
        </label>

        <input
            id="targetUsername"
            type="text"
            placeholder="Enter username..."
            maxlength="50"
            autocomplete="off"
        >

        <button
            id="callButton"
            class="call-button"
            onclick="startCall()"
        >
            📞 Call
        </button>

        <button
            class="home-button"
            onclick="goHome()"
        >
            ← Back to ChatsApp
        </button>

        <div
            id="status"
            class="status"
        >
            Ready to call
        </div>

    </div>

</div>


<!-- =========================
     INCOMING CALL
========================= -->

<div
    id="incomingCall"
    class="incoming"
>

    <div class="incoming-box">

        <div
            id="callerAvatar"
            class="caller-avatar"
        >
            C
        </div>

        <h2 id="callerName">
            Someone
        </h2>

        <p>
            📞 Incoming voice call...
        </p>

        <div class="incoming-buttons">

            <button
                class="accept"
                onclick="acceptCall()"
            >
                ✓ Accept
            </button>

            <button
                class="decline"
                onclick="declineCall()"
            >
                ✕ Decline
            </button>

        </div>

    </div>

</div>


<!-- =========================
     ACTIVE CALL
========================= -->

<div
    id="activeCall"
    class="active-call"
>

    <div class="active-box">

        <div
            id="activeAvatar"
            class="active-avatar"
        >
            C
        </div>

        <div
            id="activeName"
            class="active-name"
        >
            User
        </div>

        <div
            id="callState"
            class="call-state"
        >
            Connecting...
        </div>

        <div class="call-controls">

            <button
                id="muteButton"
                class="control"
                onclick="toggleMute()"
            >
                🎤
            </button>

            <button
                class="end-call"
                onclick="endCall()"
            >
                ☎
            </button>

        </div>

    </div>

</div>


<div id="audioContainer"></div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let targetUsernameExact = "";

let callChannel = null;

let pairChannel = null;

let incomingCallData = null;

let peerConnection = null;

let localStream = null;

let remoteStream = null;

let isMuted = false;

let isCaller = false;

let callStarted = false;


/* =========================================
   WEBRTC
========================================= */

const rtcConfiguration = {

    iceServers: [

        {
            urls:
                "stun:stun.l.google.com:19302"
        },

        {
            urls:
                "stun:stun1.l.google.com:19302"
        }

    ]

};


/* =========================================
   START
========================================= */

window.addEventListener(
    "load",
    async function() {

        const savedUsername =
            localStorage.getItem(
                "chatsapp_username"
            );

        if(savedUsername) {

            currentUsername =
                savedUsername.trim();

        }


        try {

            const {
                data
            } =
                await supabaseClient
                .auth
                .getSession();


            if(
                data &&
                data.session &&
                data.session.user
            ) {

                currentUsername =
                    data.session.user
                    .user_metadata?.username ||
                    data.session.user.email
                        .split("@")[0];

            }

        }

        catch(error) {

            console.warn(
                "Could not read auth session:",
                error
            );

        }


        if(!currentUsername) {

            setStatus(
                "Please log in to ChatsApp first.",
                "red"
            );

            return;

        }


        setupCallInbox();

    }
);


/* =========================================
   PERSONAL CALL INBOX
========================================= */

async function setupCallInbox() {

    const inboxName =
        getInboxChannelName(
            currentUsername
        );


    callChannel =
        supabaseClient
        .channel(inboxName);


    callChannel
        .on(
            "broadcast",
            {
                event: "incoming-call"
            },
            payload => {

                console.log(
                    "Incoming call received:",
                    payload
                );

                handleIncomingCall(
                    payload.payload
                );

            }
        )
        .subscribe(
            status => {

                console.log(
                    "Call inbox status:",
                    status
                );

            }
        );

}


/* =========================================
   INBOX CHANNEL NAME
========================================= */

function getInboxChannelName(
    username
) {

    return (
        "chatsapp-call-inbox-" +
        username
        .trim()
        .toLowerCase()
    );

}


/* =========================================
   START CALL
========================================= */

async function startCall() {

    const input =
        document.getElementById(
            "targetUsername"
        );


    const typedUsername =
        input.value.trim();


    if(!typedUsername) {

        setStatus(
            "Enter a username first.",
            "red"
        );

        return;

    }


    if(!currentUsername) {

        setStatus(
            "You are not logged in.",
            "red"
        );

        return;

    }


    if(
        typedUsername.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        setStatus(
            "You can't call yourself 😭",
            "red"
        );

        return;

    }


    setStatus(
        "Checking username...",
        ""
    );


    const callButton =
        document.getElementById(
            "callButton"
        );


    callButton.disabled =
        true;


    /*
       IMPORTANT:

       We check the actual players table
       BEFORE sending ANY call signal.
    */

    const user =
        await findExistingUser(
            typedUsername
        );


    if(!user) {

        callButton.disabled =
            false;

        setStatus(
            "Invalid username ❌",
            "red"
        );

        return;

    }


    /*
       Use the REAL username from Supabase.

       This prevents weird casing or accidental
       username mismatches.
    */

    targetUsernameExact =
        user.username;


    targetUsername =
        user.username;


    isCaller =
        true;

    callStarted =
        true;


    setStatus(
        "Connecting to " +
        targetUsername +
        "...",
        ""
    );


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Preparing call..."
    );


    try {

        await createPairChannel();


        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        const offer =
            await peerConnection
            .createOffer();


        await peerConnection
        .setLocalDescription(
            offer
        );


        /*
           THIS IS THE IMPORTANT FIX.

           We send the incoming call to the
           EXACT USER'S personal inbox.

           We do NOT broadcast the call to
           random users.
        */

        const recipientInbox =
            await getRecipientInboxChannel(
                targetUsernameExact
            );


        await recipientInbox.send({

            type:
                "broadcast",

            event:
                "incoming-call",

            payload: {

                from:
                    currentUsername,

                to:
                    targetUsernameExact,

                offer:
                    offer,

                timestamp:
                    Date.now()

            }

        });


        setCallState(
            "Ringing..."
        );


        setStatus(
            "Calling " +
            targetUsernameExact +
            "...",
            "green"
        );

    }

    catch(error) {

        console.error(
            "CALL ERROR:",
            error
        );


        setCallState(
            "Call failed."
        );


        setStatus(
            "Could not start the call.",
            "red"
        );


        await cleanupCall(
            false
        );

    }

    finally {

        callButton.disabled =
            false;

    }

}


/* =========================================
   FIND EXISTING USER
========================================= */

async function findExistingUser(
    username
) {

    try {

        /*
           We deliberately use ilike so:

           abby
           Abby
           ABBY

           can find the same existing user.
        */

        const {
            data,
            error
        } =
            await supabaseClient
            .from("players")
            .select("username")
            .ilike(
                "username",
                username
            )
            .limit(1);


        if(error) {

            console.error(
                "Username lookup failed:",
                error
            );

            setStatus(
                "Could not check usernames. Check your Supabase permissions.",
                "red"
            );

            return null;

        }


        if(
            !data ||
            data.length === 0
        ) {

            return null;

        }


        if(
            !data[0] ||
            !data[0].username
        ) {

            return null;

        }


        return data[0];

    }

    catch(error) {

        console.error(
            error
        );

        return null;

    }

}


/* =========================================
   GET RECIPIENT INBOX
========================================= */

async function getRecipientInboxChannel(
    username
) {

    const channelName =
        getInboxChannelName(
            username
        );


    let channel =
        supabaseClient
        .getChannels()
        .find(
            c =>
                c.topic ===
                "realtime:" +
                channelName
        );


    if(channel) {

        return channel;

    }


    channel =
        supabaseClient
        .channel(
            channelName
        );


    await new Promise(
        (resolve, reject) => {

            channel.subscribe(
                status => {

                    if(
                        status ===
                        "SUBSCRIBED"
                    ) {

                        resolve();

                    }

                    if(
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        reject(
                            new Error(
                                "Could not connect to recipient inbox."
                            )
                        );

                    }

                    if(
                        status ===
                        "TIMED_OUT"
                    ) {

                        reject(
                            new Error(
                                "Recipient inbox timed out."
                            )
                        );

                    }

                }
            );

        }
    );


    return channel;

}


/* =========================================
   INCOMING CALL
========================================= */

function handleIncomingCall(
    data
) {

    if(!data)
        return;


    if(!data.from)
        return;


    if(!data.offer)
        return;


    /*
       Make absolutely sure the call is
       actually meant for THIS username.
    */

    if(
        data.to &&
        data.to.toLowerCase() !==
        currentUsername.toLowerCase()
    ) {

        console.warn(
            "Ignoring call intended for:",
            data.to
        );

        return;

    }


    if(
        data.from.toLowerCase() ===
        currentUsername.toLowerCase()
    ) {

        return;

    }


    /*
       If already on a call, ignore the
       new incoming call.
    */

    if(
        callStarted ||
        peerConnection
    ) {

        console.warn(
            "Already in a call."
        );

        return;

    }


    incomingCallData =
        data;


    targetUsername =
        data.from;


    targetUsernameExact =
        data.from;


    document.getElementById(
        "callerName"
    )
    .innerText =
        data.from;


    document.getElementById(
        "callerAvatar"
    )
    .innerText =
        data.from
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "incomingCall"
    )
    .classList.add(
        "show"
    );


    setStatus(
        data.from +
        " is calling you 📞",
        "green"
    );

}


/* =========================================
   CREATE PRIVATE PAIR CHANNEL
========================================= */

async function createPairChannel() {

    const channelName =
        getPairChannelName(
            currentUsername,
            targetUsernameExact
        );


    if(pairChannel) {

        return pairChannel;

    }


    pairChannel =
        supabaseClient
        .channel(
            channelName
        );


    pairChannel
        .on(
            "broadcast",
            {
                event: "call-answer"
            },
            async payload => {

                if(!isCaller)
                    return;


                if(!peerConnection)
                    return;


                if(
                    !payload.payload ||
                    !payload.payload.answer
                )
                    return;


                if(
                    !payload.payload.from ||
                    payload.payload.from
                    .toLowerCase() !==
                    targetUsernameExact
                    .toLowerCase()
                ) {

                    return;

                }


                try {

                    await peerConnection
                    .setRemoteDescription(
                        new RTCSessionDescription(
                            payload.payload.answer
                        )
                    );


                    setCallState(
                        "Connected"
                    );

                    setStatus(
                        "Connected to " +
                        targetUsernameExact,
                        "green"
                    );

                }

                catch(error) {

                    console.error(
                        "Answer error:",
                        error
                    );

                }

            }
        )
        .on(
            "broadcast",
            {
                event: "ice-candidate"
            },
            async payload => {

                if(!peerConnection)
                    return;


                if(
                    !payload.payload ||
                    !payload.payload.candidate
                )
                    return;


                if(
                    !payload.payload.from
                )
                    return;


                if(
                    payload.payload.from
                    .toLowerCase() !==
                    targetUsernameExact
                    .toLowerCase()
                ) {

                    return;

                }


                try {

                    await peerConnection
                    .addIceCandidate(
                        new RTCIceCandidate(
                            payload.payload.candidate
                        )
                    );

                }

                catch(error) {

                    console.warn(
                        "ICE candidate error:",
                        error
                    );

                }

            }
        )
        .on(
            "broadcast",
            {
                event: "call-ended"
            },
            payload => {

                if(
                    !payload.payload ||
                    !payload.payload.from
                ) {

                    return;

                }


                if(
                    payload.payload.from
                    .toLowerCase() !==
                    targetUsernameExact
                    .toLowerCase()
                ) {

                    return;

                }


                cleanupCall(
                    false
                );

            }
        );


    await new Promise(
        (resolve, reject) => {

            pairChannel.subscribe(
                status => {

                    console.log(
                        "Pair channel:",
                        status
                    );


                    if(
                        status ===
                        "SUBSCRIBED"
                    ) {

                        resolve();

                    }


                    if(
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        reject(
                            new Error(
                                "Pair channel error."
                            )
                        );

                    }


                    if(
                        status ===
                        "TIMED_OUT"
                    ) {

                        reject(
                            new Error(
                                "Pair channel timed out."
                            )
                        );

                    }

                }
            );

        }
    );


    return pairChannel;

}


/* =========================================
   PAIR CHANNEL NAME
========================================= */

function getPairChannelName(
    username1,
    username2
) {

    return (
        "chatsapp-call-" +
        [
            username1
            .trim()
            .toLowerCase(),

            username2
            .trim()
            .toLowerCase()
        ]
        .sort()
        .join("-")
    );

}


/* =========================================
   ACCEPT CALL
========================================= */

async function acceptCall() {

    if(!incomingCallData)
        return;


    const callData =
        incomingCallData;


    incomingCallData =
        null;


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isCaller =
        false;


    callStarted =
        true;


    targetUsername =
        callData.from;


    targetUsernameExact =
        callData.from;


    showActiveCall(
        targetUsername
    );


    setCallState(
        "Connecting..."
    );


    try {

        await createPairChannel();


        await createPeerConnection();


        localStream =
            await navigator
            .mediaDevices
            .getUserMedia({

                audio: true,

                video: false

            });


        localStream
            .getTracks()
            .forEach(
                track => {

                    peerConnection
                        .addTrack(
                            track,
                            localStream
                        );

                }
            );


        await peerConnection
        .setRemoteDescription(
            new RTCSessionDescription(
                callData.offer
            )
        );


        const answer =
            await peerConnection
            .createAnswer();


        await peerConnection
        .setLocalDescription(
            answer
        );


        await pairChannel.send({

            type:
                "broadcast",

            event:
                "call-answer",

            payload: {

                from:
                    currentUsername,

                to:
                    targetUsernameExact,

                answer:
                    answer

            }

        });


        setCallState(
            "Connected"
        );


        setStatus(
            "Connected to " +
            targetUsernameExact,
            "green"
        );

    }

    catch(error) {

        console.error(
            "ACCEPT ERROR:",
            error
        );


        setCallState(
            "Call failed."
        );


        setStatus(
            "Could not accept the call.",
            "red"
        );


        await cleanupCall(
            true
        );

    }

}


/* =========================================
   CREATE PEER
========================================= */

async function createPeerConnection() {

    peerConnection =
        new RTCPeerConnection(
            rtcConfiguration
        );


    remoteStream =
        new MediaStream();


    const audio =
        document.createElement(
            "audio"
        );


    audio.autoplay =
        true;


    audio.playsInline =
        true;


    audio.controls =
        false;


    audio.srcObject =
        remoteStream;


    document.getElementById(
        "audioContainer"
    )
    .appendChild(
        audio
    );


    peerConnection
        .ontrack =
        function(event) {

            console.log(
                "Remote audio received."
            );


            if(
                event.streams &&
                event.streams[0]
            ) {

                event.streams[0]
                    .getTracks()
                    .forEach(
                        track => {

                            remoteStream
                                .addTrack(
                                    track
                                );

                        }
                    );

            }

            else {

                remoteStream
                    .addTrack(
                        event.track
                    );

            }


            audio.play()
                .catch(
                    error => {

                        console.warn(
                            "Audio autoplay blocked:",
                            error
                        );

                    }
                );

        };


    peerConnection
        .onconnectionstatechange =
        function() {

            console.log(
                "Connection state:",
                peerConnection
                .connectionState
            );


            if(
                peerConnection
                .connectionState ===
                "connected"
            ) {

                setCallState(
                    "Connected"
                );

            }


            if(
                peerConnection
                .connectionState ===
                "disconnected"
            ) {

                setCallState(
                    "Connection lost..."
                );

            }


            if(
                peerConnection
                .connectionState ===
                "failed"
            ) {

                setCallState(
                    "Connection failed."
                );

            }

        };


    peerConnection
        .onicecandidate =
        async function(event) {

            if(!event.candidate)
                return;


            if(!pairChannel)
                return;


            try {

                await pairChannel.send({

                    type:
                        "broadcast",

                    event:
                        "ice-candidate",

                    payload: {

                        from:
                            currentUsername,

                        to:
                            targetUsernameExact,

                        candidate:
                            event.candidate

                    }

                });

            }

            catch(error) {

                console.warn(
                    "Could not send ICE candidate:",
                    error
                );

            }

        };

}


/* =========================================
   DECLINE CALL
========================================= */

async function declineCall() {

    if(
        incomingCallData &&
        incomingCallData.from
    ) {

        const caller =
            incomingCallData.from;


        try {

            const channel =
                await getPairChannelForUser(
                    caller
                );


            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    from:
                        currentUsername,

                    to:
                        caller

                }

            });

        }

        catch(error) {

            console.warn(
                "Decline notification failed:",
                error
            );

        }

    }


    incomingCallData =
        null;


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    setStatus(
        "Call declined.",
        ""
    );

}


/* =========================================
   GET PAIR CHANNEL FOR DECLINE
========================================= */

async function getPairChannelForUser(
    username
) {

    const channelName =
        getPairChannelName(
            currentUsername,
            username
        );


    let channel =
        supabaseClient
        .getChannels()
        .find(
            c =>
                c.topic ===
                "realtime:" +
                channelName
        );


    if(channel) {

        return channel;

    }


    channel =
        supabaseClient
        .channel(
            channelName
        );


    await new Promise(
        (resolve, reject) => {

            channel.subscribe(
                status => {

                    if(
                        status ===
                        "SUBSCRIBED"
                    ) {

                        resolve();

                    }


                    if(
                        status ===
                        "CHANNEL_ERROR"
                    ) {

                        reject(
                            new Error(
                                "Could not connect to call channel."
                            )
                        );

                    }

                }
            );

        }
    );


    return channel;

}


/* =========================================
   END CALL
========================================= */

async function endCall(
    notify = true
) {

    if(
        notify &&
        targetUsernameExact
    ) {

        try {

            const channel =
                pairChannel ||
                await getPairChannelForUser(
                    targetUsernameExact
                );


            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    from:
                        currentUsername,

                    to:
                        targetUsernameExact

                }

            });

        }

        catch(error) {

            console.warn(
                "Could not notify other caller:",
                error
            );

        }

    }


    await cleanupCall(
        false
    );

}


/* =========================================
   CLEANUP
========================================= */

async function cleanupCall(
    notifyOther
) {

    if(
        notifyOther &&
        targetUsernameExact
    ) {

        try {

            const channel =
                pairChannel ||
                await getPairChannelForUser(
                    targetUsernameExact
                );


            await channel.send({

                type:
                    "broadcast",

                event:
                    "call-ended",

                payload: {

                    from:
                        currentUsername,

                    to:
                        targetUsernameExact

                }

            });

        }

        catch(error) {

            console.warn(
                error
            );

        }

    }


    if(localStream) {

        localStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

        localStream =
            null;

    }


    if(peerConnection) {

        peerConnection.close();

        peerConnection =
            null;

    }


    if(pairChannel) {

        try {

            await supabaseClient
                .removeChannel(
                    pairChannel
                );

        }

        catch(error) {

            console.warn(
                error
            );

        }


        pairChannel =
            null;

    }


    const audioContainer =
        document.getElementById(
            "audioContainer"
        );


    audioContainer.innerHTML =
        "";


    document.getElementById(
        "activeCall"
    )
    .classList.remove(
        "show"
    );


    document.getElementById(
        "incomingCall"
    )
    .classList.remove(
        "show"
    );


    isMuted =
        false;


    document.getElementById(
        "muteButton"
    )
    .innerText =
        "🎤";


    document.getElementById(
        "muteButton"
    )
    .classList.remove(
        "muted"
    );


    incomingCallData =
        null;


    targetUsername =
        "";


    targetUsernameExact =
        "";


    callStarted =
        false;


    isCaller =
        false;


    setStatus(
        "Call ended.",
        ""
    );

}


/* =========================================
   MUTE
========================================= */

function toggleMute() {

    if(!localStream)
        return;


    isMuted =
        !isMuted;


    localStream
        .getAudioTracks()
        .forEach(
            track => {

                track.enabled =
                    !isMuted;

            }
        );


    const button =
        document.getElementById(
            "muteButton"
        );


    button.innerText =
        isMuted
        ? "🔇"
        : "🎤";


    button.classList.toggle(
        "muted",
        isMuted
    );

}


/* =========================================
   SHOW ACTIVE CALL
========================================= */

function showActiveCall(
    username
) {

    document.getElementById(
        "activeName"
    )
    .innerText =
        username;


    document.getElementById(
        "activeAvatar"
    )
    .innerText =
        username
        .charAt(0)
        .toUpperCase();


    document.getElementById(
        "activeCall"
    )
    .classList.add(
        "show"
    );

}


/* =========================================
   CALL STATE
========================================= */

function setCallState(
    text
) {

    document.getElementById(
        "callState"
    )
    .innerText =
        text;

}


/* =========================================
   STATUS
========================================= */

function setStatus(
    text,
    type
) {

    const status =
        document.getElementById(
            "status"
        );


    status.innerText =
        text;


    status.className =
        "status " +
        (type || "");

}


/* =========================================
   HOME
========================================= */

function goHome() {

    window.location.href =
        "index.html";

}


/* =========================================
   ENTER KEY
========================================= */

document.getElementById(
    "targetUsername"
)
.addEventListener(
    "keydown",
    function(event) {

        if(
            event.key ===
            "Enter"
        ) {

            startCall();

        }

    }
);


/* =========================================
   CLEANUP ON CLOSE
========================================= */

window.addEventListener(
    "beforeunload",
    function() {

        if(localStream) {

            localStream
                .getTracks()
                .forEach(
                    track =>
                        track.stop()
                );

        }


        if(peerConnection) {

            peerConnection.close();

        }

    }
);

</script>
