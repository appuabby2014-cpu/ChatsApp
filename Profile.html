<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile - ChatsApp</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: "Inter", Arial, sans-serif;

    background:
        radial-gradient(circle at 15% 20%, #253b6e 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #34205d 0%, transparent 35%),
        #080b14;

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;
}

/* =========================================
   PROFILE CARD
========================================= */

.profile-card {
    width: 100%;
    max-width: 560px;

    padding: 40px;

    border-radius: 28px;

    background: rgba(18,22,38,0.92);

    border: 1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 30px 90px rgba(0,0,0,0.55),
        inset 0 1px rgba(255,255,255,0.06);

    backdrop-filter: blur(20px);

    text-align: center;
}

/* =========================================
   AVATAR
========================================= */

.avatar {
    width: 110px;
    height: 110px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    font-size: 45px;
    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    box-shadow:
        0 15px 45px rgba(91,140,255,0.35);

    transition:
        transform .25s ease,
        box-shadow .25s ease,
        background .25s ease;
}

.avatar:hover {
    transform: scale(1.05);
}

/* =========================================
   TITLE
========================================= */

h1 {
    margin: 0;

    font-size: 30px;

    letter-spacing: -1px;
}

.subtitle {
    color: #7f89a2;

    margin: 8px 0 30px;

    font-size: 14px;
}

/* =========================================
   INFORMATION
========================================= */

.info-box {
    text-align: left;

    padding: 20px;

    margin-bottom: 15px;

    border-radius: 17px;

    background: #101525;

    border: 1px solid #252c40;
}

.info-label {
    color: #737e98;

    font-size: 12px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 8px;
}

.info-value {
    font-size: 17px;

    font-weight: 600;

    word-break: break-word;
}

/* =========================================
   PASSWORD
========================================= */

.password {
    letter-spacing: 4px;

    color: #b9c1d4;
}

/* =========================================
   CUSTOMIZE PROFILE
========================================= */

.customize {
    margin-top: 25px;

    padding: 24px;

    border-radius: 20px;

    background: rgba(16,21,37,.9);

    border: 1px solid #252c40;

    text-align: left;
}

.customize-title {
    font-size: 19px;

    font-weight: 800;

    margin-bottom: 5px;
}

.customize-subtitle {
    color: #737e98;

    font-size: 13px;

    margin-bottom: 22px;
}

/* =========================================
   FIELDS
========================================= */

.field {
    margin-bottom: 17px;
}

.field label {
    display: block;

    color: #9da6bb;

    font-size: 12px;

    font-weight: 700;

    margin-bottom: 7px;

    text-transform: uppercase;

    letter-spacing: .8px;
}

.field input,
.field textarea {
    width: 100%;

    border: 1px solid #30384f;

    border-radius: 12px;

    padding: 13px 14px;

    background: #0b0f1c;

    color: white;

    outline: none;

    font-family: inherit;

    font-size: 14px;

    transition: .2s;
}

.field input:focus,
.field textarea:focus {
    border-color: #638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

.field textarea {
    resize: vertical;

    min-height: 80px;
}

/* =========================================
   EMOJI PICKER
========================================= */

.emoji-grid {
    display: grid;

    grid-template-columns:
        repeat(8, 1fr);

    gap: 7px;
}

.emoji-button {
    height: 42px;

    border: 1px solid #30384f;

    border-radius: 10px;

    background: #151a2a;

    color: white;

    font-size: 20px;

    cursor: pointer;

    transition: .18s;
}

.emoji-button:hover {
    transform: translateY(-2px);

    border-color: #5b8cff;

    background: #202a43;
}

.emoji-button.selected {
    border-color: #7097ff;

    background:
        rgba(91,140,255,.2);

    box-shadow:
        0 0 0 2px
        rgba(91,140,255,.12);
}

/* =========================================
   COLOR PICKER
========================================= */

.color-grid {
    display: flex;

    flex-wrap: wrap;

    gap: 10px;
}

.color-button {
    width: 34px;
    height: 34px;

    border-radius: 50%;

    border: 2px solid transparent;

    cursor: pointer;

    transition: .18s;
}

.color-button:hover {
    transform: scale(1.12);
}

.color-button.selected {
    border-color: white;

    box-shadow:
        0 0 0 3px
        rgba(255,255,255,.15);
}

/* =========================================
   LIVE PREVIEW
========================================= */

.preview-box {
    margin-top: 22px;

    padding: 18px;

    border-radius: 17px;

    background: #0b0f1c;

    border: 1px solid #252c40;
}

.preview-label {
    color: #737e98;

    font-size: 11px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 12px;
}

.preview-content {
    display: flex;

    align-items: center;

    gap: 13px;
}

.preview-avatar {
    width: 50px;
    height: 50px;

    flex-shrink: 0;

    border-radius: 50%;

    display: flex;

    align-items: center;
    justify-content: center;

    font-size: 22px;

    font-weight: 800;
}

.preview-name {
    font-size: 15px;

    font-weight: 700;
}

.preview-bio {
    color: #737e98;

    font-size: 12px;

    margin-top: 4px;

    word-break: break-word;
}

/* =========================================
   SAVE BUTTON
========================================= */

.save {
    width: 100%;

    padding: 15px;

    margin-top: 20px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.save:hover {
    transform: translateY(-2px);

    box-shadow:
        0 12px 30px
        rgba(91,140,255,.3);
}

.saved-message {
    display: none;

    margin-top: 10px;

    padding: 10px;

    border-radius: 10px;

    background:
        rgba(70,210,130,.1);

    border:
        1px solid
        rgba(70,210,130,.25);

    color: #71e0a0;

    font-size: 13px;

    text-align: center;
}

.saved-message.show {
    display: block;
}

/* =========================================
   BACK BUTTON
========================================= */

.back {
    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: 1px solid #30384f;

    border-radius: 14px;

    background: #151a2a;

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition: .2s;
}

.back:hover {
    transform: translateY(-2px);

    background: #202a43;
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    body {
        padding: 15px;
    }

    .profile-card {
        padding: 28px 20px;
    }

    .emoji-grid {
        grid-template-columns:
            repeat(6, 1fr);
    }

}

</style>

</head>

<body>

<div class="profile-card">

    <!-- PROFILE AVATAR -->

    <div
        class="avatar"
        id="avatar"
    >
        U
    </div>

    <h1>
        My Profile
    </h1>

    <div class="subtitle">
        Your ChatsApp account
    </div>

    <!-- USERNAME -->

    <div class="info-box">

        <div class="info-label">
            Username
        </div>

        <div
            class="info-value"
            id="username"
        >
            Loading...
        </div>

    </div>

    <!-- PASSWORD -->

    <div class="info-box">

        <div class="info-label">
            Password
        </div>

        <div class="info-value password">
            ••••••••••••
        </div>

    </div>

    <!-- CUSTOMIZE PROFILE -->

    <div class="customize">

        <div class="customize-title">
            ✨ Customize Profile
        </div>

        <div class="customize-subtitle">
            Make your ChatsApp profile yours.
        </div>

        <!-- DISPLAY NAME -->

        <div class="field">

            <label>
                Display Name
            </label>

            <input
                type="text"
                id="displayName"
                maxlength="30"
                placeholder="Enter your display name"
            >

        </div>

        <!-- BIO -->

        <div class="field">

            <label>
                Bio
            </label>

            <textarea
                id="bio"
                maxlength="120"
                placeholder="Tell people a little about yourself..."
            ></textarea>

        </div>

        <!-- AVATAR -->

        <div class="field">

            <label>
                Avatar
            </label>

            <div
                class="emoji-grid"
                id="emojiGrid"
            >

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="😀"
                >😀</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="😎"
                >😎</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="😄"
                >😄</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="😂"
                >😂</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🥳"
                >🥳</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🤩"
                >🤩</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="😈"
                >😈</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="👻"
                >👻</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🤖"
                >🤖</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="👽"
                >👽</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🐱"
                >🐱</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🐶"
                >🐶</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🦊"
                >🦊</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🐼"
                >🐼</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🐸"
                >🐸</button>

                <button
                    type="button"
                    class="emoji-button"
                    data-emoji="🦄"
                >🦄</button>

            </div>

        </div>

        <!-- AVATAR COLOR -->

        <div class="field">

            <label>
                Avatar Color
            </label>

            <div
                class="color-grid"
                id="colorGrid"
            >

                <button
                    type="button"
                    class="color-button"
                    data-color="linear-gradient(135deg,#5b8cff,#9c5cff)"
                    style="background:linear-gradient(135deg,#5b8cff,#9c5cff)"
                ></button>

                <button
                    type="button"
                    class="color-button"
                    data-color="linear-gradient(135deg,#ff5b8d,#ff795c)"
                    style="background:linear-gradient(135deg,#ff5b8d,#ff795c)"
                ></button>

                <button
                    type="button"
                    class="color-button"
                    data-color="linear-gradient(135deg,#5bffb1,#27b7ff)"
                    style="background:linear-gradient(135deg,#5bffb1,#27b7ff)"
                ></button>

                <button
                    type="button"
                    class="color-button"
                    data-color="linear-gradient(135deg,#ffcc5b,#ff7b5b)"
                    style="background:linear-gradient(135deg,#ffcc5b,#ff7b5b)"
                ></button>

                <button
                    type="button"
                    class="color-button"
                    data-color="linear-gradient(135deg,#ff5bd6,#8d5cff)"
                    style="background:linear-gradient(135deg,#ff5bd6,#8d5cff)"
                ></button>

                <button
                    type="button"
                    class="color-button"
                    data-color="linear-gradient(135deg,#5bfff1,#5b8cff)"
                    style="background:linear-gradient(135deg,#5bfff1,#5b8cff)"
                ></button>

            </div>

        </div>

        <!-- LIVE PREVIEW -->

        <div class="preview-box">

            <div class="preview-label">
                Live Preview
            </div>

            <div class="preview-content">

                <div
                    class="preview-avatar"
                    id="previewAvatar"
                >
                    😀
                </div>

                <div>

                    <div
                        class="preview-name"
                        id="previewName"
                    >
                        Your Name
                    </div>

                    <div
                        class="preview-bio"
                        id="previewBio"
                    >
                        Your bio will appear here.
                    </div>

                </div>

            </div>

        </div>

        <!-- SAVE -->

        <button
            type="button"
            class="save"
            onclick="saveProfile()"
        >
            💾 Save Profile
        </button>

        <div
            class="saved-message"
            id="savedMessage"
        >
            ✓ Profile saved successfully!
        </div>

    </div>

    <!-- BACK -->

    <button
        type="button"
        class="back"
        onclick="goBack()"
    >
        ← Back to ChatsApp
    </button>

</div>

<script>

/* =========================================
   USER
========================================= */

const username =
    localStorage.getItem(
        "chatsapp_username"
    );


/* =========================================
   DEFAULT VALUES
========================================= */

let selectedEmoji = "😀";

let selectedColor =
    "linear-gradient(135deg,#5b8cff,#9c5cff)";


/* =========================================
   LOAD PROFILE
========================================= */

function loadProfile() {

    if (!username) {

        document.getElementById(
            "username"
        ).innerText =
            "Unknown User";

        document.getElementById(
            "displayName"
        ).value =
            "Unknown User";

        updatePreview();

        return;

    }

    document.getElementById(
        "username"
    ).innerText =
        username;

    const storageKey =
        "chatsapp_profile_" +
        username.toLowerCase();

    const savedProfile =
        localStorage.getItem(
            storageKey
        );

    if (savedProfile) {

        try {

            const profile =
                JSON.parse(
                    savedProfile
                );

            document.getElementById(
                "displayName"
            ).value =
                profile.displayName ||
                username;

            document.getElementById(
                "bio"
            ).value =
                profile.bio ||
                "";

            selectedEmoji =
                profile.emoji ||
                "😀";

            selectedColor =
                profile.color ||
                "linear-gradient(135deg,#5b8cff,#9c5cff)";

        }

        catch (error) {

            console.warn(
                "Could not load saved profile:",
                error
            );

            document.getElementById(
                "displayName"
            ).value =
                username;

        }

    }

    else {

        document.getElementById(
            "displayName"
        ).value =
            username;

    }

    updateSelectedButtons();

    updatePreview();

}


/* =========================================
   EMOJI BUTTONS
========================================= */

document
    .querySelectorAll(".emoji-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                selectedEmoji =
                    this.dataset.emoji;

                updateSelectedButtons();

                updatePreview();

            }
        );

    });


/* =========================================
   COLOR BUTTONS
========================================= */

document
    .querySelectorAll(".color-button")
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                selectedColor =
                    this.dataset.color;

                updateSelectedButtons();

                updatePreview();

            }
        );

    });


/* =========================================
   LIVE TEXT PREVIEW
========================================= */

document.getElementById(
    "displayName"
).addEventListener(
    "input",
    updatePreview
);

document.getElementById(
    "bio"
).addEventListener(
    "input",
    updatePreview
);


/* =========================================
   SELECTED BUTTONS
========================================= */

function updateSelectedButtons() {

    document
        .querySelectorAll(".emoji-button")
        .forEach(button => {

            button.classList.toggle(
                "selected",
                button.dataset.emoji ===
                selectedEmoji
            );

        });

    document
        .querySelectorAll(".color-button")
        .forEach(button => {

            button.classList.toggle(
                "selected",
                button.dataset.color ===
                selectedColor
            );

        });

}


/* =========================================
   LIVE PREVIEW
========================================= */

function updatePreview() {

    const displayName =
        document.getElementById(
            "displayName"
        ).value.trim();

    const bio =
        document.getElementById(
            "bio"
        ).value.trim();


    /* Main avatar */

    const avatar =
        document.getElementById(
            "avatar"
        );

    avatar.innerText =
        selectedEmoji;

    avatar.style.background =
        selectedColor;


    /* Preview avatar */

    const previewAvatar =
        document.getElementById(
            "previewAvatar"
        );

    previewAvatar.innerText =
        selectedEmoji;

    previewAvatar.style.background =
        selectedColor;


    /* Preview name */

    document.getElementById(
        "previewName"
    ).innerText =
        displayName ||
        username ||
        "Your Name";


    /* Preview bio */

    document.getElementById(
        "previewBio"
    ).innerText =
        bio ||
        "Your bio will appear here.";

}


/* =========================================
   SAVE PROFILE
========================================= */

function saveProfile() {

    if (!username) {

        alert(
            "No logged-in user was found."
        );

        return;

    }


    const displayName =
        document.getElementById(
            "displayName"
        ).value.trim();

    const bio =
        document.getElementById(
            "bio"
        ).value.trim();


    if (!displayName) {

        alert(
            "Please enter a display name."
        );

        return;

    }


    const profile = {

        displayName:
            displayName,

        bio:
            bio,

        emoji:
            selectedEmoji,

        color:
            selectedColor

    };


    localStorage.setItem(

        "chatsapp_profile_" +
        username.toLowerCase(),

        JSON.stringify(profile)

    );


    /* Keep existing login/profile system working. */

    localStorage.setItem(
        "chatsapp_username",
        username
    );


    updatePreview();


    const savedMessage =
        document.getElementById(
            "savedMessage"
        );

    savedMessage.classList.add(
        "show"
    );


    setTimeout(
        function() {

            savedMessage.classList.remove(
                "show"
            );

        },
        2500
    );

}


/* =========================================
   BACK TO CHATSAPP
========================================= */

function goBack() {

    window.location.href =
        "index.html";

}


/* =========================================
   START
========================================= */

loadProfile();

</script>

</body>

</html>
