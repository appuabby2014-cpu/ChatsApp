
<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>My Profile - ChatsApp</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        "Inter",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 15% 20%,
            #253b6e 0%,
            transparent 35%
        ),
        radial-gradient(
            circle at 85% 80%,
            #34205d 0%,
            transparent 35%
        ),
        #080b14;

    color: white;

    display: flex;

    align-items: center;

    justify-content: center;

    padding: 25px;

}


/* =========================================
   PROFILE CARD
========================================= */

.profile-card {

    width: 100%;

    max-width: 520px;

    padding: 45px;

    border-radius: 28px;

    background:
        rgba(18,22,38,0.92);

    border:
        1px solid rgba(255,255,255,0.1);

    box-shadow:
        0 30px 90px rgba(0,0,0,0.55),
        inset 0 1px rgba(255,255,255,0.06);

    backdrop-filter: blur(20px);

    text-align: center;

}


/* =========================================
   AVATAR
========================================= */

.avatar {

    width: 100px;

    height: 100px;

    margin: 0 auto 20px;

    border-radius: 50%;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 42px;

    font-weight: 800;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #9c5cff
        );

    box-shadow:
        0 15px 45px rgba(91,140,255,0.35);

}


/* =========================================
   TITLE
========================================= */

h1 {

    margin: 0;

    font-size: 30px;

    letter-spacing: -1px;

}

.subtitle {

    color: #7f89a2;

    margin:
        8px 0 35px;

    font-size: 14px;

}


/* =========================================
   INFORMATION
========================================= */

.info-box {

    text-align: left;

    padding: 20px;

    margin-bottom: 15px;

    border-radius: 17px;

    background:
        #101525;

    border:
        1px solid #252c40;

}

.info-label {

    color: #737e98;

    font-size: 12px;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 8px;

}

.info-value {

    font-size: 17px;

    font-weight: 600;

    word-break: break-word;

}


/* =========================================
   PASSWORD
========================================= */

.password {

    letter-spacing: 4px;

    color: #b9c1d4;

}


/* =========================================
   BACK BUTTON
========================================= */

.back {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 14px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    color: white;

    font-size: 15px;

    font-weight: 700;

    cursor: pointer;

    transition: 0.2s;

}

.back:hover {

    transform: translateY(-2px);

    box-shadow:
        0 12px 30px rgba(91,140,255,0.3);

}


/* =========================================
   MOBILE
========================================= */

@media(max-width:600px) {

    .profile-card {

        padding: 30px 22px;

    }

}

</style>

</head>


<body>


<div class="profile-card">


    <div
        class="avatar"
        id="avatar"
    >
        U
    </div>


    <h1>
        My Profile
    </h1>


    <div class="subtitle">
        Your ChatsApp account
    </div>


    <div class="info-box">

        <div class="info-label">
            Username
        </div>

        <div
            class="info-value"
            id="username"
        >
            Loading...
        </div>

    </div>


    <div class="info-box">

        <div class="info-label">
            Password
        </div>

        <div class="info-value password">
            ••••••••••••
        </div>

    </div>


    <button
        class="back"
        onclick="goBack()"
    >
        ← Back to ChatsApp
    </button>


</div>


<script>

const username =
    localStorage.getItem(
        "chatsapp_username"
    );


if (username) {

    document.getElementById(
        "username"
    ).innerText =
        username;


    document.getElementById(
        "avatar"
    ).innerText =
        username
            .charAt(0)
            .toUpperCase();

}

else {

    document.getElementById(
        "username"
    ).innerText =
        "Unknown User";

}


function goBack() {

    window.location.href =
        "index.html";

}

</script>


</body>

</html>
