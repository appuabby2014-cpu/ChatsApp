<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Private Chat • ChatsApp</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

* {
    box-sizing:border-box;
}

body {
    margin:0;
    min-height:100vh;
    font-family:Inter,Arial,sans-serif;
    background:
        radial-gradient(circle at 15% 20%,#253b6e 0%,transparent 35%),
        radial-gradient(circle at 85% 80%,#34205d 0%,transparent 35%),
        #080b14;
    color:white;
}

/* ================================
   APP
================================ */

.chat-app {
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================================
   HEADER
================================ */

.chat-header {
    height:78px;
    display:flex;
    align-items:center;
    gap:15px;
    padding:0 25px;

    background:rgba(10,13,23,.94);
    border-bottom:1px solid #202638;

    backdrop-filter:blur(15px);
}

.back-button {
    width:42px;
    height:42px;

    border:1px solid #30384f;
    border-radius:12px;

    background:#151a2a;
    color:white;

    font-size:20px;
    cursor:pointer;

    transition:.2s;
}

.back-button:hover {
    background:#202a43;
    transform:translateX(-2px);
}

.chat-avatar {
    width:45px;
    height:45px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:linear-gradient(
        135deg,
        #5b8cff,
        #9c5cff
    );

    font-size:18px;
    font-weight:800;

    box-shadow:
        0 7px 25px rgba(91,140,255,.25);
}

.chat-user-info {
    flex:1;
}

.chat-username {
    font-size:17px;
    font-weight:800;
}

.chat-status {
    margin-top:3px;
    color:#737d95;
    font-size:12px;
}

.chat-status.online {
    color:#55d88a;
}

/* ================================
   MESSAGES
================================ */

.messages {
    flex:1;

    overflow-y:auto;

    padding:30px;

    display:flex;
    flex-direction:column;
    gap:10px;
}

/* MESSAGE ROW */

.message-row {
    display:flex;
    width:100%;
}

.message-row.mine {
    justify-content:flex-end;
}

.message-row.theirs {
    justify-content:flex-start;
}

/* MESSAGE BUBBLE */

.message-bubble {
    max-width:min(70%,500px);

    padding:12px 16px;

    border-radius:17px;

    background:#171d2e;

    border:1px solid #272f45;

    color:#edf0f7;

    font-size:14px;

    line-height:1.45;

    word-break:break-word;

    box-shadow:
        0 5px 20px rgba(0,0,0,.15);
}

.message-row.mine .message-bubble {
    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    border:none;

    border-bottom-right-radius:5px;
}

.message-row.theirs .message-bubble {
    border-bottom-left-radius:5px;
}

.message-time {
    margin-top:5px;
    font-size:10px;
    opacity:.55;
}

/* ================================
   EMPTY CHAT
================================ */

.empty-chat {
    flex:1;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    color:#737d95;
}

.empty-icon {
    font-size:60px;
    margin-bottom:15px;
}

.empty-chat h2 {
    color:white;
    margin:0 0 8px;
}

/* ================================
   INPUT
================================ */

.input-area {
    padding:18px 25px;

    background:rgba(10,13,23,.95);

    border-top:1px solid #202638;

    display:flex;
    gap:10px;
}

.message-input {
    flex:1;

    padding:15px 17px;

    border-radius:14px;

    border:1px solid #30384f;

    background:#0e1220;

    color:white;

    outline:none;

    font-size:14px;
}

.message-input:focus {
    border-color:#638cff;

    box-shadow:
        0 0 0 3px rgba(99,140,255,.1);
}

.send-button {
    width:90px;

    border:0;
    border-radius:14px;

    background:
        linear-gradient(
            135deg,
            #5b8cff,
            #795cff
        );

    color:white;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.send-button:hover {
    transform:translateY(-2px);

    box-shadow:
        0 8px 25px rgba(91,140,255,.3);
}

/* ================================
   LOADING
================================ */

.loading {
    display:flex;
    align-items:center;
    justify-content:center;

    flex:1;

    color:#737d95;

    font-size:14px;
}

/* ================================
   MOBILE
================================ */

@media(max-width:600px) {

    .chat-header {
        padding:0 15px;
    }

    .messages {
        padding:20px 15px;
    }

    .input-area {
        padding:12px 15px;
    }

    .message-bubble {
        max-width:82%;
    }

    .send-button {
        width:65px;
    }

}

</style>

</head>

<body>

<div class="chat-app">

    <!-- HEADER -->

    <div class="chat-header">

        <button
            class="back-button"
            onclick="goBack()"
        >
            ←
        </button>

        <div
            id="chatAvatar"
            class="chat-avatar"
        >
            U
        </div>

        <div class="chat-user-info">

            <div
                id="chatUsername"
                class="chat-username"
            >
                Loading...
            </div>

            <div
                id="chatStatus"
                class="chat-status"
            >
                Checking status...
            </div>

        </div>

    </div>


    <!-- MESSAGES -->

    <div
        id="loading"
        class="loading"
    >
        Loading conversation...
    </div>

    <div
        id="messages"
        class="messages"
        style="display:none;"
    ></div>


    <!-- INPUT -->

    <div class="input-area">

        <input
            id="messageInput"
            class="message-input"
            type="text"
            placeholder="Type a message..."
            maxlength="500"
            autocomplete="off"
        >

        <button
            class="send-button"
            onclick="sendMessage()"
        >
            Send
        </button>

    </div>

</div>


<script>

/* =========================================
   SUPABASE
========================================= */

const SUPABASE_URL =
    "https://kopzrnpporfdwauwlhni.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_bbxmPB71ADnIqe3oPB3MuQ_EWa4n_Ph";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================
   VARIABLES
========================================= */

let currentUsername = "";

let targetUsername = "";

let privateChannel = null;


/* =========================================
   GET USER
========================================= */

async function getCurrentUser() {

    const { data } =
        await supabaseClient
        .auth
        .getSession();

    if(
        !data ||
        !data.session ||
        !data.session.user
    ) {

        window.location.href =
            "index.html";

        return false;
    }

    currentUsername =
        data.session.user
        .user_metadata?.username ||
        data.session.user.email
        .split("@")[0];

    return true;
}


/* =========================================
   LOAD TARGET USER
========================================= */

function getTargetUser() {

    targetUsername =
        localStorage.getItem(
            "chatsapp_target_user"
        );

    if(!targetUsername) {

        alert(
            "No user selected."
        );

        window.location.href =
            "index.html";

        return false;
    }

    return true;
}


/* =========================================
   HEADER
========================================= */

async function loadTargetProfile() {

    document.getElementById(
        "chatUsername"
    ).innerText =
        targetUsername;

    document.getElementById(
        "chatAvatar"
    ).innerText =
        targetUsername
        .charAt(0)
        .toUpperCase();


    const { data } =
        await supabaseClient
        .from("profiles")
        .select("online")
        .eq(
            "username",
            targetUsername
        )
        .maybeSingle();


    const status =
        document.getElementById(
            "chatStatus"
        );


    if(data && data.online) {

        status.innerText =
            "● Online";

        status.className =
            "chat-status online";

    } else {

        status.innerText =
            "● Offline";

        status.className =
            "chat-status";

    }
}


/* =========================================
   LOAD MESSAGES
========================================= */

async function loadMessages() {

    const loading =
        document.getElementById(
            "loading"
        );

    const messages =
        document.getElementById(
            "messages"
        );


    /*
       PRIVATE_MESSAGES TABLE

       Required columns:

       id
       sender
       receiver
       message
       created_at
    */


    const { data,error } =
        await supabaseClient
        .from("private_messages")
        .select("*")
        .or(
            `and(sender.eq.${currentUsername},receiver.eq.${targetUsername}),and(sender.eq.${targetUsername},receiver.eq.${currentUsername})`
        )
        .order(
            "created_at",
            {
                ascending:true
            }
        );


    if(error) {

        console.error(
            "Could not load private messages:",
            error
        );

        loading.innerText =
            "Could not load messages.";

        return;
    }


    loading.style.display =
        "none";

    messages.style.display =
        "flex";

    messages.innerHTML = "";


    if(!data || data.length === 0) {

        showEmptyMessage();

        return;
    }


    data.forEach(
        message => {

            displayMessage(
                message
            );

        }
    );


    scrollToBottom();
}


/* =========================================
   DISPLAY MESSAGE
========================================= */

function displayMessage(message) {

    const box =
        document.getElementById(
            "messages"
        );


    const row =
        document.createElement("div");


    row.className =
        "message-row " +
        (
            message.sender ===
            currentUsername
                ? "mine"
                : "theirs"
        );


    const bubble =
        document.createElement("div");


    bubble.className =
        "message-bubble";


    bubble.innerText =
        message.message;


    row.appendChild(
        bubble
    );


    box.appendChild(
        row
    );
}


/* =========================================
   EMPTY CHAT
========================================= */

function showEmptyMessage() {

    const box =
        document.getElementById(
            "messages"
        );


    box.innerHTML = `

        <div class="empty-chat">

            <div>

                <div class="empty-icon">
                    💬
                </div>

                <h2>
                    Start the conversation
                </h2>

                <p>
                    Send ${escapeHTML(targetUsername)}
                    a message!
                </p>

            </div>

        </div>

    `;
}


/* =========================================
   SEND MESSAGE
========================================= */

async function sendMessage() {

    const input =
        document.getElementById(
            "messageInput"
        );


    const text =
        input.value.trim();


    if(!text) return;


    const { data,error } =
        await supabaseClient
        .from("private_messages")
        .insert({

            sender:
                currentUsername,

            receiver:
                targetUsername,

            message:
                text

        })
        .select()
        .single();


    if(error) {

        console.error(
            "Message error:",
            error
        );

        alert(
            "Message could not be sent."
        );

        return;
    }


    input.value = "";


    displayMessage(
        data
    );


    scrollToBottom();
}


/* =========================================
   REAL-TIME CHAT
========================================= */

function subscribeToChat() {

    if(privateChannel) {

        supabaseClient
            .removeChannel(
                privateChannel
            );

    }


    privateChannel =
        supabaseClient
        .channel(
            "private-chat-" +
            currentUsername +
            "-" +
            targetUsername
        )
        .on(
            "postgres_changes",
            {
                event:"INSERT",
                schema:"public",
                table:"private_messages"
            },
            payload => {

                const message =
                    payload.new;


                const isThisConversation =
                    (
                        message.sender ===
                        currentUsername &&
                        message.receiver ===
                        targetUsername
                    )
                    ||
                    (
                        message.sender ===
                        targetUsername &&
                        message.receiver ===
                        currentUsername
                    );


                if(!isThisConversation) {
                    return;
                }


                /*
                   Don't display our own message
                   twice because sendMessage()
                   already displays it.
                */

                if(
                    message.sender ===
                    currentUsername
                ) {
                    return;
                }


                displayMessage(
                    message
                );


                scrollToBottom();

            }
        )
        .subscribe();

}


/* =========================================
   SCROLL
========================================= */

function scrollToBottom() {

    const box =
        document.getElementById(
            "messages"
        );

    setTimeout(
        function() {

            box.scrollTop =
                box.scrollHeight;

        },
        50
    );
}


/* =========================================
   BACK
========================================= */

function goBack() {

    window.location.href =
        "index.html";
}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.innerText =
        text;

    return div.innerHTML;
}


/* =========================================
   ENTER KEY
========================================= */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    function(event) {

        if(event.key === "Enter") {

            event.preventDefault();

            sendMessage();

        }

    }
);


/* =========================================
   START
========================================= */

async function startChat() {

    const loggedIn =
        await getCurrentUser();

    if(!loggedIn) return;


    const hasTarget =
        getTargetUser();

    if(!hasTarget) return;


    await loadTargetProfile();

    await loadMessages();

    subscribeToChat();

}


startChat();

</script>

</body>
</html>
